name: Apply ETA Patch to index.html

on:
  push:
    paths:
      - '.github/eta-patch.html'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Grund für manuelles Ausführen'
        required: false
        default: 'Manueller Patch-Apply'

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply ETA Patch
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // Dateien lesen
            let index = fs.readFileSync('index.html', 'utf8');
            const patch = fs.readFileSync('.github/eta-patch.html', 'utf8');

            // Patch-Block aus eta-patch.html extrahieren
            const PATCH_START = '<!-- ETA-PATCH-START';
            const PATCH_END   = '<!-- ETA-PATCH-END -->';
            const pStart = patch.indexOf(PATCH_START);
            const pEnd   = patch.indexOf(PATCH_END) + PATCH_END.length;
            if (pStart < 0 || pEnd < PATCH_END.length) {
              core.setFailed('ETA-PATCH Marker nicht gefunden in .github/eta-patch.html');
              return;
            }
            const newPatch = patch.slice(pStart, pEnd);

            // Patch in index.html ersetzen
            const iStart = index.indexOf(PATCH_START);
            const iEnd   = index.indexOf(PATCH_END) + PATCH_END.length;
            let newIndex;
            if (iStart > -1 && iEnd >= PATCH_END.length) {
              // Bestehenden Patch ersetzen
              newIndex = index.slice(0, iStart) + newPatch + '\n' + index.slice(iEnd);
              console.log('Bestehender Patch ersetzt.');
            } else {
              // Kein Patch vorhanden — vor </body> einfügen
              if (!index.includes('</body>')) {
                core.setFailed('Kein </body> in index.html gefunden');
                return;
              }
              newIndex = index.replace('</body>', newPatch + '\n</body>');
              console.log('Patch neu eingefügt.');
            }

            // Merge-Konflikte auflösen falls vorhanden
            // 1) Vollständige Konflikte: HEAD-Teil behalten, Rest verwerfen
            const fullConflict = /<<<<<<< HEAD\n([\s\S]*?)=======\n[\s\S]*?>>>>>>> [^\n]*\n?/g;
            const fullCount = (newIndex.match(/<<<<<<< HEAD/g) || []).length;
            if (fullCount > 0) {
              newIndex = newIndex.replace(fullConflict, (_, head) => head);
            }
            // 2) Verwaiste Marker (ohne Gegenstück) zeilenweise entfernen
            const orphans = (newIndex.match(/^(<<<<<<<|=======|>>>>>>>)/gm) || []).length;
            if (orphans > 0) {
              newIndex = newIndex.replace(/^<<<<<<< ?HEAD ?\n/gm, '');
              newIndex = newIndex.replace(/^=======* ?\n/gm, '');
              newIndex = newIndex.replace(/^>>>>>>> [^\n]*\n/gm, '');
            }
            if (fullCount > 0 || orphans > 0) {
              console.log(`${fullCount} Konflikte + ${orphans} verwaiste Marker bereinigt.`);
            }
            // Sicherheits-Check: keine Marker mehr übrig
            if (/<<<<<<<|>>>>>>>/.test(newIndex)) {
              core.setFailed('Konflikt-Marker konnten nicht vollständig entfernt werden!');
              return;
            }

            fs.writeFileSync('index.html', newIndex);
            console.log(`index.html aktualisiert (${newIndex.length} Bytes).`);

      - name: SW Cache-Version automatisch bumpen
        run: |
          TIMESTAMP=$(date +%s)
          sed -i "s/const CACHE = '[^']*'/const CACHE = 'et-auto-${TIMESTAMP}'/" sw.js
          echo "SW Cache gesetzt: et-auto-${TIMESTAMP}"

      - name: Commit & Push
        run: |
          git config user.name  "ETA Deploy Bot"
          git config user.email "eta-bot@users.noreply.github.com"
          git add index.html sw.js
          # Nur committen wenn es wirklich Änderungen gibt
          if git diff --staged --quiet; then
            echo "Keine Änderungen — kein Commit nötig."
          else
            VERSION=$(grep -o 'ETA-PATCH-START[^>]*' .github/eta-patch.html | head -1 | sed 's/ETA-PATCH-START · //' | cut -c1-20)
            git commit -m "Auto-Deploy: ETA Patch ${VERSION} · $(date +'%d.%m.%Y %H:%M')"
            git push
            echo "Erfolgreich gepusht!"
          fi
