name: ETA - Neues Wort hinzufuegen oder Bild fixen

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  add-or-fix-word:
    if: startsWith(github.event.issue.title, 'ETA:') || startsWith(github.event.issue.title, 'ETA-FIX:')
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install anthropic openpyxl requests

      - name: Bot ausfuehren
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: python .github/scripts/eta_process.py

      - name: Aenderungen committen
        id: commit
        run: |
          git config user.name "ETA Bot"
          git config user.email "eta-bot@users.noreply.github.com"
          # Aufraeumen: die zwei tmp-Dateien sollen NICHT mit committed werden
          git add index.html vokabeln.xlsx || true
          if ! git diff --cached --quiet; then
            COMMIT_MSG=$(cat .github/commit_msg.txt 2>/dev/null || echo "ETA-Bot: Aenderungen aus Issue #${{ github.event.issue.number }}")
            git commit -m "$COMMIT_MSG"
            git push
            echo "committed=true" >> $GITHUB_OUTPUT
          else
            echo "committed=false" >> $GITHUB_OUTPUT
            echo "Keine Aenderungen zum Committen."
          fi

      - name: Issue schliessen mit Bot-Nachricht
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MSG=$(cat .github/issue_msg.txt 2>/dev/null || echo "Bot ausgefuehrt.")
          gh issue close ${{ github.event.issue.number }} --comment "$MSG" --repo ${{ github.repository }}
