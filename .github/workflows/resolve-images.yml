name: Bild-URLs aufloesen (IMG_URLS)

on:
  schedule:
    # 17:30 UTC — laeuft nach der taeglichen ETA-Sammelverarbeitung (17:00 UTC),
    # damit auch frisch angelegte Woerter sofort eine feste Bild-URL bekommen.
    - cron: '30 17 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Grund fuer manuelles Ausfuehren'
        required: false
        default: 'Manueller Bild-Backfill'

permissions:
  contents: write
# Schreibende Laeufe serialisieren (gemeinsame Gruppe mit eta.yml/eta-daily.yml):
# verhindert Push-Kollisionen zwischen gleichzeitigen Bot-Laeufen.
concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v5

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install requests openpyxl

      - name: Wikipedia-Thumbnails aufloesen
        run: python .github/scripts/resolve_images.py

      - name: vokabeln.xlsx aus words.js generieren
        run: python .github/scripts/build_xlsx.py

      - name: App-Dateien validieren (Abbruch bei Fehler -> kein Commit)
        run: python .github/scripts/validate_app.py

      - name: Aenderungen committen
        run: |
          git config user.name "ETA Bot"
          git config user.email "eta-bot@users.noreply.github.com"
          git add words.js vokabeln.xlsx || true
          if ! git diff --cached --quiet; then
            git commit -m "Bilder: feste Thumbnail-URLs in IMG_URLS aufgeloest"
            git pull --rebase origin main || true
            git push
          else
            echo "Keine Aenderungen zum Committen."
          fi
