name: ETA - Taegliche Sammelverarbeitung

on:
  schedule:
    # 17:00 UTC = 19:00 Uhr in der Schweiz/Deutschland im Sommer (CEST, UTC+2),
    # 18:00 Uhr im Winter (CET, UTC+1). GitHub-Cron kennt keine Sommerzeit.
    - cron: '0 17 * * *'
  workflow_dispatch:   # erlaubt manuelles Ausloesen ueber den Actions-Tab

permissions:
  contents: write
# Schreibende Laeufe serialisieren (gemeinsame Gruppe mit eta.yml/resolve-images.yml):
# verhindert Push-Kollisionen zwischen gleichzeitigen Bot-Laeufen.
concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  batch:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v5

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install anthropic openpyxl requests

      - name: Gesammelte Woerter verarbeiten
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python .github/scripts/eta_batch.py

      - name: App-Dateien validieren (Abbruch bei Fehler -> kein Commit)
        run: python .github/scripts/validate_app.py

      - name: Aenderungen committen
        run: |
          git config user.name "ETA Bot"
          git config user.email "eta-bot@users.noreply.github.com"
          git add words.js vokabeln.xlsx neue_woerter.txt || true
          if ! git diff --cached --quiet; then
            git commit -m "ETA: Taegliche Sammelverarbeitung neuer Woerter"
            git pull --rebase origin main || true
            git push
          else
            echo "Keine Aenderungen zum Committen."
          fi
