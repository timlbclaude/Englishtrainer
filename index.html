<script id="eta-v3-script">
(function(){
  var svg = window.__etaSvg || function(){ return ''; };
  function $id(x){ return document.getElementById(x); }

  /* ── 1. Kopfzeile aufbauen ── */
  var bar = document.createElement('div');
  bar.id = 'eta-topbar';
  bar.innerHTML = '<div class="v3-title"><div class="t1" id="v3T1"></div><div class="t2" id="v3T2"></div></div>'
    + '<div class="v3-actions">'
    + '<button class="v3-chipbtn" id="v3Streak" aria-label="Streak anzeigen">' + svg('flame',12) + ' <span id="v3StreakN">0</span></button>'
    + '<button class="v3-iconbtn" id="v3Theme" aria-label="Theme wechseln"></button>'
    + '<button class="v3-iconbtn" id="v3Set" aria-label="Einstellungen">' + svg('settings',15) + '</button>'
    + '</div>';
  document.body.appendChild(bar);
  $id('v3Streak').onclick = function(){ if (typeof window.openStreakSheet === 'function') window.openStreakSheet(); };
  function themeIcon(){ try { $id('v3Theme').innerHTML = svg(document.body.classList.contains('dark') ? 'sun' : 'moon', 15); } catch(e){} }
  $id('v3Theme').onclick = function(){ if (typeof toggleTheme === 'function') toggleTheme(); else document.body.classList.toggle('dark'); setTimeout(themeIcon, 40); };
  themeIcon();
  $id('v3Set').onclick = function(){ var b = $id('eta-settings-btn'); if (b) b.click(); };

  var TITLES = {
    train:['SPACED REPETITION','Training'], flash:['FREIE ÜBUNG','Karteikarten'],
    quiz:['MULTIPLE CHOICE','Quiz'], fill:['SELBER TIPPEN','Lückentext'],
    list:['WORTSCHATZ','Wortliste'], type:['AKTIV ERINNERN','Tippmodus'],
    hardlist:['HOHE FEHLERQUOTE','Schwierige Wörter']
  };
  function greet(){ var h = new Date().getHours(); return h<5?'Gute Nacht':h<11?'Guten Morgen':h<17?'Hallo':'Guten Abend'; }
  function dateDE(){ var d=new Date(), t=['SO','MO','DI','MI','DO','FR','SA'], m=['JAN','FEB','MÄR','APR','MAI','JUN','JUL','AUG','SEP','OKT','NOV','DEZ']; return t[d.getDay()]+', '+d.getDate()+'. '+m[d.getMonth()]; }
  window.__v3SetTopbar = function(t1, t2){ var a=$id('v3T1'), b=$id('v3T2'); if(a) a.textContent=t1||''; if(b) b.textContent=t2||''; };
  function updateTopbar(){
    try { $id('v3StreakN').textContent = (typeof Stats!=='undefined' && Stats.state && Stats.state.streak) || 0; } catch(e){}
    var mo = window.mode;
    if (mo === 'today'){ window.__v3SetTopbar(dateDE(), greet()); return; }
    if (mo === 'train' || mo === 'flash' || mo === 'fill' || mo === 'quiz') return; // diese Renderer setzen den Titel selbst (v3/v3.1/v3.2)
    var t = TITLES[mo]; if (t) window.__v3SetTopbar(t[0], t[1]);
  }

  /* ── 2. FAB nur zeigen, wo er nicht stört ── */
  function updateFab(){
    var f = $id('fabAdd'); if (!f) return;
    var mo = window.mode;
    f.style.display = (mo==='today' || mo==='list' || mo==='hardlist') ? 'flex' : 'none';
  }

  /* ── 3. Überschneidungsfreie Zählung (Fix „454 Wörter warten") ── */
  function counts(){
    var c = { due:0, fresh:0, learning:0, mast:0 };
    try {
      var today = SRS.todayISO();
      WORDS.forEach(function(w){
        var e = SRS.state[w.id];
        // Wichtig: SRS.entry() hier NICHT verwenden — das legt sonst beim bloßen
        // Lesen leere Einträge an. Einträge ohne einzige Antwort zählen als „neu".
        if (!e || ((e.level||0) === 0 && ((e.ok||0) + (e.wrong||0)) === 0)){ c.fresh++; return; }
        if ((e.level||0) >= 7){ c.mast++; return; }
        if (e.nextDue <= today) c.due++; else c.learning++;
      });
    } catch(e){}
    return c;
  }
  function hardCount(){
    var n = 0;
    try {
      WORDS.forEach(function(w){
        var e = SRS.state[w.id]; if (!e) return;   // read-only, kein entry()!
        var t = (e.ok||0)+(e.wrong||0);
        if (t >= 2 && (e.wrong||0)/t > 0.4) n++;
      });
    } catch(e){}
    return n;
  }
  function weekDots(){
    var out = '';
    try {
      var hist = Stats.state.history || []; var byDate = {};
      hist.forEach(function(s){ byDate[s.date] = (byDate[s.date]||0) + (s.correct||0); });
      var today = new Date();
      for (var i=6; i>=0; i--){
        var dd = new Date(today); dd.setDate(today.getDate()-i);
        var iso = dd.toISOString().slice(0,10);
        out += '<i class="' + ((byDate[iso]||0)>0 ? 'done' : '') + (i===0 ? ' today' : '') + '"></i>';
      }
    } catch(e){ for (var j=0;j<7;j++) out += '<i></i>'; }
    return '<div class="v3t-week">' + out + '</div>';
  }
  function ringHTML(done, goal){
    var size=64, st=7, r=(size-st)/2, c=2*Math.PI*r, pct=goal>0?Math.min(1,done/goal):0;
    return '<div class="v3t-ring"><svg width="'+size+'" height="'+size+'">'
      + '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="var(--card-hover)" stroke-width="'+st+'"/>'
      + '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="url(#rg)" stroke-width="'+st+'" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+(c*(1-pct))+'"/>'
      + '<defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#7C8CFF"/><stop offset="100%" stop-color="#5EE3D6"/></linearGradient></defs>'
      + '</svg><div class="rt"><b>'+done+'</b><small>von '+goal+'</small></div></div>';
  }

  /* ── 4. HEUTE (v3): eine Bildschirmseite, keine Duplikate ── */
  function renderTodayV3(){
    var app = $id('app'); if (!app) return;
    var c = counts();
    var goal=20, prog=0, xp=0, streak=0;
    try { goal = Stats.state.dailyGoal || 20; prog = Stats.todayProgress(); xp = Stats.state.xp || 0; streak = Stats.state.streak || 0; } catch(e){}
    var open = c.due + c.fresh;
    var total = (typeof WORDS !== 'undefined') ? WORDS.length : 0;
    var hc = hardCount();
    var ctaMode = open > 0 ? 'train' : 'flash';
    var ctaMain = c.due > 0 ? 'Training fortsetzen' : (c.fresh > 0 ? 'Neue Wörter lernen' : 'Frei üben');
    var ctaSub  = open > 0 ? (c.due + ' fällig · ' + c.fresh + ' neu') : 'Alles erledigt — Karteikarten';
    app.innerHTML = '<div class="v3t">'
      + '<div class="v3t-hero">'
      +   '<div class="v3t-hero-row">' + ringHTML(prog, goal)
      +   '<div style="flex:1;min-width:0">'
      +     '<div class="v3t-pill">' + (open>0 ? 'Bereit zum Lernen' : 'Tagesziel im Blick') + '</div>'
      +     '<div class="v3t-headline">' + total + ' Wörter im Wortschatz</div>'
      +     '<div class="v3t-counts"><b class="c-due">' + c.due + '</b> wiederholen &nbsp;·&nbsp; <b class="c-new">' + c.fresh + '</b> neu &nbsp;·&nbsp; <b class="c-mast">' + c.mast + '</b> gemeistert</div>'
      +   '</div></div>'
      +   '<button class="v3t-cta" onclick="setMode(\'' + ctaMode + '\')"><span class="l"><small>' + ctaSub + '</small><b>' + ctaMain + '</b></span><span class="arr">' + svg('play',13,2) + '</span></button>'
      + '</div>'
      + '<div class="v3t-chips">'
      +   '<div class="v3t-chip" onclick="if(window.openStreakSheet)window.openStreakSheet()"><div class="v">🔥 ' + streak + '</div><div class="l">Streak</div>' + weekDots() + '</div>'
      +   '<div class="v3t-chip" onclick="setMode(\'list\')"><div class="v">' + total + '</div><div class="l">Wortschatz</div></div>'
      +   '<div class="v3t-chip"><div class="v">⭐ ' + xp + '</div><div class="l">XP</div></div>'
      + '</div>'
      + '<div class="v3t-label">Freies Üben</div>'
      + '<div class="v3t-tiles">'
      +   '<div class="v3t-tile" onclick="setMode(\'type\')"><span class="ico">' + svg('fill',16) + '</span><div class="n">Tippmodus</div><div class="s">Aktiv erinnern · selbst tippen</div></div>'
      +   '<div class="v3t-tile" onclick="setMode(\'hardlist\')"><span class="ico" style="color:var(--err)">' + svg('trending',16) + '</span><div class="n">Schwierige Wörter</div><div class="s">Hohe Fehlerquote</div>' + (hc>0 ? '<span class="cnt">' + hc + '</span>' : '') + '</div>'
      + '</div>'
      + '</div>';
  }
  window.renderToday = renderTodayV3; // Alt-Referenzen umbiegen
  window.__v3RenderToday = renderTodayV3;

  /* ── 5. TRAINING (v3): Karte zuerst, Sekundäres ins ⓘ-Sheet ── */
  window.__v3TrainInfo = function(){
    var sh = $id('v3-info-sheet');
    if (!sh){
      sh = document.createElement('div'); sh.id = 'v3-info-sheet';
      sh.onclick = function(ev){ if (ev.target === sh) sh.classList.remove('open'); };
      document.body.appendChild(sh);
    }
    var inner = '';
    try { inner = goalAndAccuracyHTML() + historyHTML(); } catch(e){ inner = '<p style="color:var(--muted);font-size:13px">Noch keine Daten.</p>'; }
    sh.innerHTML = '<div class="v3-sheet-inner"><span class="v3-sheet-handle"></span><h3>📊 Session &amp; Tagesziel</h3>' + inner
      + '<button class="v3-sheet-reset" onclick="resetSRS()">Lernfortschritt zurücksetzen</button>'
      + '<button class="v3-sheet-close" onclick="document.getElementById(\'v3-info-sheet\').classList.remove(\'open\')">Schließen</button></div>';
    sh.classList.add('open');
  };
  window.__v3ToggleDir = function(){
    // FIX (v3.3): learnDir ist eine top-level let-Variable und existiert NICHT als
    // window.learnDir — der alte Zugriff war immer undefined, dadurch setzte der
    // Umschalter stets 'en-de' und DE→EN war unerreichbar. Lexikalischer Zugriff:
    if (typeof setLearnDir === 'function') setLearnDir(learnDir === 'en-de' ? 'de-en' : 'en-de');
  };

  window.renderTrain = function(){
    var app = $id('app'); if (!app) return;
    if (!trainDeck.length){ trainDeck = SRS.dueQueue(WORDS); }

    if (!trainDeck.length || trainIdx >= trainDeck.length){
      window.__v3SetTopbar('SPACED REPETITION', 'Training');
      app.innerHTML = '<div class="srs-empty">'
        + '<div class="srs-empty-emoji">🎉</div>'
        + '<h2>' + (trainIdx > 0 ? 'Sitzung abgeschlossen!' : 'Heute alles erledigt!') + '</h2>'
        + '<p>' + (trainIdx > 0
            ? 'Du hast ' + trainIdx + ' Wörter durchgegangen. Komm morgen wieder – die nächste Wiederholung wartet.'
            : 'Es gibt aktuell keine fälligen Wörter. Schau später wieder vorbei oder übe frei in den anderen Modi.') + '</p>'
        + '<div class="srs-actions">'
        + '<button class="btn btn-primary" onclick="setMode(\'flash\')">🃏 Freie Übung: Karteikarten</button>'
        + '<button class="btn btn-outline" onclick="setMode(\'today\')">🕐 Zur Übersicht</button>'
        + '</div>'
        + '<div class="srs-settings-row"><button class="srs-reset-btn" onclick="window.__v3TrainInfo()">Details &amp; Optionen</button></div>'
        + '</div>';
      return;
    }

    var w = trainDeck[trainIdx];
    var e = SRS.entry(w.id);
    var lvl = e.level || 0;
    var src = getImg(w);
    var imgFront = src
      ? '<img class="fc-image" src="' + src + '" alt="' + w.word + '" referrerpolicy="no-referrer" loading="lazy" onerror="console.warn(\'Bild fehlgeschlagen:\',this.src);this.style.display=\'none\'">'
      : (window.__v3Ph ? window.__v3Ph(w, 'lg') : '<div class="fc-img-placeholder" style="background:var(--primary-bg)">' + icon(w) + '</div>');
    var examplesHTML = w.examples.map(function(ex){
      return '<div class="back-ex"><button class="speak-btn speak-sm" onclick="event.stopPropagation();speakText(this)" title="Satz vorlesen">🔊</button><strong>📝 Beispiel</strong><span class="ex-text">' + ex + '</span></div>';
    }).join('');
    var enDE_t = learnDir === 'en-de';
    var faceFront = enDE_t
      ? imgFront + '<div class="fc-word">' + w.word + '</div><div class="speak-row"><button class="speak-btn" onclick="speakWord(\'' + w.word.replace(/'/g, "\\'") + '\')">🔊</button><span class="fc-pronunciation">' + w.pronunciation + '</span></div><div class="fc-badges"><span class="badge badge-type">' + w.wordType + '</span><span class="badge ' + diffColor(w.difficulty) + '">' + w.difficulty + '</span><span class="level-badge lvl-' + lvl + '">Stufe ' + lvl + '</span></div><div class="fc-front-example"><button class="speak-btn speak-sm" onclick="event.stopPropagation();speakText(this)" title="Satz vorlesen">🔊</button>📝 „<span class="ex-text">' + w.examples[0] + '</span>"</div><div class="fc-hint">Tippe, um umzudrehen ↕</div>'
      : imgFront + '<div class="fc-word" style="font-size:20px;text-align:center;padding:0 12px">' + w.translation + '</div><div class="fc-badges" style="margin-top:10px"><span class="badge badge-type">' + w.wordType + '</span><span class="badge ' + diffColor(w.difficulty) + '">' + w.difficulty + '</span><span class="level-badge lvl-' + lvl + '">Stufe ' + lvl + '</span></div><div class="fc-front-example">📝 „' + (w.exampleDE || w.examples[0]) + '"</div><div class="fc-hint">Tippe, um umzudrehen ↕</div>';
    var faceBack = enDE_t
      ? '<div class="back-section-label">📖 Definition</div><div class="back-def">' + w.definition + '</div><div class="back-section-label">📝 Beispiele</div>' + examplesHTML + '<div class="back-translation-small">🇩🇪 ' + w.translation + '</div>'
      : '<div class="fc-word" style="font-size:28px;margin-bottom:6px">' + w.word + '</div><div class="speak-row" style="margin-bottom:12px"><button class="speak-btn" onclick="speakWord(\'' + w.word.replace(/'/g, "\\'") + '\')">🔊</button><span class="fc-pronunciation">' + w.pronunciation + '</span></div><div class="back-section-label">📖 Definition</div><div class="back-def">' + w.definition + '</div><div class="back-section-label">📝 Beispiele</div>' + examplesHTML;

    var pct = Math.round(((trainIdx+1) / trainDeck.length) * 100);
    app.innerHTML =
      '<div class="v3tr-head">'
      + '<span class="v3tr-lvl">Stufe ' + lvl + '/7</span>'
      + '<div class="v3tr-prog" title="Karte ' + (trainIdx+1) + ' von ' + trainDeck.length + '"><i style="width:' + pct + '%"></i></div>'
      + '<button class="v3tr-btn" onclick="window.__v3ToggleDir()" aria-label="Lernrichtung wechseln">' + (enDE_t ? 'EN→DE' : 'DE→EN') + ' ⇄</button>'
      + '<button class="v3tr-btn icon" onclick="window.__v3TrainInfo()" aria-label="Session-Details">' + svg('info',15) + '</button>'
      + '</div>'
      + '<div class="v3-scene"><div class="scene">'
      + '<div class="flashcard ' + (trainFlipped ? 'flipped' : '') + '" id="trainFc" onclick="flipTrain()">'
      + '<div class="face">' + faceFront + '</div>'
      + '<div class="face face-back">' + faceBack + '</div>'
      + '</div></div></div>'
      + '<div class="srs-rate-row" id="trainRate" style="display:' + (trainFlipped ? 'flex' : 'none') + '">'
      + '<button class="btn btn-srs-err" onclick="rateTrain(false)">✗ Nicht gewusst</button>'
      + '<button class="btn btn-srs-ok" onclick="rateTrain(true)">✓ Gewusst</button>'
      + '</div>';
    window.__v3SetTopbar('KARTE ' + (trainIdx+1) + ' / ' + trainDeck.length, 'Training');
  };

  /* ── 6. setMode/render einhängen (nach v2.4/v2.5) ── */
  var prevSetMode = window.setMode;
  window.setMode = function(m, btn){
    if (m === 'today'){
      window.mode = 'today';
      var nt = document.querySelector('.nav-tabs');
      if (nt) nt.querySelectorAll('.tab').forEach(function(t){ t.classList.toggle('active', t.dataset.mode === 'today'); });
      try { window.scrollTo(0,0); } catch(e){}
      renderTodayV3(); updateTopbar(); updateFab();
      return;
    }
    var r = (typeof prevSetMode === 'function') ? prevSetMode.apply(this, arguments) : undefined;
    updateTopbar(); updateFab();
    return r;
  };
  var prevRender = window.render;
  window.render = function(){
    if (window.mode === 'today'){ renderTodayV3(); updateTopbar(); updateFab(); return; }
    var r = (typeof prevRender === 'function') ? prevRender.apply(this, arguments) : undefined;
    updateTopbar(); updateFab();
    return r;
  };

  /* ── 7. Start: Heute-Screen sofort übernehmen ── */
  if (window.mode === 'today'){ try { renderTodayV3(); } catch(e){ console.warn('[v3] renderToday:', e); } }
  updateTopbar(); updateFab();
  // v2.4 rendert seinen alten Heute-Screen nochmal per 200ms-Timer nach → danach übernehmen
  setTimeout(function(){ if (window.mode === 'today'){ try { renderTodayV3(); updateTopbar(); } catch(e){} } }, 350);
  console.log('[ETA v3.0] Focus First aktiv');
})();
</script>

<script id="eta-v31-script">
(function(){
  var svg = window.__etaSvg || function(){ return ''; };
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(m){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]; }); }

  /* ── Illustrations-Platzhalter (Kategorie-Farbverlauf + Symbol) ── */
  var CATEMOJI  = { 'Reisen':'✈️', 'Kitchen/Cooking':'🍳', 'TV':'🎬', 'Allgemein':'💭' };
  var TYPEEMOJI = { 'Verb':'⚡', 'Adjektiv':'🎨', 'Adverb':'💨', 'Phrase':'💬', 'Praeposition':'🧭', 'Präposition':'🧭', 'Konjunktion':'🔗' };
  var KNOWNCAT  = { 'Reisen':1, 'Kitchen/Cooking':1, 'TV':1, 'Allgemein':1 };
  window.__v3Ph = function(w, size){
    var cat = (w && w.category) || '_default';
    var emoji = (w && w.wordType !== 'Nomen' && TYPEEMOJI[w.wordType]) || CATEMOJI[cat] || '📝';
    return '<div class="v3-ph ' + (size||'lg') + '" data-cat="' + (KNOWNCAT[cat] ? cat : '_default') + '">' + emoji + '</div>';
  };

  function headRow(pos, total, extra){
    var pct = total ? Math.round((pos/total)*100) : 0;
    return '<div class="v3tr-head">'
      + '<span class="v31-pos">' + pos + ' / ' + total + '</span>'
      + '<div class="v3tr-prog"><i style="width:' + pct + '%"></i></div>'
      + (extra || '')
      + '</div>';
  }
  function dirBtn(){
    return '<button class="v3tr-btn" onclick="window.__v3ToggleDir()" aria-label="Lernrichtung wechseln">' + (learnDir === 'en-de' ? 'EN→DE' : 'DE→EN') + ' ⇄</button>';
  }

  /* ── KARTEIKARTEN: Card-first ── */
  var prevRenderFlash = window.renderFlash;
  window.renderFlash = function(){
    if (!deck.length || flashShowPicker || idx >= deck.length){
      if (window.__v3SetTopbar) window.__v3SetTopbar('FREIE ÜBUNG', 'Karteikarten');
      return prevRenderFlash.apply(this, arguments);
    }
    var app = document.getElementById('app'); if (!app) return;
    var w = deck[idx];
    var src = getImg(w);
    var imgFront = src
      ? '<img class="fc-image" src="' + src + '" alt="' + esc(w.word) + '" referrerpolicy="no-referrer" loading="lazy" onerror="this.style.display=\'none\'">'
      : window.__v3Ph(w, 'lg');
    var examplesHTML = w.examples.map(function(ex){
      return '<div class="back-ex"><button class="speak-btn speak-sm" onclick="event.stopPropagation();speakText(this)" title="Satz vorlesen">🔊</button><strong>📝 Beispiel</strong><span class="ex-text">' + ex + '</span></div>';
    }).join('');
    var enDE_f = learnDir === 'en-de';
    var front = enDE_f
      ? imgFront + '<div class="fc-word">' + w.word + '</div><div class="speak-row"><button class="speak-btn" onclick="speakWord(\'' + w.word.replace(/'/g, "\\'") + '\')">🔊</button><span class="fc-pronunciation">' + w.pronunciation + '</span></div><div class="fc-badges"><span class="badge badge-type">' + w.wordType + '</span><span class="badge ' + diffColor(w.difficulty) + '">' + w.difficulty + '</span></div><div class="fc-front-example"><button class="speak-btn speak-sm" onclick="event.stopPropagation();speakText(this)" title="Satz vorlesen">🔊</button>📝 „<span class="ex-text">' + w.examples[0] + '</span>"</div><div class="fc-hint">Tippe, um umzudrehen ↕</div>'
      : imgFront + '<div class="fc-word" style="font-size:20px;text-align:center;padding:0 12px">' + w.translation + '</div><div class="fc-badges" style="margin-top:10px"><span class="badge badge-type">' + w.wordType + '</span><span class="badge ' + diffColor(w.difficulty) + '">' + w.difficulty + '</span></div><div class="fc-front-example">📝 „' + (w.exampleDE || w.examples[0]) + '"</div><div class="fc-hint">Tippe, um umzudrehen ↕</div>';
    var back = enDE_f
      ? '<div class="back-section-label">📖 Definition</div><div class="back-def">' + w.definition + '</div><div class="back-section-label">📝 Beispiele</div>' + examplesHTML + '<div class="back-translation-small">🇩🇪 ' + w.translation + '</div>'
      : '<div class="fc-word" style="font-size:28px;margin-bottom:6px">' + w.word + '</div><div class="speak-row" style="margin-bottom:12px"><button class="speak-btn" onclick="speakWord(\'' + w.word.replace(/'/g, "\\'") + '\')">🔊</button><span class="fc-pronunciation">' + w.pronunciation + '</span></div><div class="back-section-label">📖 Definition</div><div class="back-def">' + w.definition + '</div><div class="back-section-label">📝 Beispiele</div>' + examplesHTML;
    var backBtn = '<button class="v3tr-btn icon" onclick="prevCard()" ' + (idx === 0 ? 'disabled style="opacity:.4"' : '') + ' aria-label="Vorherige Karte">←</button>';
    app.innerHTML = headRow(idx+1, deck.length, backBtn + dirBtn())
      + '<div class="v3-scene"><div class="scene">'
      + '<div class="flashcard' + (flipped ? ' flipped' : '') + '" id="fc" onclick="flipCard()">'
      + '<div class="face">' + front + '</div>'
      + '<div class="face face-back">' + back + '</div>'
      + '</div></div></div>'
      + '<div class="fc-actions" id="fcActions" style="display:' + (flipped ? 'flex' : 'none') + '">'
      + '<button class="btn btn-err" onclick="markCard(false)">✗ Nochmal</button>'
      + '<button class="btn btn-ok" onclick="markCard(true)">✓ Gewusst!</button>'
      + '</div>';
    if (window.__v3SetTopbar) window.__v3SetTopbar('KARTE ' + (idx+1) + ' / ' + deck.length, 'Karteikarten');
  };

  /* ── LÜCKENTEXT: Aufgabe sofort, Tastatur-sicher ── */
  var prevRenderFill = window.renderFill;
  window.renderFill = function(){
    if (!deck.length || idx >= deck.length){
      if (window.__v3SetTopbar) window.__v3SetTopbar('SELBER TIPPEN', 'Lückentext');
      return prevRenderFill.apply(this, arguments);
    }
    var app = document.getElementById('app'); if (!app) return;
    var w = deck[idx];
    var enDE_fill = learnDir === 'en-de';
    var cardHTML;
    if (enDE_fill){
      var ex = w.examples[Math.floor(Math.random() * w.examples.length)];
      var blanked = ex.replace(new RegExp(w.word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), '<span class="blank">_____</span>');
      cardHTML = '<div class="fill-label">🇩🇪 Übersetzung: <strong>' + w.translation + '</strong> &nbsp;|&nbsp; ' + w.wordType + ' &nbsp;<span class="badge ' + diffColor(w.difficulty) + '">' + w.difficulty + '</span></div>'
        + '<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px"><button class="speak-btn" onclick="speakWord(\'' + w.word.replace(/'/g, "\\'") + '\')">🔊</button><span style="font-size:13px;color:var(--muted)">' + w.pronunciation + '</span></div>'
        + '<div class="fill-label">Ergänze den Satz:</div><div class="fill-sentence">' + blanked + '</div>';
    } else {
      cardHTML = '<div class="fill-label">🇬🇧 Englisch: <strong>' + w.word + '</strong> &nbsp;|&nbsp; ' + w.wordType + ' &nbsp;<span class="badge ' + diffColor(w.difficulty) + '">' + w.difficulty + '</span></div>'
        + '<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px"><button class="speak-btn" onclick="speakWord(\'' + w.word.replace(/'/g, "\\'") + '\')">🔊</button><span style="font-size:13px;color:var(--muted)">' + w.pronunciation + '</span></div>'
        + '<div class="fill-label">Was ist die deutsche Übersetzung?</div><div class="fill-sentence" style="font-size:15px;color:var(--muted)">📝 „' + w.examples[0] + '"</div>';
    }
    fillChecked = false;
    var skipBtn = '<button class="v3tr-btn" onclick="skipFill()" id="skipBtn">Überspringen →</button>';
    app.innerHTML = headRow(idx+1, deck.length, dirBtn() + skipBtn)
      + '<div class="fill-card">' + cardHTML
      + '<div class="fill-input-row" style="margin-top:14px">'
      + '<input class="fill-input" id="fillInput" type="text" placeholder="' + (enDE_fill ? 'Englisches Wort…' : 'Deutsche Übersetzung…') + '" onkeydown="if(event.key===\'Enter\')checkFill()" oninput="onFillInput(this)" autocomplete="off" autocorrect="off" spellcheck="false">'
      + '<button class="btn btn-primary" onclick="checkFill()">Prüfen</button>'
      + '</div><div id="fillResult"></div></div>';
    if (window.__v3SetTopbar) window.__v3SetTopbar('AUFGABE ' + (idx+1) + ' / ' + deck.length, 'Lückentext');
    setTimeout(function(){ var i = document.getElementById('fillInput'); if (i){ i.focus(); i.scrollIntoView({ behavior:'smooth', block:'center' }); } }, 150);
  };

  /* ── WORTLISTE 2.0: Status-Gruppen, Sticky-Suche, Bild-Filter ── */
  var groupsOpen = { due:true, learn:false, fresh:false, master:false };
  var onlyImg = false, filtersOpen = false;
  window.__v31ToggleGroup  = function(k){ groupsOpen[k] = !groupsOpen[k]; renderList(); };
  window.__v31ToggleImg    = function(){ onlyImg = !onlyImg; renderList(); };
  window.__v31ToggleFilter = function(){ filtersOpen = !filtersOpen; renderList(); };

  function wordCard(w){
    var src = getImg(w);
    var thumb = src
      ? '<img class="wc-thumb" src="' + src + '" alt="' + esc(w.word) + '" referrerpolicy="no-referrer" loading="lazy" onerror="this.onerror=null;this.outerHTML=window.__v3Ph(WORDS.find(function(x){return x.id===' + w.id + '}),\'sm\')">'
      : window.__v3Ph(w, 'sm');
    var detailImg = src ? '<img class="wc-detail-img" src="' + src + '" alt="' + esc(w.word) + '" referrerpolicy="no-referrer" loading="lazy" onerror="this.style.display=\'none\'">' : '';
    var e = SRS.state[w.id];
    var lvl = e ? (e.level || 0) : 0;
    var isDue = e ? (e.nextDue <= SRS.todayISO() && lvl < 7) : false;
    var exHTML = w.examples.map(function(x){ return '<div class="wc-ex">📝 ' + esc(x) + '</div>'; }).join('');
    return '<div class="word-card' + (listOpen[w.id] ? ' open' : '') + '" onclick="toggleCard(event,' + w.id + ')">'
      + '<div class="wc-top">' + thumb
      + '<div class="wc-body"><div class="wc-title-row"><span class="wc-word">' + esc(w.word) + '</span><span class="wc-pron">' + esc(w.pronunciation) + '</span>' + (isDue ? '<span class="due-pill">Fällig</span>' : '') + '</div>'
      + '<div class="wc-translation">' + esc(w.translation) + '</div></div>'
      + '<div class="wc-meta"><span class="level-badge lvl-' + lvl + '">L' + lvl + '</span><span class="badge ' + diffColor(w.difficulty) + '">' + w.difficulty + '</span><span class="wc-chev">▾</span></div>'
      + '</div>'
      + '<div class="wc-detail' + (listOpen[w.id] ? ' open' : '') + '" id="detail' + w.id + '">' + detailImg
      + '<p><strong>📖 Definition:</strong> ' + esc(w.definition) + '</p>' + exHTML
      + '<p style="font-size:11px;color:var(--muted);margin-top:6px">' + esc(w.wordType) + ' · ' + esc(w.category) + ' · Hinzugefügt: ' + esc(w.dateAdded) + '</p>'
      + '</div></div>';
  }

  window.renderList = function(){
    var app = document.getElementById('app'); if (!app) return;
    var q = listSearch.trim().toLowerCase();
    var filtered = WORDS.filter(function(w){
      if (listFilterType !== 'Alle' && w.wordType !== listFilterType) return false;
      if (listFilterCat !== 'Alle' && w.category !== listFilterCat) return false;
      if (onlyImg && !getImg(w)) return false;
      if (!q) return true;
      return [w.word, w.translation, w.definition].concat(w.examples || []).join(' ').toLowerCase().indexOf(q) >= 0;
    });
    var flat = !!(q || onlyImg || listFilterType !== 'Alle' || listFilterCat !== 'Alle');

    var types = ['Alle'].concat(Array.from(new Set(WORDS.map(function(w){ return w.wordType; }))));
    var cats = ['Alle'].concat(typeof CATEGORIES !== 'undefined' ? CATEGORIES : []);
    var filterHTML = '';
    if (filtersOpen){
      filterHTML = '<div class="v31-filterrow">' + types.map(function(t){
          return '<button class="v31-fbtn' + (listFilterType === t ? ' active' : '') + '" onclick="setFilterType(\'' + t + '\')">' + t + '</button>';
        }).join('') + '</div>'
        + '<div class="v31-filterrow">' + cats.map(function(c){
          return '<button class="v31-fbtn' + (listFilterCat === c ? ' active' : '') + '" onclick="setFilterCat(\'' + c.replace(/'/g, "\\'") + '\')">' + c + '</button>';
        }).join('') + '</div>';
    }

    var html = '<div class="v31-sticky">'
      + '<div class="search-bar' + (listSearch ? ' has-value' : '') + '">'
      + '<input id="listSearchInput" type="text" placeholder="Suche in ' + WORDS.length + ' Wörtern…" value="' + esc(listSearch) + '" oninput="onSearchInput(this.value)" autocomplete="off" spellcheck="false">'
      + '<button class="search-clear" onclick="clearSearch(event)" aria-label="Suche leeren">✕</button>'
      + '</div>'
      + '<div class="v31-filterrow">'
      + '<button class="v31-fbtn' + (filtersOpen ? ' active' : '') + '" onclick="window.__v31ToggleFilter()">' + svg('layers',13) + ' Filter' + ((listFilterType !== 'Alle' || listFilterCat !== 'Alle') ? ' ●' : '') + '</button>'
      + '<button class="v31-fbtn' + (onlyImg ? ' active' : '') + '" onclick="window.__v31ToggleImg()">📷 Nur mit Bild</button>'
      + '<span style="margin-left:auto;font-size:11px;color:var(--muted);align-self:center">' + filtered.length + ' / ' + WORDS.length + '</span>'
      + '</div>' + filterHTML + '</div>';

    if (!filtered.length){
      html += '<div class="v31-empty">Keine Wörter gefunden.</div>';
    } else if (flat){
      html += filtered.map(wordCard).join('');
    } else {
      var today = SRS.todayISO();
      var groups = [
        { k:'due',    label:'Fällig heute',   words:[] },
        { k:'learn',  label:'In Bearbeitung', words:[] },
        { k:'fresh',  label:'Neu',            words:[] },
        { k:'master', label:'Gemeistert',     words:[] }
      ];
      filtered.forEach(function(w){
        var e = SRS.state[w.id];
        if (!e || ((e.level||0) === 0 && ((e.ok||0)+(e.wrong||0)) === 0)) groups[2].words.push(w);
        else if ((e.level||0) >= 7) groups[3].words.push(w);
        else if (e.nextDue <= today) groups[0].words.push(w);
        else groups[1].words.push(w);
      });
      groups.forEach(function(g){
        if (!g.words.length) return;
        var open = groupsOpen[g.k];
        html += '<div class="v31-group-head' + (open ? ' open' : '') + '" onclick="window.__v31ToggleGroup(\'' + g.k + '\')">'
          + g.label + '<span class="cnt ' + g.k + '">' + g.words.length + '</span><span class="chev">' + svg('chevronRight',14) + '</span></div>';
        if (open) html += g.words.map(wordCard).join('');
      });
    }
    app.innerHTML = html;
    if (document.activeElement && document.activeElement.id !== 'listSearchInput'){
      var si = document.getElementById('listSearchInput');
      if (si && listSearch){ si.focus(); si.setSelectionRange(listSearch.length, listSearch.length); }
    }
  };

  console.log('[ETA v3.1] Card-first überall + Wortliste 2.0 aktiv');
})();
</script>
<!-- ETA-PATCH-v3.1-END -->

<!-- ═══════════════ ETA-PATCH v3.2 · Quiz card-first (2026-08-01) ═══════════════
     Problem (Tims Screenshots 13:23): Kategorie-Chips (2 Zeilen) + Richtungs-
     Buttons + Frage-Karte mit großem Foto schoben die Antworten unter den Fold.
     Lösung: einzeilige Kopfzeile, Foto & Frage nebeneinander, Antworten kompakt —
     alles auf einer Bildschirmseite, auch bei großer Systemschrift.            -->
<style id="eta-v32-style">
/* Frage-Karte: Foto links, Wort/Badges rechts, Beispiel darunter */
.v32-q{ background:var(--card); border:1px solid var(--border); border-radius:16px; padding:12px 13px; margin-bottom:10px; box-shadow:var(--sh-sm); }
.v32-q-row{ display:flex; gap:12px; align-items:center; }
.v32-photo{ width:94px; height:94px; border-radius:12px; overflow:hidden; flex-shrink:0; position:relative; }
.v32-photo .v3-ph{ width:100%; height:100%; font-size:34px; margin:0; border-radius:12px; }
.v32-photo img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
.v32-main{ flex:1; min-width:0; text-align:left; }
.v32-sub{ font-size:9px; font-weight:800; letter-spacing:1px; text-transform:uppercase; color:var(--muted); }
.v32-word{ font-size:clamp(19px, 6vw, 24px); font-weight:800; letter-spacing:-0.4px; color:var(--text); line-height:1.12; margin:3px 0 6px; overflow-wrap:break-word; }
.v32-meta{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.v32-meta .speak-btn{ width:26px; height:26px; font-size:12px; }
.v32-pron{ font-family:ui-monospace,'SF Mono',Menlo,monospace; font-size:11px; color:var(--muted); }
.v32-ex{ background:var(--card-hover); border-radius:9px; padding:7px 10px; font-size:11.5px; line-height:1.45; color:var(--text-soft); font-style:italic; margin-top:10px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
/* Antworten: kompakt, alle 4 sichtbar */
@media (max-width:900px), (pointer:coarse){
  .quiz-choices{ display:flex; flex-direction:column; gap:8px; }
  .quiz-choices .choice{ padding:12px 14px !important; font-size:14px !important; margin:0 !important; min-height:0 !important; border-radius:12px !important; line-height:1.3 !important; }
  #app > .nav-row{ margin-top:8px !important; }
}
/* Kategorie-Chips: nur auf Wunsch sichtbar, kompakt */
.v32-chips .cat-chip-row{ margin:0 0 10px !important; gap:5px !important; }
.v32-chips .cat-chip{ padding:5px 10px !important; font-size:11px !important; }
/* Untere Tab-Leiste & Kopfzeile voll deckend — kein Durchscheinen von Inhalten */
@media (max-width:900px), (pointer:coarse){
  nav{ background:#10151F !important; }
  #eta-topbar{ background:#10151F; }
}
</style>
<script id="eta-v32-script">
(function(){
  var chipsOpen = false;
  window.__v32ToggleChips = function(){ chipsOpen = !chipsOpen; try { render(); } catch(e){} };
  // Nach Kategorie-Wahl Chips automatisch einklappen
  var prevSetCat = window.setCatFilter;
  window.setCatFilter = function(c){ chipsOpen = false; return prevSetCat.apply(this, arguments); };

  var prevRenderQuiz = window.renderQuiz;
  window.renderQuiz = function(){
    var app = document.getElementById('app'); if (!app) return;
    if (WORDS.length < 2 || !deck.length || idx >= deck.length){
      if (window.__v3SetTopbar) window.__v3SetTopbar('MULTIPLE CHOICE', 'Quiz');
      return prevRenderQuiz.apply(this, arguments);
    }
    var w = deck[idx];
    var enDE = learnDir === 'en-de';

    // Antwort-Optionen (Logik unverändert zur Basis)
    var wrong = shuffle(poolWords().filter(function(x){ return x.id !== w.id; })).slice(0, 3);
    quizChoices = shuffle([w].concat(wrong));
    quizCorrectIdx = quizChoices.findIndex(function(c){ return c.id === w.id; });
    quizAnswered = false;

    var qWord = enDE ? w.word : w.translation;
    var qSub  = enDE ? 'Was bedeutet dieses Wort?' : 'Wie lautet das englische Wort?';
    var choices = quizChoices.map(function(c, i){
      return '<button class="choice" id="ch' + i + '" onclick="answerQuiz(' + i + ')">' + (enDE ? c.translation : c.word) + '</button>';
    }).join('');

    var src = getImg(w);
    var photo = '<div class="v32-photo">' + window.__v3Ph(w, '')
      + (src ? '<img src="' + src + '" alt="' + w.word + '" referrerpolicy="no-referrer" loading="lazy" onerror="this.style.display=\'none\'">' : '')
      + '</div>';

    var ex = (function(){
      var e = w.examples[0];
      if (enDE){
        return '📝 ' + e.replace(new RegExp(w.word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), function(m){ return '<span class="ex-blank">' + Array(m.length + 1).join('_') + '</span>'; });
      }
      return '📝 ' + (w.exampleDE || e);
    })();

    var pct = Math.round(((idx + 1) / deck.length) * 100);
    var catBtn = '<button class="v3tr-btn" onclick="window.__v32ToggleChips()">' + (catFilter === 'all' ? 'Alle' : catLabel(catFilter)) + ' ▾</button>';
    var dirB = '<button class="v3tr-btn" onclick="window.__v3ToggleDir()" aria-label="Lernrichtung wechseln">' + (enDE ? 'EN→DE' : 'DE→EN') + ' ⇄</button>';

    app.innerHTML =
      '<div class="v3tr-head"><span class="v31-pos">' + (idx + 1) + ' / ' + deck.length + '</span><div class="v3tr-prog"><i style="width:' + pct + '%"></i></div>' + catBtn + dirB + '</div>'
      + (chipsOpen ? '<div class="v32-chips">' + categoryChipsHTML() + '</div>' : '')
      + '<div class="v32-q"><div class="v32-q-row">' + photo
      + '<div class="v32-main"><div class="v32-sub">' + qSub + '</div><div class="v32-word">' + qWord + '</div>'
      + '<div class="v32-meta"><span class="badge badge-type">' + w.wordType + '</span><span class="badge ' + diffColor(w.difficulty) + '">' + w.difficulty + '</span>'
      + '<button class="speak-btn" onclick="speakWord(\'' + (enDE ? w.word : w.translation).replace(/'/g, "\\'") + '\',\'' + (enDE ? 'en' : 'de') + '\')">🔊</button>'
      + (enDE ? '<span class="v32-pron">' + w.pronunciation + '</span>' : '')
      + '</div></div></div>'
      + '<div class="v32-ex">' + ex + '</div></div>'
      + '<div class="quiz-choices">' + choices + '</div>'
      + '<div id="quizFeedback"></div>'
      + '<div class="nav-row"><button class="btn btn-ghost btn-sm" onclick="nextQuiz()" id="nextQuizBtn" style="display:none">Weiter →</button></div>';

    if (window.__v3SetTopbar) window.__v3SetTopbar('FRAGE ' + (idx + 1) + ' / ' + deck.length, 'Quiz');

    // Lazy-Load: Bild nachladen, wenn (noch) nicht im Cache
    if (!src && wikiTitleFor(w.word)){
      fetchWikiImage(w.word).then(function(url){
        if (!url) return;
        var ph = document.querySelector('.v32-photo');
        if (ph && !ph.querySelector('img')) ph.insertAdjacentHTML('beforeend', '<img src="' + url + '" alt="" referrerpolicy="no-referrer" loading="lazy" onerror="this.style.display=\'none\'">');
      });
    }
  };
  console.log('[ETA v3.2] Quiz card-first aktiv');
})();
</script>
<!-- ETA-PATCH-v3.2-END -->

<!-- ═══════════════ ETA-PATCH v3.3 · Beide Lernrichtungen überall (2026-08-01) ═══════════════
     Tims Befund: Richtungswechsel wirkte nur scheinbar. Ursachen & Fixes:
     F1  ⇄-Umschalter las window.learnDir (existiert nicht) → setzte immer EN→DE.
         Fix direkt im v3-Block (lexikalischer Zugriff).
     F2  Tippmodus konnte NUR Deutsch→Englisch → hier komplett neue, richtungs-
         fähige Engine (ersetzt die v2.5-Version, die in ihrer Closure gefangen ist).
     F3  speakWord sprach Deutsch mit englischer Stimme → Sprachparameter (Basis-Fix).
     F4  Richtung ging bei App-Neustart verloren → localStorage-Persistenz.        -->
<style id="eta-v33-style">
.t33-card{ background:var(--card); border:1px solid var(--border); border-radius:16px; padding:18px 16px; text-align:center; box-shadow:var(--sh-sm); }
.t33-prompt{ font-size:9.5px; font-weight:800; letter-spacing:1.1px; text-transform:uppercase; color:var(--muted); }
.t33-word{ font-size:clamp(20px, 6.5vw, 26px); font-weight:800; letter-spacing:-0.4px; color:var(--text); margin:6px 0 8px; line-height:1.15; overflow-wrap:break-word; }
.t33-badges{ display:flex; gap:6px; justify-content:center; align-items:center; margin-bottom:14px; flex-wrap:wrap; }
.t33-input{ width:100%; padding:13px 14px; border-radius:12px; background:var(--bg); border:1.5px solid var(--border); color:var(--text); font-family:inherit; font-size:16px; text-align:center; outline:none; }
.t33-input:focus{ border-color:var(--primary); }
.t33-input.ok{ border-color:var(--ok); background:var(--ok-bg); }
.t33-input.err{ border-color:var(--err); background:var(--err-bg); }
.t33-fb{ min-height:24px; margin-top:10px; font-size:13.5px; font-weight:600; display:flex; align-items:center; justify-content:center; gap:6px; }
.t33-fb.ok{ color:var(--ok); } .t33-fb.err{ color:var(--err); }
.t33-btn{ width:100%; margin-top:12px; padding:13px; border-radius:12px; border:none; cursor:pointer; font-family:inherit; font-size:14.5px; font-weight:700; background:linear-gradient(135deg,var(--primary2),var(--primary)); color:#fff; }
.t33-result{ text-align:center; padding:26px 16px; }
.t33-result .big{ font-size:44px; font-weight:800; color:var(--primary); letter-spacing:-1px; margin:8px 0; }
</style>
<script id="eta-v33-script">
(function(){
  var svg = window.__etaSvg || function(){ return ''; };

  /* ── F4: Gespeicherte Lernrichtung beim Start wiederherstellen ── */
  try {
    var saved = localStorage.getItem('etLearnDir');
    if (saved === 'de-en' || saved === 'en-de') learnDir = saved;
  } catch(e){}

  /* ── Werkzeuge (eigene Kopien — die v2.5-Versionen sind in ihrer Closure gefangen) ── */
  function norm(s){ return String(s||'').toLowerCase().replace(/^to\s+/, '').replace(/[.,!?"„“]/g, '').trim(); }
  function lev(a, b){
    a = norm(a); b = norm(b);
    var m = a.length, n = b.length;
    if (!m) return n; if (!n) return m;
    var prev = [], cur, i, j;
    for (j = 0; j <= n; j++) prev[j] = j;
    for (i = 1; i <= m; i++){
      cur = [i];
      for (j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j-1] + 1, prev[j-1] + (a[i-1] === b[j-1] ? 0 : 1));
      prev = cur;
    }
    return prev[n];
  }
  function tolerant(dist, target){ return dist <= (norm(target).length > 6 ? 2 : 1); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(m){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]; }); }

  /* ── F2: Tippmodus mit BEIDEN Richtungen ──
     EN→DE: englisches Wort sehen (+🔊) → deutsche Übersetzung tippen
            (jede Komma-Variante zählt, Tippfehler-Toleranz via Levenshtein)
     DE→EN: deutsches Wort sehen → englisches Wort tippen ('to ' optional)     */
  var deck33 = [], idx33 = 0, checked33 = false, ok33 = 0, wrong33 = 0, label33 = 'Tippmodus';

  function buildDeck(){
    var d = [];
    try { d = SRS.dueQueue(WORDS).slice(0, 10); } catch(e){}
    if (!d.length){ try { d = shuffle(WORDS.slice()).slice(0, 10); } catch(e){ d = WORDS.slice(0, 10); } }
    return d;
  }

  window.__v33StartType = function(customDeck, label){
    deck33 = (customDeck && customDeck.length) ? customDeck.slice(0, 10) : buildDeck();
    idx33 = 0; checked33 = false; ok33 = 0; wrong33 = 0;
    label33 = label || 'Tippmodus';
    window.mode = 'type';
    var nt = document.querySelector('.nav-tabs');
    if (nt) nt.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('active'); });
    try { window.scrollTo(0, 0); } catch(e){}
    renderType33();
  };
  // Alte Einstiege auf die neue Engine umleiten:
  window.__etaStartType = function(){ window.__v33StartType(); };
  window.__etaDrillHard = function(){
    var hard = [];
    try {
      WORDS.forEach(function(w){
        var e = SRS.state[w.id]; if (!e) return;
        var t = (e.ok||0) + (e.wrong||0);
        if (t >= 2 && (e.wrong||0)/t > 0.4) hard.push(w);
      });
    } catch(e){}
    if (!hard.length) return;
    window.__v33StartType(hard, 'Schwierige Wörter');
  };

  function renderType33(){
    var app = document.getElementById('app'); if (!app) return;
    var enDE = learnDir === 'en-de';

    if (idx33 >= deck33.length){
      if (window.__v3SetTopbar) window.__v3SetTopbar('RUNDE BEENDET', label33);
      app.innerHTML = '<div class="t33-card t33-result"><div class="t33-prompt">Runde beendet</div>'
        + '<div class="big">' + ok33 + '/' + deck33.length + '</div>'
        + '<div style="color:var(--muted);font-size:14px;margin-bottom:18px">richtig getippt</div>'
        + '<button class="t33-btn" onclick="window.__v33StartType()">Neue Runde</button>'
        + '<button class="eta-set-btn" style="margin-top:8px" onclick="setMode(\'today\')">Zurück zur Übersicht</button></div>';
      return;
    }

    var w = deck33[idx33];
    var pct = Math.round((idx33 / deck33.length) * 100);
    var shown  = enDE ? w.word : w.translation;
    var prompt = enDE ? 'Was heißt das auf Deutsch?' : 'Wie heißt das auf Englisch?';
    var ph     = enDE ? 'deutsche Übersetzung tippen…' : 'englisches Wort tippen…';
    var speak  = enDE ? '<button class="speak-btn" onclick="speakWord(\'' + w.word.replace(/'/g, "\\'") + '\')">🔊</button>' : '';

    app.innerHTML =
      '<div class="v3tr-head"><span class="v31-pos">' + (idx33 + 1) + ' / ' + deck33.length + '</span>'
      + '<div class="v3tr-prog"><i style="width:' + pct + '%"></i></div>'
      + '<span class="v31-pos" style="color:var(--ok)">✓ ' + ok33 + '</span><span class="v31-pos" style="color:var(--err)">✗ ' + wrong33 + '</span>'
      + '<button class="v3tr-btn" onclick="window.__v33ToggleDir()" aria-label="Lernrichtung wechseln">' + (enDE ? 'EN→DE' : 'DE→EN') + ' ⇄</button>'
      + '</div>'
      + '<div class="t33-card">'
      + '<div class="t33-prompt">' + prompt + '</div>'
      + '<div class="t33-word">' + esc(shown) + '</div>'
      + '<div class="t33-badges"><span class="badge badge-type">' + (w.wordType||'') + '</span><span class="badge ' + diffColor(w.difficulty) + '">' + (w.difficulty||'') + '</span>' + speak + '</div>'
      + '<input class="t33-input" id="t33Input" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="' + ph + '">'
      + '<div class="t33-fb" id="t33Fb"></div>'
      + '<button class="t33-btn" id="t33Btn" onclick="window.__v33Check()">Prüfen</button>'
      + '</div>';
    if (window.__v3SetTopbar) window.__v3SetTopbar('TIPPEN ' + (idx33 + 1) + ' / ' + deck33.length, label33);
    var inp = document.getElementById('t33Input');
    if (inp){
      inp.addEventListener('keydown', function(ev){ if (ev.key === 'Enter'){ ev.preventDefault(); window.__v33Check(); } });
      setTimeout(function(){ inp.focus(); }, 120);
    }
  }
  window.__v33ToggleDir = function(){
    checked33 = false;  // aktuelle Frage wird in der neuen Richtung frisch gestellt
    if (typeof setLearnDir === 'function') setLearnDir(learnDir === 'en-de' ? 'de-en' : 'en-de');
  };

  window.__v33Check = function(){
    var w = deck33[idx33]; if (!w) return;
    var inp = document.getElementById('t33Input');
    var btn = document.getElementById('t33Btn');
    var fb  = document.getElementById('t33Fb');
    if (!inp || !btn || !fb) return;

    if (!checked33){
      var enDE = learnDir === 'en-de';
      var answer = inp.value;
      var isOk = false, solution = '';
      if (enDE){
        // deutsche Übersetzung: jede Komma-Variante zählt, beste per Levenshtein
        var variants = String(w.translation).split(',').map(function(t){ return t.trim(); }).filter(Boolean);
        solution = w.translation;
        isOk = norm(answer).length > 0 && variants.some(function(v){ return tolerant(lev(answer, v), v); });
      } else {
        solution = w.word;
        isOk = norm(answer).length > 0 && tolerant(lev(answer, w.word), w.word);
      }
      checked33 = true;
      if (isOk){
        ok33++; inp.classList.add('ok');
        fb.className = 't33-fb ok'; fb.innerHTML = svg('check', 15, 2.5) + ' Richtig!' + (lev(answer, enDE ? w.translation.split(',')[0] : w.word) > 0 ? ' <span style="font-weight:500;color:var(--muted)">(kleiner Tippfehler verziehen)</span>' : '');
        try { SRS.markCorrect(w.id); } catch(e){}
      } else {
        wrong33++; inp.classList.add('err');
        fb.className = 't33-fb err'; fb.innerHTML = svg('x', 15, 2.5) + ' Lösung: <strong>&nbsp;' + esc(solution) + '</strong>';
        try { SRS.markWrong(w.id); } catch(e){}
      }
      try { Stats.recordAnswer(isOk, 'type'); updateStats(); } catch(e){}
      inp.disabled = true;
      btn.textContent = (idx33 + 1 >= deck33.length) ? 'Ergebnis' : 'Weiter';
    } else {
      idx33++; checked33 = false;
      renderType33();
    }
  };

  /* ── Mode-Routing: Tippmodus komplett auf die neue Engine umbiegen ── */
  var prevSetMode = window.setMode;
  window.setMode = function(m, btn){
    if (m === 'type'){ window.__v33StartType(); return; }
    return prevSetMode.apply(this, arguments);
  };
  var prevRender = window.render;
  window.render = function(){
    if (window.mode === 'type'){ renderType33(); return; }
    return prevRender.apply(this, arguments);
  };

  console.log('[ETA v3.3] Beide Lernrichtungen in allen Modi aktiv');
})();
</script>
<!-- ETA-PATCH-v3.3-END -->
