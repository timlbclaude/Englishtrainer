<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4f46e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="English Trainer">
<link rel="apple-touch-icon" href="icon-192.png">
<title>English Trainer 🇬🇧</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ─────────────────────────────────────────────
   Theme variables (Notion / Linear-Stil)
   ─────────────────────────────────────────────*/
:root {
  --primary: #4f46e5;
  --primary2: #6366f1;
  --primary-soft: #818cf8;
  --primary-bg: #eef2ff;
  --ok: #059669;
  --ok-bg: #d1fae5;
  --ok-text: #065f46;
  --err: #dc2626;
  --err-bg: #fee2e2;
  --err-text: #991b1b;
  --warn: #f59e0b;
  --warn-bg: #fef3c7;
  --warn-text: #92400e;
  --bg: #f8fafc;
  --card: #ffffff;
  --card-hover: #fafbff;
  --text: #0f172a;
  --text-soft: #334155;
  --muted: #64748b;
  --border: #e5e7eb;
  --border-strong: #cbd5e1;
  --header-bg: rgba(255,255,255,.85);
  --nav-bg: rgba(255,255,255,.9);
  --sh-sm: 0 1px 2px rgba(15,23,42,.04), 0 1px 3px rgba(15,23,42,.05);
  --sh: 0 1px 2px rgba(15,23,42,.04), 0 4px 12px rgba(15,23,42,.06);
  --sh-lg: 0 10px 30px rgba(15,23,42,.10), 0 4px 10px rgba(15,23,42,.04);
  --radius: 14px;
  --radius-sm: 10px;
  --radius-lg: 18px;
  --radius-full: 9999px;
}
body.dark {
  --primary: #818cf8;
  --primary2: #a5b4fc;
  --primary-soft: #6366f1;
  --primary-bg: rgba(129,140,248,.12);
  --ok: #34d399;
  --ok-bg: rgba(52,211,153,.14);
  --ok-text: #a7f3d0;
  --err: #f87171;
  --err-bg: rgba(248,113,113,.14);
  --err-text: #fecaca;
  --warn: #fbbf24;
  --warn-bg: rgba(251,191,36,.14);
  --warn-text: #fde68a;
  --bg: #0b1220;
  --card: #111a2e;
  --card-hover: #15203a;
  --text: #e2e8f0;
  --text-soft: #cbd5e1;
  --muted: #94a3b8;
  --border: #1f2a44;
  --border-strong: #334155;
  --header-bg: rgba(13,21,38,.85);
  --nav-bg: rgba(13,21,38,.9);
  --sh-sm: 0 1px 2px rgba(0,0,0,.4);
  --sh: 0 2px 6px rgba(0,0,0,.35), 0 8px 20px rgba(0,0,0,.25);
  --sh-lg: 0 16px 40px rgba(0,0,0,.55), 0 4px 12px rgba(0,0,0,.3);
}

*{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100vh;}
body{font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;transition:background-color .3s ease, color .3s ease;font-feature-settings:'cv02','cv03','cv04','cv11';}

/* ── Header ── */
header{display:none;}
.hd-stats{display:flex;gap:4px;align-items:center;padding:0 6px 0 2px;flex-shrink:0;}
.stat{padding:4px 8px;border-radius:var(--radius-full);font-weight:600;font-size:11px;letter-spacing:.01em;border:1px solid var(--border);background:var(--card);}
.stat-ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 25%,var(--border));background:var(--ok-bg);}
.stat-err{color:var(--err);border-color:color-mix(in srgb,var(--err) 25%,var(--border));background:var(--err-bg);}
.theme-toggle{width:30px;height:30px;border-radius:var(--radius-full);border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer;font-size:14px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
.theme-toggle:hover{background:var(--card);}

/* ── Tabs ── */
nav{background:var(--nav-bg);backdrop-filter:saturate(180%) blur(10px);-webkit-backdrop-filter:saturate(180%) blur(10px);display:flex;align-items:center;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10;}.nav-tabs{display:flex;flex:1;overflow-x:auto;min-width:0;}
.tab{padding:12px 18px;border:none;background:none;cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:500;color:var(--muted);white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .18s ease, border-color .18s ease, background .18s ease;}
.tab:hover{color:var(--text);background:var(--primary-bg);}
.tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600;}

/* ── Main ── */
main{padding:28px 24px 60px;max-width:820px;margin:0 auto;}

/* ── Progress bar ── */
.progress-wrap{margin-bottom:20px;}
.progress-label{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px;letter-spacing:.02em;font-weight:500;}
.progress-bar{height:5px;background:var(--border);border-radius:var(--radius-full);overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--primary-soft),var(--primary));border-radius:var(--radius-full);transition:width .45s cubic-bezier(.4,0,.2,1);}

/* ── Flashcard ── */
.scene{perspective:1400px;height:460px;margin-bottom:14px;}
.flashcard{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .65s cubic-bezier(.4,0,.2,1);cursor:pointer;}
.flashcard.flipped{transform:rotateY(180deg);}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--radius-lg);background:var(--card);box-shadow:var(--sh-lg);border:1px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 16px;overflow:hidden;}
.face-back{transform:rotateY(180deg);align-items:flex-start;justify-content:flex-start;overflow-y:auto;-webkit-overflow-scrolling:touch;}.face.face-back{overflow:hidden auto;}

.fc-image{width:100%;max-height:220px;object-fit:cover;border-radius:var(--radius-sm);margin-bottom:18px;box-shadow:var(--sh-sm);}
.fc-img-placeholder{width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:36px;margin-bottom:18px;background:var(--primary-bg);color:var(--primary);}
.fc-word{font-size:34px;font-weight:800;color:var(--text);text-align:center;line-height:1.15;margin-bottom:8px;letter-spacing:-.02em;}
.fc-pronunciation{font-size:15px;color:var(--muted);margin-bottom:14px;font-family:'Inter',sans-serif;letter-spacing:.01em;}.speak-btn{background:none;border:1px solid var(--border);border-radius:20px;cursor:pointer;font-size:17px;padding:4px 10px;transition:background .15s,transform .1s;color:var(--text);display:inline-flex;align-items:center;line-height:1;flex-shrink:0;}.speak-btn:hover{background:var(--hover);}.speak-btn:active{transform:scale(.93);}.speak-row{display:flex;align-items:center;justify-content:center;gap:8px;}.quiz-speak-row{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:6px;}.quiz-pron{font-size:13px;color:var(--muted);}
.fc-badges{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:14px;}
.fc-hint{font-size:12px;color:var(--muted);opacity:.7;position:absolute;bottom:18px;letter-spacing:.02em;}

.back-translation{font-size:24px;font-weight:700;color:var(--text);margin-bottom:14px;letter-spacing:-.01em;}
.back-def{font-size:14px;line-height:1.65;color:var(--text-soft);margin-bottom:16px;border-left:3px solid var(--primary);padding-left:12px;}
.back-ex{font-size:13px;color:var(--text-soft);line-height:1.6;background:var(--primary-bg);border-radius:var(--radius-sm);padding:10px 14px;margin-bottom:8px;}
.back-ex strong{color:var(--primary);font-size:11px;display:block;margin-bottom:4px;letter-spacing:.04em;font-weight:600;}
.fc-front-example{font-size:13px;color:var(--text-soft);font-style:italic;line-height:1.6;background:var(--primary-bg);border-radius:var(--radius-sm);padding:10px 14px;text-align:center;margin-top:10px;width:100%;}
.back-translation-small{font-size:13px;color:var(--muted);margin-top:14px;padding-top:12px;border-top:1px solid var(--border);}
.back-section-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px;}

.fc-actions{display:flex;gap:12px;justify-content:center;margin-top:4px;}
@media(max-width:540px){
  .fc-actions{position:fixed;bottom:0;left:0;right:0;margin:0;padding:10px 12px;padding-bottom:max(10px,env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--border);z-index:54;gap:8px;}
  .fc-actions .btn{flex:1;padding:14px 10px;font-size:15px;}
}

/* ── Quiz ── */
.quiz-question{background:var(--card);border-radius:var(--radius);padding:28px;box-shadow:var(--sh);border:1px solid var(--border);margin-bottom:18px;text-align:center;}
.quiz-word{font-size:32px;font-weight:800;color:var(--text);margin-bottom:8px;letter-spacing:-.02em;}
.quiz-sub{font-size:13px;color:var(--muted);letter-spacing:.02em;text-transform:uppercase;font-weight:500;}
.quiz-dir-row,.dir-toggle-row{display:flex;gap:5px;margin-bottom:8px;}
.qdt-btn{flex:1;padding:7px 6px;border-radius:8px;border:1.5px solid var(--border);background:var(--card);font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;transition:background .15s,color .15s,border-color .15s;}
.qdt-btn.active{background:var(--primary);color:#fff;border-color:var(--primary);}
.quiz-choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.choice{padding:14px 16px;background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;font-family:inherit;font-size:14px;font-weight:500;transition:all .18s ease;text-align:left;color:var(--text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.choice:hover:not(:disabled){border-color:var(--primary);background:var(--primary-bg);transform:translateY(-1px);box-shadow:var(--sh-sm);}
.choice.correct{border-color:var(--ok);background:var(--ok-bg);color:var(--ok-text);animation:pulseOk .6s ease;}
.choice.wrong{border-color:var(--err);background:var(--err-bg);color:var(--err-text);}
.choice:disabled{cursor:default;}
@keyframes pulseOk{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 45%,transparent);}70%{box-shadow:0 0 0 12px transparent;}100%{box-shadow:0 0 0 0 transparent;}}
.quiz-feedback{text-align:center;font-size:14px;font-weight:600;padding:12px;border-radius:var(--radius-sm);margin-bottom:12px;}
.quiz-feedback.ok{background:var(--ok-bg);color:var(--ok-text);}
.quiz-feedback.err{background:var(--err-bg);color:var(--err-text);}

/* ── Fill-in-the-blank ── */
.fill-card{background:var(--card);border-radius:var(--radius);padding:28px;box-shadow:var(--sh);border:1px solid var(--border);margin-bottom:18px;}
.fill-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:14px;}
.fill-sentence{font-size:19px;line-height:1.8;color:var(--text);margin-bottom:20px;}
.blank{display:inline-block;min-width:120px;border-bottom:2.5px solid var(--primary);color:var(--primary);font-weight:700;padding:0 4px;}
.fill-input-row{display:flex;gap:10px;align-items:center;}
.fill-input{flex:1;padding:12px 16px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-family:inherit;font-size:15px;outline:none;background:var(--card);color:var(--text);transition:border-color .18s ease, box-shadow .18s ease, background .18s ease;}
.fill-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 20%,transparent);}
.fill-input.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok-text);}
.fill-input.err{border-color:var(--err);background:var(--err-bg);color:var(--err-text);}
.fill-input.live-ok{border-color:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 18%,transparent);}
.fill-result{margin-top:14px;padding:12px 16px;border-radius:var(--radius-sm);font-size:14px;line-height:1.6;}
.fill-result.ok{background:var(--ok-bg);color:var(--ok-text);}
.fill-result.err{background:var(--err-bg);color:var(--err-text);}

/* ── Word List ── */
.list-header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
.list-header h2{font-size:16px;font-weight:700;color:var(--text);letter-spacing:-.01em;}
.search-bar{position:relative;margin-bottom:14px;}
.search-bar input{width:100%;padding:11px 14px 11px 38px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-family:inherit;font-size:14px;outline:none;background:var(--card);color:var(--text);transition:border-color .18s ease, box-shadow .18s ease;}
.search-bar input:focus{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 18%,transparent);}
.search-bar::before{content:'🔍';position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:13px;opacity:.7;pointer-events:none;}
.search-clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);border:none;background:transparent;cursor:pointer;color:var(--muted);font-size:16px;padding:4px;line-height:1;border-radius:var(--radius-full);display:none;}
.search-clear:hover{color:var(--text);background:var(--border);}
.search-bar.has-value .search-clear{display:inline-block;}
.list-filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.filter-btn{padding:5px 12px;border-radius:var(--radius-full);border:1px solid var(--border);background:var(--card);cursor:pointer;font-family:inherit;font-size:12.5px;font-weight:500;color:var(--muted);transition:all .18s ease;display:inline-flex;align-items:center;gap:4px;}
.filter-btn:hover{border-color:var(--primary);color:var(--text);background:var(--primary-bg);}
.filter-btn.active{border-color:var(--primary);color:var(--primary);background:var(--primary-bg);font-weight:600;}
.word-grid{display:grid;grid-template-columns:1fr;gap:10px;}
.word-card{background:var(--card);border-radius:var(--radius);padding:14px 16px;border:1px solid var(--border);cursor:pointer;transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;}
.word-card:hover{transform:translateY(-1px);box-shadow:var(--sh);border-color:var(--border-strong);}
.wc-top{display:flex;align-items:center;gap:12px;}
.wc-thumb{width:52px;height:52px;border-radius:var(--radius-sm);object-fit:cover;flex-shrink:0;box-shadow:var(--sh-sm);}
.wc-thumb-fallback{width:52px;height:52px;border-radius:var(--radius-sm);background:var(--primary-bg);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
.wc-body{flex:1;min-width:0;}
.wc-title-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.wc-word{font-size:16px;font-weight:700;color:var(--text);letter-spacing:-.01em;}
.wc-pron{font-size:12.5px;color:var(--muted);}
.wc-translation{font-size:13.5px;color:var(--text-soft);margin-top:3px;}
.wc-meta{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-left:auto;}
.wc-chev{color:var(--muted);font-size:14px;transition:transform .2s ease;margin-left:4px;}
.word-card.open .wc-chev{transform:rotate(180deg);}
.wc-detail{margin-top:14px;border-top:1px solid var(--border);padding-top:12px;display:none;}
.wc-detail.open{display:block;}
.wc-detail p{font-size:13px;line-height:1.65;color:var(--text-soft);margin-bottom:8px;}
.wc-detail-img{width:100%;max-height:180px;object-fit:cover;border-radius:var(--radius-sm);margin-bottom:10px;box-shadow:var(--sh-sm);}
.wc-ex{background:var(--primary-bg);border-radius:var(--radius-sm);padding:8px 12px;font-size:13px;line-height:1.55;margin-bottom:6px;color:var(--text-soft);}

/* ── Empty / summary ── */
.summary-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:44px 36px;box-shadow:var(--sh);text-align:center;}
.summary-emoji{font-size:54px;margin-bottom:14px;}
.summary-card h2{font-size:22px;font-weight:700;color:var(--text);margin-bottom:6px;letter-spacing:-.01em;}
.summary-card p{color:var(--muted);font-size:14.5px;margin-bottom:22px;}
.summary-stats{display:flex;gap:28px;justify-content:center;margin-bottom:24px;}
.ss{text-align:center;}
.ss-num{font-size:38px;font-weight:800;letter-spacing:-.02em;}
.ss-ok .ss-num{color:var(--ok);}
.ss-err .ss-num{color:var(--err);}
.ss-label{font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;font-weight:500;}

/* ── Badges ── */
.badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:var(--radius-full);font-size:11px;font-weight:600;line-height:1.5;letter-spacing:.01em;border:1px solid transparent;}
.badge-A1,.badge-A2{background:var(--ok-bg);color:var(--ok-text);}
.badge-B1,.badge-B2{background:var(--warn-bg);color:var(--warn-text);}
.badge-C1,.badge-C2{background:var(--err-bg);color:var(--err-text);}
.badge-type{background:var(--primary-bg);color:var(--primary);}
.badge-cat-TV{background:#FEF3C7;color:#92400E;}
.badge-cat-Books{background:#EDE9FE;color:#5B21B6;}
.badge-cat-Kitchen{background:#D1FAE5;color:#065F46;}
.badge-cat-Reisen{background:#CFFAFE;color:#155E75;}
.badge-cat-none{background:var(--border);color:var(--muted);}
body.dark .badge-cat-TV{background:rgba(252,211,77,.18);color:#fde68a;}
body.dark .badge-cat-Books{background:rgba(167,139,250,.18);color:#ddd6fe;}
body.dark .badge-cat-Kitchen{background:rgba(52,211,153,.18);color:#a7f3d0;}
body.dark .badge-cat-Reisen{background:rgba(34,211,238,.18);color:#a5f3fc;}
.filter-group-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px;margin-top:10px;}

/* ── Buttons ── */
.btn{padding:10px 18px;border:1px solid transparent;border-radius:var(--radius-sm);cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:600;transition:transform .15s ease, box-shadow .15s ease, background .15s ease, color .15s ease, border-color .15s ease;display:inline-flex;align-items:center;gap:7px;letter-spacing:.01em;}
.btn:hover{transform:translateY(-1px);box-shadow:var(--sh-sm);}
.btn:active{transform:translateY(0);}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:hover{background:var(--primary2);}
.btn-ok{background:var(--ok);color:#fff;}
.btn-ok:hover{filter:brightness(1.05);}
.btn-err{background:var(--err);color:#fff;}
.btn-err:hover{filter:brightness(1.05);}
.btn-outline{border-color:var(--primary);color:var(--primary);background:transparent;}
.btn-outline:hover{background:var(--primary-bg);}
.btn-ghost{background:var(--card);color:var(--text);border-color:var(--border);}
.btn-ghost:hover{background:var(--card-hover);border-color:var(--border-strong);}
.btn-sm{padding:7px 14px;font-size:12.5px;}

/* ── Nav buttons row ── */
.nav-row{display:flex;justify-content:center;align-items:center;gap:14px;margin-top:6px;}
.nav-pos{font-size:13px;color:var(--muted);font-weight:500;}

/* ── Responsive ── */
@media(min-width:768px){
  .quiz-choices{grid-template-columns:1fr 1fr;}
  .word-grid{grid-template-columns:1fr 1fr;}
}
@media(max-width:540px){
  .quiz-choices{grid-template-columns:1fr;}
  .fc-word{font-size:22px;}
  main{padding:10px 12px 130px;}
  .hd-stats{gap:4px;}
  .scene{height:320px;}
  .quiz-question{padding:16px 14px;margin-bottom:8px;}
  .face{padding:12px 10px;}
  .quiz-word{font-size:26px;}
  .quiz-sub{font-size:11px;margin-bottom:4px;}
  .fc-front-example{font-size:12px;padding:8px 10px;margin-top:8px;}
  .choice{padding:10px 12px;font-size:13px;min-height:42px;}
  .quiz-choices{gap:6px;margin-bottom:8px;}
  .quiz-feedback{font-size:13px;padding:10px;}
  .fill-card{padding:12px 12px;margin-bottom:8px;}
  .fill-sentence{font-size:17px;}
  .fill-label{font-size:10px;margin-bottom:10px;}
  .nav-row{display:none;}
  .tab .tab-label{display:none;}
  .tab{padding:8px 9px;font-size:14px;}
  .round-result{padding:16px 14px 80px;}
  .round-score-circle{width:100px;height:100px;}
  .round-score-num{font-size:28px;}
  .srs-dash{grid-template-columns:repeat(2,1fr);}
}


/* ── Flash-Modus Runden-Picker ── */
.flash-picker{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px 16px;box-shadow:var(--sh);text-align:center;max-width:420px;margin:0 auto;}
.flash-picker-emoji{font-size:52px;margin-bottom:12px;line-height:1;}
.flash-picker h2{font-size:20px;font-weight:800;letter-spacing:-.02em;margin-bottom:6px;color:var(--text);}
.flash-picker p{color:var(--muted);font-size:14px;margin-bottom:22px;line-height:1.5;}
.flash-picker-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
.fp-btn{padding:18px 10px;background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;font-family:inherit;font-size:15px;font-weight:700;color:var(--text);transition:all .18s ease;line-height:1.2;}
.fp-btn small{display:block;font-size:11px;font-weight:400;color:var(--muted);margin-top:3px;}
.fp-btn:hover{border-color:var(--primary);background:var(--primary-bg);color:var(--primary);}
.fp-btn:hover small{color:var(--primary);}
.fp-btn.fp-featured{border-color:var(--primary);background:var(--primary-bg);color:var(--primary);}
.cat-chip-row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:0 auto 14px;max-width:560px;}
.cat-chip{padding:5px 11px;border:1px solid var(--border);border-radius:var(--radius-full);background:var(--card);color:var(--text-soft);font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:all .15s ease;}
.cat-chip:hover{border-color:var(--primary);color:var(--primary);}
.cat-chip.active{background:var(--primary);border-color:var(--primary);color:#fff;}
.cat-chip-n{font-size:10px;opacity:.7;font-weight:700;}
.cat-chip.active .cat-chip-n{opacity:.9;}
.speak-sm{width:22px;height:22px;min-width:22px;font-size:11px;padding:0;margin-right:6px;vertical-align:middle;}
.fp-btn.fp-featured small{color:var(--primary-soft);}
.fp-btn-all{width:100%;padding:12px;background:transparent;border:1px dashed var(--border-strong);border-radius:var(--radius-sm);cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:500;color:var(--muted);transition:all .18s ease;}
.fp-btn-all:hover{color:var(--text);border-color:var(--primary);}

/* ── Quiz-Bild-Header ── */
.quiz-img-wrap{width:100%;height:200px;background:var(--primary-bg);display:flex;align-items:center;justify-content:center;padding:10px;border-radius:var(--radius) var(--radius) 0 0;}
.quiz-img-hd{max-width:100%;max-height:180px;object-fit:contain;border-radius:8px;display:block;}
.quiz-img-ph{width:100%;height:180px;display:flex;align-items:center;justify-content:center;font-size:64px;}
@media(max-width:540px){
  .quiz-img-wrap{height:130px;}
  .quiz-img-hd{max-height:110px;}
  .quiz-img-ph{height:110px;font-size:40px;}
}

.quiz-example{font-size:12px;color:var(--muted);font-style:italic;margin-top:8px;padding:6px 10px;background:var(--bg);border-radius:var(--radius-sm);text-align:left;line-height:1.55;border-left:2px solid var(--border);}
.quiz-example .ex-blank{font-weight:700;color:var(--primary);font-style:normal;background:var(--primary-bg);padding:1px 4px;border-radius:3px;}
@media(max-width:540px){.quiz-example{font-size:11px;margin-top:6px;padding:5px 8px;}}
/* ── Auto-Advance Timer-Bar (korrekte Antwort) ── */
.auto-adv-bar{height:3px;background:var(--border);border-radius:var(--radius-full);overflow:hidden;margin-top:8px;}
.auto-adv-fill{height:100%;background:var(--ok);border-radius:var(--radius-full);animation:autoFill 1.5s linear forwards;}
@keyframes autoFill{from{width:0%}to{width:100%}}

/* ── Sticky Mobile Action Bar (Weiter / Überspringen) ── */
#mobileNextBar{
  display:none;
  position:fixed;
  bottom:0;left:0;right:0;
  background:var(--card);
  border-top:1px solid var(--border);
  padding:10px 16px;
  padding-bottom:max(10px,env(safe-area-inset-bottom));
  z-index:60;
  box-shadow:0 -4px 20px rgba(15,23,42,.14);
  animation:slideUp .22s cubic-bezier(.4,0,.2,1);
}
@keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
#mobileNextBar .mnb-btn{
  display:block;width:100%;padding:15px;
  background:var(--primary);color:#fff;border:none;
  border-radius:var(--radius-sm);font-family:inherit;
  font-size:16px;font-weight:700;cursor:pointer;
  letter-spacing:.01em;transition:filter .15s;
}
#mobileNextBar .mnb-btn:active{filter:brightness(.92);}
@media(min-width:541px){#mobileNextBar{display:none !important;}}

/* ── Subtle focus ring for accessibility ── */
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:var(--radius-sm);}

/* ═══════════════════════════════════════════════
   🧠 SRS (Spaced Repetition) – Dashboard, Level-Badges, Training-Buttons
   ═══════════════════════════════════════════════ */
.srs-dash{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px;}
.srs-dash-item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 12px;text-align:center;box-shadow:var(--sh-sm);transition:transform .15s ease, box-shadow .15s ease;}
.srs-dash-item:hover{transform:translateY(-2px);box-shadow:var(--sh);}
.srs-dash-num{font-size:26px;font-weight:800;line-height:1;color:var(--text);letter-spacing:-.02em;}
.srs-dash-label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:6px;}
.srs-dash-item.due .srs-dash-num{color:var(--primary);}
.srs-dash-item.new .srs-dash-num{color:var(--warn);}
.srs-dash-item.learn .srs-dash-num{color:#2563eb;}
.srs-dash-item.mastered .srs-dash-num{color:var(--ok);}
@media (max-width:640px){
  .srs-dash{grid-template-columns:repeat(2,1fr);}
}

.srs-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px;}
.srs-actions .btn{min-width:150px;}
.btn-srs-ok{background:var(--ok);color:#fff;border:1px solid var(--ok);}
.btn-srs-ok:hover{filter:brightness(.95);}
.btn-srs-err{background:var(--err);color:#fff;border:1px solid var(--err);}
.btn-srs-err:hover{filter:brightness(.95);}

.srs-empty{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:48px 28px;text-align:center;box-shadow:var(--sh);}
.srs-empty-emoji{font-size:54px;margin-bottom:14px;}
.srs-empty h2{font-size:22px;font-weight:700;margin-bottom:6px;}
.srs-empty p{color:var(--muted);font-size:14.5px;margin-bottom:22px;}

/* Level-Badges */
.level-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:var(--radius-full);font-size:11px;font-weight:600;letter-spacing:.02em;border:1px solid transparent;}
.lvl-0{background:var(--warn-bg);color:var(--warn-text);border-color:rgba(245,158,11,.3);}
.lvl-1,.lvl-2{background:#dbeafe;color:#1e40af;border-color:rgba(37,99,235,.25);}
body.dark .lvl-1,body.dark .lvl-2{background:rgba(59,130,246,.15);color:#93c5fd;border-color:rgba(59,130,246,.35);}
.lvl-3,.lvl-4{background:#e0e7ff;color:#3730a3;border-color:rgba(79,70,229,.25);}
body.dark .lvl-3,body.dark .lvl-4{background:rgba(129,140,248,.15);color:#c7d2fe;border-color:rgba(129,140,248,.35);}
.lvl-5,.lvl-6{background:#f3e8ff;color:#6b21a8;border-color:rgba(147,51,234,.25);}
body.dark .lvl-5,body.dark .lvl-6{background:rgba(168,85,247,.15);color:#e9d5ff;border-color:rgba(168,85,247,.35);}
.lvl-7{background:var(--ok-bg);color:var(--ok-text);border-color:rgba(5,150,105,.3);}
.due-pill{display:inline-block;background:var(--primary-bg);color:var(--primary);font-size:10px;font-weight:700;padding:1px 7px;border-radius:var(--radius-full);letter-spacing:.04em;text-transform:uppercase;margin-left:6px;}

.srs-settings-row{display:flex;justify-content:flex-end;margin-top:18px;}
.srs-reset-btn{background:transparent;color:var(--muted);border:1px dashed var(--border-strong);padding:6px 12px;border-radius:var(--radius-sm);font-size:12px;font-weight:500;cursor:pointer;transition:color .15s, border-color .15s;}
.srs-reset-btn:hover{color:var(--err);border-color:var(--err);}

.srs-intro{background:var(--primary-bg);border:1px solid rgba(99,102,241,.25);border-radius:var(--radius);padding:8px 12px;margin-bottom:10px;font-size:12px;color:var(--text-soft);}
.srs-intro strong{color:var(--primary);}

/* Sync-Badge & Leiste */
.sync-row{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
.sync-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:var(--radius-full);font-size:12px;font-weight:600;letter-spacing:.01em;border:1px solid var(--border);background:var(--card);cursor:pointer;user-select:none;transition:all .15s ease;}
.sync-badge:hover{border-color:var(--border-strong);background:var(--card-hover);}
.sync-ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 25%,var(--border));background:var(--ok-bg);}
.sync-off{color:var(--muted);border-style:dashed;}
.sync-err{color:var(--err);border-color:color-mix(in srgb,var(--err) 25%,var(--border));background:var(--err-bg);}
.sync-active{color:var(--primary);border-color:color-mix(in srgb,var(--primary) 30%,var(--border));background:var(--primary-bg);}
.sync-manual-btn{background:transparent;border:1px solid var(--border);color:var(--muted);padding:5px 12px;border-radius:var(--radius-full);font-size:12px;font-weight:500;cursor:pointer;transition:all .15s ease;}
.sync-manual-btn:hover{color:var(--primary);border-color:var(--primary);}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:100;padding:18px;}
.modal-overlay.open{display:flex;}
.modal{background:var(--card);color:var(--text);border-radius:var(--radius-lg);padding:24px;max-width:520px;width:100%;box-shadow:var(--sh-lg);border:1px solid var(--border);max-height:90vh;overflow-y:auto;}
.modal h2{font-size:19px;font-weight:700;letter-spacing:-.01em;margin-bottom:6px;}
.modal .modal-sub{color:var(--muted);font-size:13px;margin-bottom:16px;line-height:1.5;}
.modal label{display:block;font-size:12px;font-weight:600;color:var(--text-soft);margin-bottom:6px;letter-spacing:.02em;}
.modal .input{width:100%;padding:10px 12px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);font-family:inherit;font-size:13px;background:var(--bg);color:var(--text);margin-bottom:14px;transition:border-color .15s;}
.modal .input:focus{outline:none;border-color:var(--primary);}
.modal .input.mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;font-size:12px;}
.modal .hint{font-size:12.5px;color:var(--muted);background:var(--primary-bg);border-left:3px solid var(--primary);padding:10px 12px;border-radius:var(--radius-sm);margin-bottom:14px;line-height:1.5;}
.modal .hint code{background:var(--card);padding:1px 6px;border-radius:4px;font-size:11.5px;}
.modal .modal-msg{font-size:13px;margin:10px 0;min-height:18px;}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px;}

/* ── Header-Stat-Badges (Streak, XP, Tagesziel) ── */
.hd-stats{flex-wrap:wrap;}
.stat-streak{color:#ea580c;border-color:rgba(234,88,12,.25);background:#fff7ed;}
body.dark .stat-streak{color:#fdba74;background:rgba(234,88,12,.18);border-color:rgba(234,88,12,.4);}
.stat-xp{color:#7c3aed;border-color:rgba(124,58,237,.25);background:#f5f3ff;}
body.dark .stat-xp{color:#c4b5fd;background:rgba(124,58,237,.18);border-color:rgba(124,58,237,.4);}
.stat-goal{color:#0891b2;border-color:rgba(8,145,178,.25);background:#ecfeff;}
body.dark .stat-goal{color:#67e8f9;background:rgba(8,145,178,.18);border-color:rgba(8,145,178,.4);}
@media (max-width:680px){
  .hd-stats .stat-ok,.hd-stats .stat-err{display:none;} /* Platz sparen am Handy */
}

/* ── Combo-Badge in Quiz/Fill Feedback ── */
.combo-badge{display:inline-block;margin-left:6px;background:linear-gradient(90deg,#f59e0b,#ea580c);color:#fff;padding:2px 10px;border-radius:var(--radius-full);font-size:12px;font-weight:700;letter-spacing:.02em;animation:pop .35s cubic-bezier(.34,1.56,.64,1);}
@keyframes pop{0%{transform:scale(.7);opacity:0;}100%{transform:scale(1);opacity:1;}}

/* ── 10er-Runden-Auswertung ── */
.round-result{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--sh);padding:20px 18px 80px;text-align:center;}
.round-emoji{font-size:44px;margin-bottom:4px;line-height:1;}
.round-title{font-size:20px;font-weight:800;letter-spacing:-.02em;margin-bottom:4px;}
.round-msg{color:var(--muted);font-size:13px;margin-bottom:12px;}
.round-score-circle{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:120px;height:120px;border-radius:50%;background:var(--primary-bg);border:5px solid var(--primary);margin:4px auto 12px;}
.round-score-num{font-size:34px;font-weight:800;color:var(--primary);line-height:1;letter-spacing:-.03em;}
.round-score-of{font-size:18px;font-weight:600;color:var(--primary-soft);}
.round-score-pct{margin-top:4px;font-size:14px;font-weight:600;color:var(--text-soft);}
.round-mini-stats{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:10px auto 6px;max-width:560px;}
.rm{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 14px;min-width:72px;}
.rm-num{font-size:16px;font-weight:700;color:var(--text);}
.rm-lbl{font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-top:1px;}
.rm-err .rm-num{color:var(--err);}
.rm-bonus{background:linear-gradient(135deg,rgba(245,158,11,.18),rgba(234,88,12,.12));border-color:rgba(234,88,12,.35);}
.rm-bonus .rm-num{color:#ea580c;}
.round-wrong-list{margin:12px auto 0;text-align:left;background:var(--err-bg);border:1px solid color-mix(in srgb,var(--err) 25%,var(--border));border-radius:var(--radius-sm);padding:10px 14px;max-width:560px;max-height:140px;overflow-y:auto;}
.round-wrong-head{font-size:13px;font-weight:700;color:var(--err-text);margin-bottom:8px;letter-spacing:.02em;}
.round-wrong-item{font-size:14px;color:var(--text-soft);padding:4px 0;border-bottom:1px solid color-mix(in srgb,var(--err) 12%,transparent);}
.round-wrong-item:last-child{border-bottom:none;}
.round-wrong-item .muted{color:var(--muted);margin-left:6px;}
.round-actions{display:none;}

/* ── Tagesziel-Ring + Accuracy-Trend (auf Training-Dashboard) ── */
.goal-row{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;margin-bottom:18px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--sh-sm);}
.goal-ring-wrap{position:relative;width:78px;height:78px;flex-shrink:0;}
.goal-ring-wrap svg{transform:rotate(-90deg);}
.goal-ring-bg{fill:none;stroke:var(--border);stroke-width:8;}
.goal-ring-fill{fill:none;stroke:var(--primary);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .6s cubic-bezier(.4,0,.2,1);}
.goal-ring-text{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;}
.goal-ring-num{font-size:18px;color:var(--text);line-height:1;}
.goal-ring-of{font-size:11px;color:var(--muted);}
.goal-meta{display:flex;flex-direction:column;gap:6px;}
.goal-meta-line{display:flex;justify-content:space-between;font-size:13px;color:var(--text-soft);}
.goal-meta-line strong{font-weight:700;color:var(--text);}
.trend-up{color:var(--ok);}
.trend-down{color:var(--err);}
.trend-flat{color:var(--muted);}
.goal-edit{font-size:11px;color:var(--muted);cursor:pointer;text-decoration:underline dashed;background:none;border:none;padding:0;font-family:inherit;}
.goal-edit:hover{color:var(--primary);}

/* ── Session-Historie ── */
.history-box{margin-top:22px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--sh-sm);}
.history-head{font-size:13px;font-weight:700;color:var(--text-soft);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;}
.history-row{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:8px 0;font-size:13.5px;border-bottom:1px solid var(--border);}
.history-row:last-child{border-bottom:none;}
.history-mode{padding:2px 8px;border-radius:var(--radius-full);background:var(--primary-bg);color:var(--primary);font-size:11.5px;font-weight:700;letter-spacing:.02em;}
.history-date{color:var(--muted);font-size:12px;}
.history-score{color:var(--text);font-weight:600;}
.history-score-pct{color:var(--muted);font-size:12px;margin-left:2px;}
.history-empty{color:var(--muted);font-size:13.5px;text-align:center;padding:14px 0;}



/* Karteikarten: SRS-Bewertungszeile */
.srs-rate-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px;}
.srs-rate-row .btn{flex:1;max-width:220px;min-width:140px;font-weight:600;}
@media(max-width:540px){
  .srs-rate-row{position:fixed;bottom:0;left:0;right:0;margin:0;padding:10px 12px;padding-bottom:max(10px,env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--border);z-index:55;gap:8px;}
  .srs-rate-row .btn{min-width:0;max-width:none;padding:14px 10px;font-size:15px;}
}
.srs-compact-bar{display:flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;margin-bottom:14px;flex-wrap:wrap;}.scb-sep{width:1px;height:36px;background:var(--border);margin:0 4px;flex-shrink:0;}.scb-item{display:flex;flex-direction:column;align-items:center;min-width:46px;flex:1;}.scb-val{font-size:16px;font-weight:700;color:var(--text);line-height:1.1;}.scb-of{font-size:11px;font-weight:400;color:var(--muted);}.scb-label{font-size:10px;color:var(--muted);margin-top:1px;white-space:nowrap;}.scb-prog-wrap{height:3px;width:100%;background:var(--border);border-radius:2px;margin-top:3px;overflow:hidden;}.scb-prog-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .4s ease;}.scb-goal-btn{background:none;border:1px solid var(--border);border-radius:var(--radius-sm);padding:4px 6px;cursor:pointer;color:var(--muted);font-size:12px;flex-shrink:0;align-self:center;}.scb-goal-btn:hover{color:var(--text);border-color:var(--accent);}.scb-due .scb-val{color:#e53e3e;}.scb-new .scb-val{color:#3182ce;}.scb-mastered .scb-val{color:#38a169;}</style>
</head>
<body>

<nav>
  <div class="nav-tabs">
    <button class="tab active" onclick="setMode('train',this)">🧠 <span class="tab-label">Training</span></button>
    <button class="tab" onclick="setMode('flash',this)">🃏 <span class="tab-label">Karteikarten</span></button>
    <button class="tab" onclick="setMode('quiz',this)">❓ <span class="tab-label">Quiz</span></button>
    <button class="tab" onclick="setMode('fill',this)">✏️ <span class="tab-label">Lückentext</span></button>
    <button class="tab" onclick="setMode('list',this)">📋 <span class="tab-label">Wortliste</span></button>
  </div>
  <div class="hd-stats">
    <span class="stat stat-streak" id="statStreak" title="Streak">🔥 0</span>
    <span class="stat stat-xp" id="statXP" title="XP">⭐ 0</span>
    <span class="stat stat-goal" id="statGoal" title="Tagesziel">🎯 0/20</span>
    <span class="stat stat-ok" id="statOk" title="Richtig">✓ 0</span>
    <span class="stat stat-err" id="statErr" title="Falsch">✗ 0</span>
    <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" aria-label="Theme" title="Hell/Dunkel">🌙</button>
  </div>
</nav>

<main id="app"></main>

<div id="mobileNextBar">
  <button class="mnb-btn" id="mobileNextBtn" onclick="mobileNextAction()">Weiter →</button>
</div>

<script>
/* ═══════════════════════════════════════════════
   WORTLISTE – hier werden neue Wörter eingefügt
   ═══════════════════════════════════════════════ */
const WORDS = [
  {
    id: 1,
    word: "ambitious",
    translation: "ehrgeizig, ambitioniert",
    pronunciation: "/æmˈbɪʃəs/",
    wordType: "Adjektiv",
    definition: "Having a strong desire and determination to succeed.",
    examples: [
      "She is very ambitious and plans to become a CEO before turning 30.",
      "His ambitious goals inspired everyone on the team."
    ], exampleDE: "Sie ist sehr ehrgeizig und plant, vor ihrem 30. Geburtstag CEO zu werden.",

const WIKI_TITLES_CI = {};

function wikiTitleFor(word){
  if(!word) return '';
  return WIKI_TITLES[word] || WIKI_TITLES_CI[String(word).toLowerCase()] || '';
}
function imgKey(word){ return String(word||'').toLowerCase(); }

// Bild-Cache aus localStorage laden (für schnelles Wiederöffnen)
let imageCache = {};
try { imageCache = JSON.parse(localStorage.getItem('etImageCache') || '{}'); } catch(e) {}
// Migration: alte kaputte Einträge entsorgen
// - Special:FilePath: unzuverlässige Redirects
// - /400px-: nicht-existierende Wikimedia-Thumbnail-Größe (liefert "Wikimedia Error" 404)
try {
  let cleaned = 0;
  for(const k of Object.keys(imageCache)){
    const v = imageCache[k];
    if(typeof v === 'string' && (v.includes('Special:FilePath') || v.includes('/400px-'))){
      delete imageCache[k]; cleaned++;
    }
  }
  // P1-FIX: Cache-Keys auf Kleinschreibung migrieren (einmalig)
  for(const k of Object.keys(imageCache)){
    const lk = k.toLowerCase();
    if(lk !== k){ if(!imageCache[lk]) imageCache[lk] = imageCache[k]; delete imageCache[k]; cleaned++; }
  }
  if(cleaned){ localStorage.setItem('etImageCache', JSON.stringify(imageCache)); console.log('[Bilder] '+cleaned+' Cache-Einträge migriert/entfernt'); }
} catch(e) {}

function getImg(w){
  const url = w.imageUrl || '';
  // Special:FilePath-URLs sind unzuverlässige Redirects → API-Cache bevorzugen
  if(url && !url.includes('Special:FilePath')) return url;
  const k = imgKey(w.word);
  // 1. Fest eingebaute URL (P3, sofort verfügbar) → 2. Laufzeit-Cache
  return IMG_URLS[k] || imageCache[k] || '';
}

async function fetchWikiImage(word){
  const title = wikiTitleFor(word);   // P1-FIX: case-insensitiv
  if(!title) return '';
  try {
    // Wikipedia REST-API (CORS-frei). User-Agent wird vom Browser gesetzt;
    // ein eigener User-Agent-Header ist im Browser nicht erlaubt.
    const r = await fetch(
      'https://en.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(title)
    );
    if(!r.ok){ console.warn('[Bilder] API-Fehler', title, r.status); return ''; }
    const d = await r.json();
    let url = (d.thumbnail && d.thumbnail.source) ? d.thumbnail.source : '';
    // Größe NICHT umschreiben — Wikimedia generiert nur bestimmte Thumb-Größen,
    // beliebige /<N>px- URLs liefern 'Wikimedia Error' (404). API-URL as-is verwenden.
    if(url){
      imageCache[imgKey(word)] = url;   // P1-FIX: Key normalisiert
      try { localStorage.setItem('etImageCache', JSON.stringify(imageCache)); } catch(e) {}
    }
    return url;
  } catch(e){ console.warn('[Bilder] Netzwerkfehler', word, e); return ''; }
}

async function prefetchImages(){
  // Nur Wörter holen, die weder eine feste URL noch einen Cache-Eintrag haben
  const missing = WORDS.filter(w =>
    (!w.imageUrl || w.imageUrl.includes('Special:FilePath')) &&
    wikiTitleFor(w.word) && !IMG_URLS[imgKey(w.word)] && !imageCache[imgKey(w.word)]);
  if(!missing.length) return;
  // P1-FIX: parallel in 4er-Gruppen statt streng nacheinander (95 Bilder: >60s → ~8s)
  const BATCH = 4;
  let loaded = 0, sinceRender = 0;
  for(let i = 0; i < missing.length; i += BATCH){
    const urls = await Promise.all(missing.slice(i, i+BATCH).map(w => fetchWikiImage(w.word)));
    const ok = urls.filter(Boolean).length;
    loaded += ok; sinceRender += ok;
    if(sinceRender >= 8){ sinceRender = 0; try { render(); } catch(e){} }
    await new Promise(res => setTimeout(res, 120)); // höfliches Rate-Limiting zwischen Gruppen
  }
  if(loaded) try { render(); } catch(e){} // Finale Aktualisierung
}


function speakWord(text, lang){
  if(!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  // v3.3: Deutsche Wörter (z. B. Fragen in DE→EN) mit deutscher Stimme sprechen
  const wantDE = lang === 'de';
  u.lang = wantDE ? 'de-DE' : 'en-US'; u.rate = 0.85; u.pitch = 1;
  const voices = window.speechSynthesis.getVoices();
  const prefix = wantDE ? 'de' : 'en';
  const v = voices.find(v => v.lang.startsWith(prefix) && v.localService) ||
            voices.find(v => v.lang.startsWith(prefix));
  if(v) u.voice = v;
  window.speechSynthesis.speak(u);
}

/* ═══════════════════════════════════════════════
   🧠 SPACED REPETITION (Leitner-Box, Lexilize-inspiriert)
   ═══════════════════════════════════════════════ */
const SRS = {
  KEY: 'etSRS_v1',
  // index = stufe; INTERVALS_DAYS[level] = Tage bis zur naechsten Wiederholung
  INTERVALS_DAYS: [0, 0, 1, 3, 7, 14, 30, 90],
  LABELS: ['Neu','Lernen','+1 Tag','+3 Tage','+7 Tage','+2 Wo','+30 Tage','Gemeistert'],
  state: {},

  load(){
    try { this.state = JSON.parse(localStorage.getItem(this.KEY) || '{}'); }
    catch(e){ this.state = {}; }
  },
  save(skipSync){
    try { localStorage.setItem(this.KEY, JSON.stringify(this.state)); } catch(e) {}
    if(!skipSync && typeof Sync !== 'undefined' && Sync.schedulePush){ Sync.schedulePush(); }
  },
  // Lokales Datum als YYYY-MM-DD (timezone-safe, unabhaengig von UTC-Offset)
  localISO(d){
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const dd = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${dd}`;
  },
  todayISO(){ return this.localISO(new Date()); },
  addDays(iso, days){
    const [y,m,dd] = iso.split('-').map(Number);
    const d = new Date(y, m-1, dd);
    d.setDate(d.getDate() + days);
    return this.localISO(d);
  },
  entry(id){
    if(!this.state[id]){
      this.state[id] = { level:0, nextDue:this.todayISO(), lastReview:null, ok:0, wrong:0, updatedAt:0 };
    }
    return this.state[id];
  },
  isDue(id){
    const e = this.entry(id);
    return e.nextDue <= this.todayISO();
  },
  markCorrect(id){
    const e = this.entry(id);
    const wasMaster = (e.level||0) >= 7;
    e.level = Math.min(7, (e.level||0) + 1);
    e.lastReview = this.todayISO();
    e.nextDue = this.addDays(this.todayISO(), this.INTERVALS_DAYS[e.level] || 0);
    e.ok = (e.ok||0) + 1;
    e.updatedAt = Date.now();
    this.save();
    if(!wasMaster && e.level >= 7 && typeof Stats !== 'undefined' && Stats.recordMastered){
      Stats.recordMastered();
    }
  },
  markWrong(id){
    const e = this.entry(id);
    e.level = 1;
    e.lastReview = this.todayISO();
    e.nextDue = this.todayISO(); // sofort wieder
    e.wrong = (e.wrong||0) + 1;
    e.updatedAt = Date.now();
    this.save();
  },
  resetAll(){
    // Tombstone-Zeitstempel, damit ein leerer Stand beim Sync als "neuer" gilt
    // als ein vollerer Remote-Stand vom anderen Gerät.
    this.state = { __reset: { updatedAt: Date.now() } };
    this.save();
    delete this.state.__reset; // lokal nicht benötigt
    this.save(true);
  },
  // Merge eines Remote-Stands in den lokalen State.
  // Regel: pro Wort-ID gewinnt der Eintrag mit dem höheren updatedAt.
  // Fehlt lokal, remote vorhanden -> übernehmen. Umgekehrt -> lokaler Stand bleibt.
  mergeRemote(remote){
    if(!remote || typeof remote !== 'object') return false;
    const remoteEntries = remote.entries || {};
    let changed = false;
    // Global-Reset-Tombstone: wenn Remote einen __reset hat, der neuer ist als ALLE lokalen Einträge, leeren
    const remoteReset = remoteEntries.__reset && remoteEntries.__reset.updatedAt ? remoteEntries.__reset.updatedAt : 0;
    if(remoteReset){
      const anyLocalNewer = Object.entries(this.state).some(([id,e]) => id !== '__reset' && (e.updatedAt||0) > remoteReset);
      if(!anyLocalNewer){
        // Remote hat reset, lokal keine neueren Änderungen -> alles leeren
        const hadEntries = Object.keys(this.state).some(k => k !== '__reset');
        this.state = {};
        if(hadEntries){ changed = true; this.save(true); }
        return changed;
      }
    }
    for(const [id, r] of Object.entries(remoteEntries)){
      if(id === '__reset') continue;
      const l = this.state[id];
      if(!l){ this.state[id] = r; changed = true; continue; }
      const lU = l.updatedAt || 0;
      const rU = r.updatedAt || 0;
      if(rU > lU){ this.state[id] = r; changed = true; }
    }
    if(changed) this.save(true);
    // Stats parallel mergen (eigenes updatedAt-Feld)
    if(remote.stats && typeof Stats !== 'undefined' && Stats.applyRemote){
      if(Stats.applyRemote(remote.stats)) changed = true;
    }
    return changed;
  },
  stats(words){
    const today = this.todayISO();
    let due=0, fresh=0, learning=0, mastered=0;
    words.forEach(w => {
      const e = this.state[w.id];
      if(!e){ fresh++; due++; return; }
      if(e.level >= 7) mastered++;
      else if(e.level >= 1) learning++;
      else fresh++;
      if(e.nextDue <= today) due++;
    });
    return { due, fresh, learning, mastered, total: words.length };
  },
  dueQueue(words){
    const today = this.todayISO();
    return words
      .filter(w => {
        const e = this.state[w.id];
        return !e || e.nextDue <= today;
      })
      .sort((a,b) => {
        const ea = this.state[a.id], eb = this.state[b.id];
        const la = ea ? ea.level : 0, lb = eb ? eb.level : 0;
        // Niedrige Stufen zuerst (faellige Lernwoerter), neue gemischt rein
        if(la !== lb) return la - lb;
        return Math.random() - 0.5;
      });
  }
};
SRS.load();

/* ═══════════════════════════════════════════════
   🏆 STATS (XP, Streak, Sessions, Tagesziel, Match-Highscore)
   ═══════════════════════════════════════════════ */
const Stats = {
  KEY: 'etStats_v1',
  defaults(){
    return {
      xp: 0,
      streak: 0,
      longestStreak: 0,
      lastDay: null,
      dailyGoal: 20,
      dailyProgress: {},   // { 'YYYY-MM-DD': count }
      sessions: [],        // letzte 50 Sessions
      perfectRounds: 0,
      bestCombo: 0,
      updatedAt: 0
    };
  },
  state: null,
  load(){
    this.state = this.defaults();
    try {
      const raw = JSON.parse(localStorage.getItem(this.KEY) || 'null');
      if(raw && typeof raw === 'object') Object.assign(this.state, raw);
    } catch(e){}
  },
  save(skipSync){
    this.state.updatedAt = Date.now();
    try { localStorage.setItem(this.KEY, JSON.stringify(this.state)); } catch(e){}
    if(!skipSync && typeof Sync !== 'undefined' && Sync.schedulePush){ Sync.schedulePush(); }
  },
  todayISO(){ return SRS.todayISO(); },
  yesterdayISO(){ return SRS.addDays(SRS.todayISO(), -1); },

  // Bei jeder Antwort aufgerufen. wasCorrect: bool, mode: string
  recordAnswer(wasCorrect, mode){
    const today = this.todayISO();
    // Streak-Bumping nur einmal pro Tag
    if(this.state.lastDay !== today){
      if(this.state.lastDay === this.yesterdayISO()){
        this.state.streak = (this.state.streak || 0) + 1;
      } else {
        this.state.streak = 1;
      }
      this.state.lastDay = today;
      if(this.state.streak > (this.state.longestStreak||0)){
        this.state.longestStreak = this.state.streak;
      }
    }
    this.state.dailyProgress[today] = (this.state.dailyProgress[today] || 0) + 1;
    if(wasCorrect) this.state.xp = (this.state.xp || 0) + 10;
    this.save();
  },

  awardBonus(n){ this.state.xp = (this.state.xp || 0) + n; this.save(); },
  recordPerfectRound(){ this.state.perfectRounds = (this.state.perfectRounds || 0) + 1; this.awardBonus(50); },
  recordMastered(){ this.awardBonus(25); },
  recordCombo(c){ if(c > (this.state.bestCombo||0)){ this.state.bestCombo = c; this.save(); } },

  recordSession(s){
    const session = Object.assign({ date: this.todayISO(), ts: Date.now() }, s);
    this.state.sessions.unshift(session);
    if(this.state.sessions.length > 50) this.state.sessions = this.state.sessions.slice(0, 50);
    this.save();
  },



  // 7-Tage-Accuracy-Trend (vs. die 7 Tage davor)
  accuracyTrend(){
    const todayMs = new Date(this.todayISO()).getTime();
    let cur = {tot:0,ok:0}, prev = {tot:0,ok:0};
    for(const s of this.state.sessions){
      if(typeof s.total !== 'number' || typeof s.correct !== 'number') continue;
      const sMs = new Date(s.date).getTime();
      const ageDays = Math.floor((todayMs - sMs) / 86400000);
      if(ageDays < 0) continue;
      if(ageDays < 7){ cur.tot += s.total; cur.ok += s.correct; }
      else if(ageDays < 14){ prev.tot += s.total; prev.ok += s.correct; }
    }
    const curPct  = cur.tot  ? Math.round(100 * cur.ok / cur.tot)  : null;
    const prevPct = prev.tot ? Math.round(100 * prev.ok / prev.tot) : null;
    const diff = (curPct !== null && prevPct !== null) ? (curPct - prevPct) : 0;
    return { curPct, prevPct, diff, samples: cur.tot };
  },

  todayProgress(){ return this.state.dailyProgress[this.todayISO()] || 0; },
  todayGoalPct(){ const g = this.state.dailyGoal || 20; return Math.min(1, this.todayProgress() / g); },
  setDailyGoal(n){ if(typeof n === 'number' && n > 0 && n <= 999){ this.state.dailyGoal = n; this.save(); } },

  // Wird beim Sync-Pull aufgerufen
  applyRemote(remote){
    if(!remote || typeof remote !== 'object') return false;
    const lU = this.state.updatedAt || 0;
    const rU = remote.updatedAt || 0;
    if(rU > lU){
      this.state = Object.assign(this.defaults(), remote);
      try { localStorage.setItem(this.KEY, JSON.stringify(this.state)); } catch(e){}
      return true;
    }
    return false;
  }
};
Stats.load();

/* ═══════════════════════════════════════════════
   ☁️ SYNC (GitHub-Gist-basierte Geräte-Synchronisation)
   Speicherort: Ein privater Gist im GitHub-Account des Users.
   Token: fine-grained PAT mit "Gist"-Scope, lokal in localStorage.
   Merge: pro Wort-ID gewinnt das höhere updatedAt. Konfliktfrei, solange
   nur ein Mensch das Training auf beiden Geräten durchführt.
   ═══════════════════════════════════════════════ */
const Sync = {
  TOKEN_KEY: 'etSyncToken_v1',
  GIST_KEY:  'etSyncGistId_v1',
  FILENAME:  'english-trainer-srs.json',
  status: 'off',    // off | ok | pushing | pulling | error
  lastError: null,
  lastSync: null,
  _debounce: null,
  _inflight: false,
  _pendingAfterInflight: false,

  token(){ try { return localStorage.getItem(this.TOKEN_KEY) || ''; } catch(e){ return ''; } },
  gistId(){ try { return localStorage.getItem(this.GIST_KEY) || ''; } catch(e){ return ''; } },
  isConfigured(){ return !!this.token(); },

  setToken(t){
    try {
      if(t) localStorage.setItem(this.TOKEN_KEY, t);
      else  localStorage.removeItem(this.TOKEN_KEY);
    } catch(e){}
  },
  setGistId(g){
    try {
      if(g) localStorage.setItem(this.GIST_KEY, g);
      else  localStorage.removeItem(this.GIST_KEY);
    } catch(e){}
  },

  setStatus(s, err){
    this.status = s;
    this.lastError = err || null;
    if(s === 'ok') this.lastSync = new Date();
    this.renderBadge();
  },

  renderBadge(){
    const el = document.getElementById('syncBadge');
    if(!el) return;
    el.innerHTML = this.badgeHTML();
  },

  badgeHTML(){
    if(!this.isConfigured())    return `<span class="sync-badge sync-off" onclick="openSyncModal()" title="Sync ist noch nicht eingerichtet – klicken zum Einrichten">☁️ Sync einrichten</span>`;
    if(this.status === 'pushing') return `<span class="sync-badge sync-active">⟳ Synchronisiere…</span>`;
    if(this.status === 'pulling') return `<span class="sync-badge sync-active">↓ Lade Stände…</span>`;
    if(this.status === 'error')   return `<span class="sync-badge sync-err" onclick="openSyncModal()" title="${(this.lastError||'').replace(/"/g,'&quot;')}">⚠️ Sync-Fehler – klick für Details</span>`;
    const t = this.lastSync ? this.lastSync.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}) : '';
    return `<span class="sync-badge sync-ok" onclick="openSyncModal()" title="Klicken für Einstellungen">☁️ Synchronisiert${t?' · '+t:''}</span>`;
  },

  async api(method, path, body){
    const token = this.token();
    if(!token) throw new Error('Kein Token gesetzt.');
    const res = await fetch('https://api.github.com' + path, {
      method,
      headers: {
        'Accept': 'application/vnd.github+json',
        'Authorization': 'Bearer ' + token,
        'X-GitHub-Api-Version': '2022-11-28',
        'Content-Type': 'application/json'
      },
      body: body ? JSON.stringify(body) : undefined
    });
    if(!res.ok){
      const txt = await res.text().catch(()=> '');
      throw new Error(res.status + ' ' + res.statusText + (txt ? ' – ' + txt.slice(0,200) : ''));
    }
    return res.json();
  },

  buildPayload(){
    return {
      schema: 2,
      updatedAt: Date.now(),
      entries: SRS.state,
      stats: (typeof Stats !== 'undefined') ? Stats.state : null
    };
  },

  async createGist(){
    const gist = await this.api('POST', '/gists', {
      description: 'English Trainer – SRS Sync (Lernfortschritt)',
      public: false,
      files: { [this.FILENAME]: { content: JSON.stringify(this.buildPayload(), null, 2) } }
    });
    this.setGistId(gist.id);
    return gist.id;
  },

  async pull(){
    if(!this.isConfigured()) return false;
    if(!this.gistId()) return false;
    this.setStatus('pulling');
    try {
      const gist = await this.api('GET', '/gists/' + this.gistId());
      const file = gist.files && gist.files[this.FILENAME];
      if(!file) throw new Error('Datei "' + this.FILENAME + '" im Gist nicht gefunden.');
      let raw = file.content || '';
      if(file.truncated && file.raw_url){
        const r = await fetch(file.raw_url);
        raw = await r.text();
      }
      const data = JSON.parse(raw || '{}');
      const changed = SRS.mergeRemote(data);
      this.setStatus('ok');
      if(changed && typeof render === 'function' && typeof WORDS !== 'undefined'){
        if(typeof mode !== 'undefined' && mode === 'train'){
          trainDeck = SRS.dueQueue(WORDS);
        }
        try { render(); } catch(e){}
      }
      return changed;
    } catch(e){
      this.setStatus('error', e.message || String(e));
      return false;
    }
  },

  async push(){
    if(!this.isConfigured()) return false;
    if(this._inflight){ this._pendingAfterInflight = true; return false; }
    this._inflight = true;
    try {
      if(!this.gistId()){
        this.setStatus('pushing');
        await this.createGist();
        this.setStatus('ok');
        return true;
      }
      this.setStatus('pushing');
      await this.api('PATCH', '/gists/' + this.gistId(), {
        files: { [this.FILENAME]: { content: JSON.stringify(this.buildPayload(), null, 2) } }
      });
      this.setStatus('ok');
      return true;
    } catch(e){
      this.setStatus('error', e.message || String(e));
      return false;
    } finally {
      this._inflight = false;
      if(this._pendingAfterInflight){
        this._pendingAfterInflight = false;
        this.schedulePush();
      }
    }
  },

  schedulePush(){
    if(!this.isConfigured()) return;
    clearTimeout(this._debounce);
    this._debounce = setTimeout(() => this.push(), 1500);
  },

  async init(){
    if(!this.isConfigured()){ this.setStatus('off'); return; }
    // 1. Remote einlesen und ggf. mergen
    if(this.gistId()){
      await this.pull();
    }
    // 2. lokalen (ggf. gemergten) Stand hochschieben – falls lokal Einträge neuer sind als remote
    await this.push();
  }
};

/* ═══════════════════════════════════════════════
   Sync-Setup-Modal (einmalige Einrichtung pro Gerät)
   ═══════════════════════════════════════════════ */
function openSyncModal(){
  const m = document.getElementById('syncModal');
  if(!m) return;
  const tok = Sync.token();
  const gid = Sync.gistId();
  document.getElementById('syncTokenInput').value = tok;
  document.getElementById('syncGistInput').value  = gid;
  const hint = document.getElementById('syncModalHint');
  if(Sync.status === 'error' && Sync.lastError){
    hint.innerHTML = '<strong style="color:var(--err)">Letzter Fehler:</strong> ' + Sync.lastError.replace(/</g,'&lt;');
  } else if(gid){
    hint.innerHTML = 'Gist-ID ist gesetzt. Auf dem zweiten Gerät denselben Token und dieselbe Gist-ID eintragen.';
  } else {
    hint.innerHTML = 'Trage deinen GitHub Personal Access Token ein. Lass das Gist-ID-Feld leer, wenn du Sync jetzt zum ersten Mal einrichtest – die App legt dann automatisch einen privaten Gist an.';
  }
  m.classList.add('open');
}
function closeSyncModal(){
  const m = document.getElementById('syncModal');
  if(m) m.classList.remove('open');
}
async function saveSyncSettings(){
  const tok = document.getElementById('syncTokenInput').value.trim();
  const gid = document.getElementById('syncGistInput').value.trim();
  const msg = document.getElementById('syncModalMsg');
  msg.textContent = '';
  if(!tok){
    Sync.setToken(''); Sync.setGistId('');
    Sync.setStatus('off');
    msg.innerHTML = '<span style="color:var(--muted)">Sync getrennt.</span>';
    return;
  }
  Sync.setToken(tok);
  Sync.setGistId(gid);
  msg.innerHTML = '<span style="color:var(--muted)">Verbinde…</span>';
  try {
    if(gid){
      // Zweites Gerät: erst lesen, dann mergen, dann schreiben
      await Sync.pull();
      await Sync.push();
    } else {
      // Erstes Gerät: Gist anlegen
      await Sync.push();
    }
    if(Sync.status === 'ok'){
      document.getElementById('syncGistInput').value = Sync.gistId();
      msg.innerHTML = '<span style="color:var(--ok)">✓ Verbunden. Gist-ID: <code style="user-select:all">' + Sync.gistId() + '</code></span>';
    } else if(Sync.status === 'error'){
      msg.innerHTML = '<span style="color:var(--err)">Fehler: ' + (Sync.lastError||'unbekannt') + '</span>';
    }
  } catch(e){
    msg.innerHTML = '<span style="color:var(--err)">Fehler: ' + (e.message||e) + '</span>';
  }
  Sync.renderBadge();
}
function copyGistIdToClipboard(){
  const g = Sync.gistId();
  if(!g) return;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(g).then(() => {
      const msg = document.getElementById('syncModalMsg');
      if(msg) msg.innerHTML = '<span style="color:var(--ok)">Gist-ID in die Zwischenablage kopiert.</span>';
    });
  }
}
async function manualSyncNow(){
  if(!Sync.isConfigured()){ openSyncModal(); return; }
  await Sync.pull();
  await Sync.push();
}

function srsDashHTML(){

  const accStr = trend.curPct === null ? '—' : `${trend.curPct}%`;

    if(trend.diff > 0)      trendIcon = `<span class="trend-up">↗</span>`;

        <div class="scb-label">Neu</div>
      </div>
      <div class="scb-item scb-learn">
        <div class="scb-val">${s.learning}</div>
        <div class="scb-label">Lernen</div>
      </div>
      <div class="scb-item scb-mastered">

      </div>
      <div class="scb-item scb-streak">

    </div>

}

function goalAndAccuracyHTML(){
  const goal = Stats.state.dailyGoal || 20;
  const prog = Stats.todayProgress();
  const pct  = Stats.todayGoalPct();
  // Kreis-Geometrie: r=32, Umfang ≈ 201
  const r = 32, c = 2 * Math.PI * r;
  const offset = c * (1 - pct);
  const trend = Stats.accuracyTrend();
  const accStr = trend.curPct === null ? 'noch keine Daten' : `${trend.curPct}%`;
  let trendStr = '';
  if(trend.curPct !== null && trend.prevPct !== null){
    if(trend.diff > 0)      trendStr = `<span class="trend-up">↗ +${trend.diff}%</span>`;
    else if(trend.diff < 0) trendStr = `<span class="trend-down">↘ ${trend.diff}%</span>`;
    else                    trendStr = `<span class="trend-flat">→ stabil</span>`;
  } else {
    trendStr = `<span class="trend-flat">noch keine Vergleichsbasis</span>`;
  }
  const streak = Stats.state.streak || 0;
  const longest = Stats.state.longestStreak || 0;
  return `
    <div class="goal-row">
      <div class="goal-ring-wrap">
        <svg width="78" height="78" viewBox="0 0 78 78">
          <circle class="goal-ring-bg" cx="39" cy="39" r="${r}"></circle>
          <circle class="goal-ring-fill" cx="39" cy="39" r="${r}"
            stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${offset.toFixed(1)}"></circle>
        </svg>
        <div class="goal-ring-text">
          <div class="goal-ring-num">${prog}</div>
          <div class="goal-ring-of">/ ${goal}</div>
        </div>
      </div>
      <div class="goal-meta">
        <div class="goal-meta-line"><span>Tagesziel</span><strong>${prog} / ${goal} <button class="goal-edit" onclick="editDailyGoal()">ändern</button></strong></div>
        <div class="goal-meta-line"><span>Accuracy (7 Tage)</span><strong>${accStr} ${trendStr}</strong></div>
        <div class="goal-meta-line"><span>Streak 🔥</span><strong>${streak} Tag${streak===1?'':'e'} <span style="color:var(--muted);font-weight:500">(Rekord ${longest})</span></strong></div>
      </div>
    </div>`;
}

function historyHTML(){
  const sessions = (Stats.state.sessions || []).slice(0, 5);
  const modeIcon = { quiz:'❓ Quiz', fill:'✏️ Lückentext', train:'🧠 Training', flash:'🃏 Karten' };
  if(!sessions.length){
    return `<div class="history-box">
      <div class="history-head">📊 Letzte Sessions</div>
      <div class="history-empty">Noch keine abgeschlossenen Runden. Leg los — Quiz oder Lückentext starten!</div>
    </div>`;
  }
  const fmtDate = (iso) => {
    const today = SRS.todayISO(), y = SRS.addDays(today,-1);
    if(iso === today) return 'heute';
    if(iso === y)     return 'gestern';
    const [yy,mm,dd] = iso.split('-');
    return `${dd}.${mm}.`;
  };
  const rows = sessions.map(s => {
    const lbl = modeIcon[s.mode] || s.mode;
    let scoreStr;
    const pct = s.total ? Math.round(100 * s.correct / s.total) : 0;
    scoreStr = `<span class="history-score">${s.correct}/${s.total}</span><span class="history-score-pct"> · ${pct}%</span>`;
    return `<div class="history-row">
      <span class="history-mode">${lbl}</span>
      <span class="history-date">${fmtDate(s.date)}</span>
      ${scoreStr}
      <span style="color:var(--muted);font-size:12px;">${s.durationMs ? Math.round(s.durationMs/1000)+'s' : ''}</span>
    </div>`;
  }).join('');
  return `<div class="history-box">
    <div class="history-head">📊 Letzte Sessions</div>
    ${rows}
  </div>`;
}

function editDailyGoal(){
  const cur = Stats.state.dailyGoal || 20;

function flipTrain(){
  trainFlipped = !trainFlipped;
  const fc = document.getElementById('trainFc');

  if(rate) rate.style.display = trainFlipped ? 'flex' : 'none';
}

function rateTrain(wasCorrect){
  if(!trainFlipped) return; // muss erst aufgedeckt werden
  const w = trainDeck[trainIdx];
  if(wasCorrect){ SRS.markCorrect(w.id); correct++; }
  else          { SRS.markWrong(w.id);   incorrect++; }
  Stats.recordAnswer(wasCorrect, 'train');
  updateStats();
  trainIdx++;
  trainFlipped = false;
  scrollToTop();
  render();
}

function resetSRS(){
  if(!confirm('Wirklich allen Lernfortschritt zurücksetzen? Diese Aktion lässt sich nicht rückgängig machen.')) return;
  SRS.resetAll();
  trainIdx = 0;
  trainFlipped = false;
  trainDeck = SRS.dueQueue(WORDS);
  render();
}
