  const enDE_f = learnDir === 'en-de';
  const flashFront = enDE_f
    ? `${imgFront}<div class="fc-word">${w.word}</div><div class="speak-row"><button class="speak-btn" onclick="speakWord('${w.word}')">🔊</button><span class="fc-pronunciation">${w.pronunciation}</span></div><div class="fc-badges"><span class="badge badge-type">${w.wordType}</span><span class="badge ${diffColor(w.difficulty)}">${w.difficulty}</span></div><div class="fc-front-example"><button class="speak-btn speak-sm" onclick="event.stopPropagation();speakText(this)" title="Satz vorlesen">🔊</button>📝 „<span class="ex-text">${w.examples[0]}</span>"</div><div class="fc-hint">Tippe, um umzudrehen ↕</div>`
    : `${imgFront}<div class="fc-word" style="font-size:20px;text-align:center;padding:0 12px">${w.translation}</div><div class="fc-badges" style="margin-top:10px"><span class="badge badge-type">${w.wordType}</span><span class="badge ${diffColor(w.difficulty)}">${w.difficulty}</span></div><div class="fc-front-example">📝 „${w.exampleDE || w.examples[0]}"</div><div class="fc-hint">Tippe, um umzudrehen ↕</div>`;
  const flashBack = enDE_f
    ? `<div class="back-section-label">📖 Definition</div><div class="back-def">${w.definition}</div><div class="back-section-label">📝 Beispiele</div>${examplesHTML}<div class="back-translation-small">🇩🇪 ${w.translation}</div>`
    : `<div class="fc-word" style="font-size:28px;margin-bottom:6px">${w.word}</div><div class="speak-row" style="margin-bottom:12px"><button class="speak-btn" onclick="speakWord('${w.word}')">🔊</button><span class="fc-pronunciation">${w.pronunciation}</span></div><div class="back-section-label">📖 Definition</div><div class="back-def">${w.definition}</div><div class="back-section-label">📝 Beispiele</div>${examplesHTML}`;
  app.innerHTML = `
    ${progressHTML(idx+1, deck.length)}
    <div class="dir-toggle-row">
      <button class="qdt-btn${enDE_f?' active':''}" onclick="setLearnDir('en-de')">🇬🇧 → 🇩🇪</button>
      <button class="qdt-btn${!enDE_f?' active':''}" onclick="setLearnDir('de-en')">🇩🇪 → 🇬🇧</button>
    </div>
    <div class="scene">
      <div class="flashcard" id="fc" onclick="flipCard()">
        <div class="face">${flashFront}</div>
        <div class="face face-back">${flashBack}</div>
      </div>
    </div>
    <div class="fc-actions" id="fcActions" style="display:none">
      <button class="btn btn-err" onclick="markCard(false)">✗ Nochmal</button>
      <button class="btn btn-ok" onclick="markCard(true)">✓ Gewusst!</button>
    </div>
    <div class="nav-row" id="navRow">
      <button class="btn btn-ghost btn-sm" onclick="prevCard()" ${idx===0?'disabled':''}>← Zurück</button>
      <span class="nav-pos">${idx+1} / ${deck.length}</span>
      <button class="btn btn-outline btn-sm" onclick="flipCard()">Umdrehen ↕</button>
    </div>`;
}

function flipCard(){
  flipped = !flipped;
  const fc = document.getElementById('fc');
  if(fc) fc.classList.toggle('flipped', flipped);
  const acts = document.getElementById('fcActions');
  if(acts) acts.style.display = flipped ? 'flex' : 'none';
}

function markCard(wasCorrect){
  const w = deck[idx];
  if(w){
    if(wasCorrect) SRS.markCorrect(w.id); else SRS.markWrong(w.id);
  }
  if(wasCorrect){ correct++; } else { incorrect++; }
  Stats.recordAnswer(wasCorrect, 'flash');
  updateStats();
  idx++;
  flipped = false;
  scrollToTop();
  render();
}

function prevCard(){
  if(idx > 0){ idx--; flipped = false; render(); }
}

/* ═══════════════════════════════════════════════
   ❓ QUIZ
   ═══════════════════════════════════════════════ */
function renderQuiz(){
  const app = document.getElementById('app');
  if(WORDS.length < 2){ app.innerHTML='<p>Mindestens 2 Wörter für den Quiz-Modus benötigt.</p>'; return; }
  if(idx >= deck.length){ renderRoundResult('quiz'); return; }

  const w = deck[idx];
  const enDE = learnDir === 'en-de';

  // Build choices: 1 correct + up to 3 wrong
  const wrong = shuffle(poolWords().filter(x=>x.id!==w.id)).slice(0,3);
  quizChoices = shuffle([w, ...wrong]);
  quizCorrectIdx = quizChoices.findIndex(c=>c.id===w.id);
  quizAnswered = false;

  // Richtungsabhängige Texte
  const questionWord   = enDE ? w.word        : w.translation;
  const questionSub    = enDE ? 'Was bedeutet dieses Wort?' : 'Wie lautet das englische Wort?';
  const choiceLabel    = (c) => enDE ? c.translation : c.word;

  const choicesHTML = quizChoices.map((c,i) =>
    `<button class="choice" id="ch${i}" onclick="answerQuiz(${i})">${choiceLabel(c)}</button>`
  ).join('');

  // Bild: immer zeigen (hilft beim Lernen in beiden Richtungen)
  const qImgSrc = getImg(w);
  const qImgHTML = qImgSrc
    ? `<div class="quiz-img-wrap"><img class="quiz-img-hd" src="${qImgSrc}" alt="${w.word}" referrerpolicy="no-referrer" loading="lazy" onerror="console.warn('Bild fehlgeschlagen:',this.src);this.parentElement.outerHTML='<div class=quiz-img-ph>${icon(w)}</div>'"></div>`
    : `<div class="quiz-img-ph">${icon(w)}</div>`;

  app.innerHTML = `
    ${progressHTML(idx+1, deck.length)}
    ${categoryChipsHTML()}
    <div class="quiz-dir-row">
      <button class="qdt-btn${enDE?' active':''}" onclick="setLearnDir('en-de')">🇬🇧 → 🇩🇪</button>
      <button class="qdt-btn${!enDE?' active':''}" onclick="setLearnDir('de-en')">🇩🇪 → 🇬🇧</button>
    </div>
    <div class="quiz-question" style="padding:0;overflow:hidden;margin-bottom:18px">
      ${qImgHTML}
      <div style="padding:14px 16px 12px;text-align:center;">
        <div class="quiz-sub">${questionSub}</div>
        <div class="quiz-word">${questionWord}</div>
        <div style="display:flex;gap:8px;justify-content:center;margin-top:8px">
          <span class="badge badge-type">${w.wordType}</span>
          <span class="badge ${diffColor(w.difficulty)}">${w.difficulty}</span>
        </div>
        <div class="quiz-speak-row"><button class="speak-btn" onclick="speakWord('${enDE?w.word:w.translation}')">🔊</button>${enDE ? `<span class="quiz-pron">${w.pronunciation}</span>` : ''}</div>
        <div class="quiz-example">${(()=>{
          const ex = w.examples[0];
          if(enDE){
            const blanked = ex.replace(new RegExp(w.word.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'), m=>`<span class="ex-blank">${'_'.repeat(m.length)}</span>`);
            return '📝 ' + blanked;
          } else {
            // DE→EN: deutschen Beispielsatz anzeigen, damit aktiv ins Englische übersetzt wird
            return '📝 ' + (w.exampleDE || ex);
          }
        })()}</div>
      </div>
    </div>
    <div class="quiz-choices">${choicesHTML}</div>
    <div id="quizFeedback"></div>
    <div class="nav-row">
      <button class="btn btn-ghost btn-sm" onclick="nextQuiz()" id="nextQuizBtn" style="display:none">Weiter →</button>
    </div>`;
  // Lazy-Load: Bild via Wikipedia-API nachladen wenn noch nicht im Cache
  if(!qImgSrc && wikiTitleFor(w.word)){
    fetchWikiImage(w.word).then(function(url){
      if(!url) return;
      var ph = document.querySelector('.quiz-img-ph');
      if(ph) ph.outerHTML = '<div class="quiz-img-wrap"><img class="quiz-img-hd" src="' + url + '" alt="img" referrerpolicy="no-referrer" loading="lazy" onerror="this.parentElement.style.display=\'none\'"></div>';
    });
  }
}

function setLearnDir(dir){
  if(quizAutoTimer){ clearTimeout(quizAutoTimer); quizAutoTimer = null; }
  learnDir = dir;
  try { localStorage.setItem('etLearnDir', dir); } catch(e) {}  // Richtung überlebt App-Neustart
  quizAnswered = false;
  flipped = false;
  trainFlipped = false;
  fillChecked = false;
  render();
}

function answerQuiz(chosen){
  if(quizAnswered) return;
  quizAnswered = true;
  const isOk = chosen === quizCorrectIdx;
  const w = deck[idx];
  if(w){
    if(isOk) SRS.markCorrect(w.id); else SRS.markWrong(w.id);
  }
  if(isOk){
    correct++; roundCorrect++; combo++;
    if(combo > bestComboInRound) bestComboInRound = combo;
  } else {
    incorrect++; combo = 0;
    if(w) roundWrongWords.push(w);
  }
  Stats.recordAnswer(isOk, 'quiz');
  if(combo >= 3) Stats.recordCombo(combo);
  updateStats();

  quizChoices.forEach((_,i)=>{
    const btn = document.getElementById(`ch${i}`);
    btn.disabled = true;
    if(i===quizCorrectIdx) btn.classList.add('correct');
    else if(i===chosen && !isOk) btn.classList.add('wrong');
  });

  if(quizAutoTimer){ clearTimeout(quizAutoTimer); quizAutoTimer = null; }

  const fb = document.getElementById('quizFeedback');
  fb.className = `quiz-feedback ${isOk?'ok':'err'}`;
  const comboBadge = (isOk && combo >= 3) ? ` <span class="combo-badge">🔥 ${combo} in Folge</span>` : '';

  if(isOk){
    fb.innerHTML = `🎉 Richtig!${comboBadge}<div class="auto-adv-bar"><div class="auto-adv-fill"></div></div>`;
    // Auto-advance nach 1.5s; Weiter-Button als Abbruch
    document.getElementById('nextQuizBtn').textContent = 'Jetzt weiter →';
    document.getElementById('nextQuizBtn').style.display = 'inline-flex';
    showMobileNext('Jetzt weiter →', nextQuiz);
    quizAutoTimer = setTimeout(()=>{ quizAutoTimer = null; nextQuiz(); }, 1500);
  } else {
    fb.innerHTML = `✗ Leider falsch. Richtig: „${deck[idx].translation}"`;
    document.getElementById('nextQuizBtn').textContent = 'Weiter →';
    document.getElementById('nextQuizBtn').style.display = 'inline-flex';
    showMobileNext('Weiter →', nextQuiz);
  }
}

function nextQuiz(){
  if(quizAutoTimer){ clearTimeout(quizAutoTimer); quizAutoTimer = null; }
  hideMobileNext();
  idx++;
  if(idx >= deck.length){
    renderRoundResult('quiz');
  } else {
    scrollToTop();
    render();
  }
}

/* ═══════════════════════════════════════════════
   ✏️ LÜCKENTEXT
   ═══════════════════════════════════════════════ */
function renderFill(){
  const app = document.getElementById('app');
  if(!deck.length){ app.innerHTML='<p>Keine Wörter vorhanden.</p>'; return; }
  if(idx >= deck.length){ renderRoundResult('fill'); return; }

  const w = deck[idx];
  const enDE_fill = learnDir === 'en-de';
  let fillCardHTML;
  if(enDE_fill){
    const ex = w.examples[Math.floor(Math.random()*w.examples.length)];
    const blanked = ex.replace(new RegExp(w.word,'gi'),'<span class="blank">_____</span>');
    fillCardHTML = `<div class="fill-label">🇩🇪 Übersetzung: <strong>${w.translation}</strong> &nbsp;|&nbsp; ${w.wordType} &nbsp;<span class="badge ${diffColor(w.difficulty)}">${w.difficulty}</span></div><div style="display:flex;align-items:center;gap:8px;margin-bottom:10px"><button class="speak-btn" onclick="speakWord('${w.word}')">🔊</button><span style="font-size:13px;color:var(--muted)">${w.pronunciation}</span></div><div class="fill-label">Ergänze den Satz:</div><div class="fill-sentence">${blanked}</div>`;
  } else {
    fillCardHTML = `<div class="fill-label">🇬🇧 Englisch: <strong>${w.word}</strong> &nbsp;|&nbsp; ${w.wordType} &nbsp;<span class="badge ${diffColor(w.difficulty)}">${w.difficulty}</span></div><div style="display:flex;align-items:center;gap:8px;margin-bottom:10px"><button class="speak-btn" onclick="speakWord('${w.word}')">🔊</button><span style="font-size:13px;color:var(--muted)">${w.pronunciation}</span></div><div class="fill-label">Was ist die deutsche Übersetzung?</div><div class="fill-sentence" style="font-size:15px;color:var(--muted)">📝 „${w.examples[0]}"</div>`;
  }
  fillChecked = false;
  app.innerHTML = `
    ${progressHTML(idx+1, deck.length)}
    <div class="dir-toggle-row">
      <button class="qdt-btn${enDE_fill?' active':''}" onclick="setLearnDir('en-de')">🇬🇧 → 🇩🇪</button>
      <button class="qdt-btn${!enDE_fill?' active':''}" onclick="setLearnDir('de-en')">🇩🇪 → 🇬🇧</button>
    </div>
    <div class="fill-card">
      ${fillCardHTML}
      <div class="fill-input-row" style="margin-top:14px">
        <input class="fill-input" id="fillInput" type="text" placeholder="${enDE_fill?'Englisches Wort…':'Deutsche Übersetzung…'}"
          onkeydown="if(event.key==='Enter')checkFill()"
          oninput="onFillInput(this)"
          autocomplete="off" autocorrect="off" spellcheck="false">
        <button class="btn btn-primary" onclick="checkFill()">Prüfen</button>
      </div>
      <div id="fillResult"></div>
    </div>
    <div class="nav-row">
      <button class="btn btn-ghost btn-sm" onclick="skipFill()" id="skipBtn">Überspringen →</button>
    </div>`;
  setTimeout(()=>{ const i=document.getElementById('fillInput'); if(i){ i.focus(); i.scrollIntoView({behavior:'smooth',block:'center'}); } },150);
}

function skipFill(){
  // beim Überspringen wird die Antwort als „nicht beantwortet" gezählt
  const w = deck[idx];
  if(w && !fillChecked){
    incorrect++;
    combo = 0;
    roundWrongWords.push(w);
    Stats.recordAnswer(false, 'fill');
    updateStats();
  }
  hideMobileNext();
  idx++;
  if(idx >= deck.length) renderRoundResult('fill');
  else { scrollToTop(); render(); }
}

function onFillInput(input){
  if(fillChecked) return;
  const w = deck[idx];
  const val = input.value.trim().toLowerCase();
  const liveOk = learnDir==='en-de' ? (val&&val===w.word.toLowerCase()) : (()=>{const ts=w.translation.split(',').map(t=>t.trim().toLowerCase());return val&&(ts.some(t=>val===t)||val===w.translation.toLowerCase());})();
  if(liveOk){input.classList.add('live-ok');}else{input.classList.remove('live-ok');}
}

function checkFill(){
  if(fillChecked) return;
  fillChecked = true;
  const input = document.getElementById('fillInput');
  const answer = input.value.trim();
  const w = deck[idx];
  input.classList.remove('live-ok');
  const enDE_chk = learnDir === 'en-de';
  let isOk;
  if(enDE_chk){ isOk = answer.toLowerCase() === w.word.toLowerCase(); }
  else { const ts=w.translation.split(',').map(t=>t.trim().toLowerCase()); isOk=ts.some(t=>answer.toLowerCase()===t)||answer.toLowerCase()===w.translation.toLowerCase(); }

  if(w){
    if(isOk) SRS.markCorrect(w.id); else SRS.markWrong(w.id);
  }
  if(isOk){
    correct++; roundCorrect++; combo++;
    if(combo > bestComboInRound) bestComboInRound = combo;
  } else {
    incorrect++; combo = 0;
    if(w) roundWrongWords.push(w);
  }
  Stats.recordAnswer(isOk, 'fill');
  if(combo >= 3) Stats.recordCombo(combo);
  updateStats();

  input.classList.add(isOk?'ok':'err');
  input.disabled = true;

  const res = document.getElementById('fillResult');
  const fullEx = w.examples[0];
  const comboBadge = (isOk && combo >= 3) ? ` <span class="combo-badge">🔥 ${combo} in Folge</span>` : '';
  res.className = `fill-result ${isOk?'ok':'err'}`;
  res.innerHTML = isOk
    ? `✓ Richtig!${comboBadge} <em>${fullEx}</em>`
    : `✗ Nicht ganz. Das richtige Wort ist: <strong>${w.word}</strong><br><em>${fullEx}</em>`;

  const skip = document.getElementById('skipBtn');
  if(skip){
    skip.textContent = 'Weiter →';
    skip.onclick = ()=>{
      hideMobileNext();
      idx++;
      if(idx >= deck.length) renderRoundResult('fill');
      else { scrollToTop(); render(); }
    };
  }
  showMobileNext('Weiter →', ()=>{
    idx++;
    if(idx >= deck.length) renderRoundResult('fill');
    else { scrollToTop(); render(); }
  });
}

/* ═══════════════════════════════════════════════
   📋 WORTLISTE
   ═══════════════════════════════════════════════ */
function renderList(){
  const app = document.getElementById('app');
  const types = ['Alle', ...new Set(WORDS.map(w=>w.wordType))];
  const cats  = ['Alle', ...CATEGORIES, '—'];

  const q = listSearch.trim().toLowerCase();
  const filtered = WORDS.filter(w => {
    if(listFilterType!=='Alle' && w.wordType!==listFilterType) return false;
    if(listFilterCat!=='Alle'  && w.category!==listFilterCat)  return false;
    if(!q) return true;
    const hay = [w.word, w.translation, w.definition, ...(w.examples||[])].join(' ').toLowerCase();
    return hay.includes(q);
  });

  const typeFilters = types.map(t=>
    `<button class="filter-btn ${listFilterType===t?'active':''}" onclick="setFilterType('${t}')">${t}</button>`
  ).join('');

  const catFilters = cats.map(c=>{
    const cls = c!=='Alle' && c!=='—' ? `badge ${catBadgeClass(c)}` : '';
    return `<button class="filter-btn ${listFilterCat===c?'active':''}" onclick="setFilterCat('${c}')">
      ${cls ? `<span class="${cls}" style="margin-right:4px">${c}</span>` : c}
    </button>`;
  }).join('');

  const esc = (s) => String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

  const cardsHTML = filtered.length ? filtered.map(w => {
    const exHTML = w.examples.map(e=>`<div class="wc-ex">📝 ${esc(e)}</div>`).join('');
    const src = getImg(w);
    const thumb = src
      ? `<img class="wc-thumb" src="${src}" alt="${esc(w.word)}" referrerpolicy="no-referrer" loading="lazy" onerror="this.onerror=null;this.outerHTML='<div class=&quot;wc-thumb-fallback&quot;>${icon(w)}</div>'">`
      : `<div class="wc-thumb-fallback">${icon(w)}</div>`;
    const detailImg = src
      ? `<img class="wc-detail-img" src="${src}" alt="${esc(w.word)}" referrerpolicy="no-referrer" loading="lazy" onerror="this.style.display='none'">`
      : '';
    const catBadge = `<span class="badge ${catBadgeClass(w.category)}">${w.category}</span>`;
    const sEntry = SRS.state[w.id];
    const lvl = sEntry ? (sEntry.level||0) : 0;
    const isDue = SRS.isDue(w.id);
    const lvlBadge = `<span class="level-badge lvl-${lvl}" title="Lernstufe ${lvl}/7 – ${SRS.LABELS[lvl]}">L${lvl}</span>`;
    const duePill = isDue ? `<span class="due-pill" title="Heute zur Wiederholung fällig">Fällig</span>` : '';
    return `
    <div class="word-card ${listOpen[w.id]?'open':''}" onclick="toggleCard(event,${w.id})">
      <div class="wc-top">
        ${thumb}
        <div class="wc-body">
          <div class="wc-title-row">
            <span class="wc-word">${esc(w.word)}</span>
            <span class="wc-pron">${esc(w.pronunciation)}</span>
            ${duePill}
          </div>
          <div class="wc-translation">${esc(w.translation)}</div>
        </div>
        <div class="wc-meta">
          ${lvlBadge}
          ${catBadge}
          <span class="badge ${diffColor(w.difficulty)}">${w.difficulty}</span>
          <span class="wc-chev">▾</span>
        </div>
      </div>
      <div class="wc-detail ${listOpen[w.id]?'open':''}" id="detail${w.id}">
        ${detailImg}
        <p><strong>📖 Definition:</strong> ${esc(w.definition)}</p>
        ${exHTML}
        <p style="font-size:11px;color:var(--muted);margin-top:6px">${esc(w.wordType)} · Hinzugefügt: ${esc(w.dateAdded)}</p>
      </div>
    </div>`;
  }).join('') : `<div style="text-align:center;padding:40px;color:var(--muted)">Keine Wörter gefunden.</div>`;

  app.innerHTML = `
    <div class="list-header">
      <h2>📋 Wortliste <span style="color:var(--muted);font-weight:500">(${filtered.length} / ${WORDS.length})</span></h2>
    </div>
    <div class="search-bar ${listSearch?'has-value':''}">
      <input id="listSearchInput" type="text" placeholder="Suche in Wort, Übersetzung, Definition, Beispiel…" value="${esc(listSearch)}" oninput="onSearchInput(this.value)" autocomplete="off" spellcheck="false">
      <button class="search-clear" onclick="clearSearch(event)" aria-label="Suche leeren">✕</button>
    </div>
    <div class="filter-group-label">Wortart</div>
    <div class="list-filters">${typeFilters}</div>
    <div class="filter-group-label">Kategorie</div>
    <div class="list-filters">${catFilters}</div>
    <div class="word-grid">${cardsHTML}</div>`;

  // Restore focus + caret to the search input after re-render
  if(document.activeElement && document.activeElement.id !== 'listSearchInput'){
    const si = document.getElementById('listSearchInput');
    if(si && listSearch){ si.focus(); si.setSelectionRange(listSearch.length, listSearch.length); }
  }
}

function setFilterType(f){ listFilterType=f; renderList(); }
function setFilterCat(f){  listFilterCat=f;  renderList(); }
function toggleCard(evt, id){
  // Ignore clicks that originate inside the search input or its clear button
  const t = evt && evt.target;
  if(t && (t.tagName==='INPUT' || (t.closest && t.closest('.search-bar')))) return;
  listOpen[id]=!listOpen[id]; renderList();
}
function onSearchInput(v){
  listSearch = v;
  renderList();
}
function clearSearch(e){
  if(e){ e.stopPropagation(); }
  listSearch = '';
  renderList();
  const si = document.getElementById('listSearchInput');
  if(si) si.focus();
}

/* ═══════════════════════════════════════════════
   🏁 10er-RUNDEN-AUSWERTUNG (Quiz / Lückentext)
   ═══════════════════════════════════════════════ */
function renderRoundResult(mode){
  hideMobileNext();
  scrollToTop();
  const app = document.getElementById('app');
  const total = deck.length || ROUND_SIZE;
  const ok = roundCorrect;
  const wrong = total - ok;
  const pct = total ? Math.round((ok/total)*100) : 0;
  const isPerfect = ok === total && total > 0;
  const durationMs = roundStartTs ? (Date.now() - roundStartTs) : 0;
  const durSec = Math.round(durationMs / 1000);

  // Bonus für perfekte Runde
  let bonusXP = 0;
  if(isPerfect){
    Stats.recordPerfectRound();
    bonusXP = 50;
  }

  // Session in History speichern
  Stats.recordSession({ mode, total, correct: ok, durationMs });
  updateStats();

  let msg, emoji;
  if(isPerfect){ emoji = '🌟'; msg = 'Perfekte Runde! 10 von 10. +50 XP Bonus!'; }
  else if(pct >= 80){ emoji = '🏆'; msg = 'Sehr stark!'; }
  else if(pct >= 50){ emoji = '💪'; msg = 'Solide Runde – weiter so.'; }
  else { emoji = '📚'; msg = 'Übung macht den Meister.'; }

  const wrongList = roundWrongWords.length
    ? `<div class="round-wrong-list">
        <div class="round-wrong-head">📝 Diese Wörter haben gehakt:</div>
        ${roundWrongWords.map(w =>
          `<div class="round-wrong-item">
             <strong>${w.word}</strong>
             <span class="muted">— ${w.translation}</span>
           </div>`).join('')}
       </div>`
    : '';

  app.innerHTML = `
    <div class="round-result">
      <div class="round-emoji">${emoji}</div>
      <h2 class="round-title">Runde abgeschlossen!</h2>
      <p class="round-msg">${msg}</p>
      <div class="round-score-circle">
        <div class="round-score-num">${ok}<span class="round-score-of">/${total}</span></div>
        <div class="round-score-pct">${pct} %</div>
      </div>
      <div class="round-mini-stats">
        <div class="rm"><div class="rm-num">${ok}</div><div class="rm-lbl">Richtig</div></div>
        <div class="rm rm-err"><div class="rm-num">${wrong}</div><div class="rm-lbl">Falsch</div></div>
        <div class="rm"><div class="rm-num">🔥 ${bestComboInRound}</div><div class="rm-lbl">Combo</div></div>
        <div class="rm"><div class="rm-num">${durSec}s</div><div class="rm-lbl">Dauer</div></div>
        ${bonusXP ? `<div class="rm rm-bonus"><div class="rm-num">+${bonusXP} XP</div><div class="rm-lbl">Bonus</div></div>` : ''}
      </div>
      ${wrongList}
    </div>`;
  // Weiter-Button: auf Mobile sticky, auf Desktop sichtbar als normaler Button
  showMobileNext('🔄 Weiter mit 10 neuen', () => nextRound('${mode}'));
  // Auf Desktop: zusätzlich inline-Button unter dem Result
  if(window.innerWidth > 540){
    const acts = document.createElement('div');
    acts.style.cssText = 'display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:18px;';
    acts.innerHTML = `<button class="btn btn-primary" onclick="nextRound('${mode}')">🔄 Weiter mit 10 neuen</button>
      <button class="btn btn-outline" onclick="setMode('train',document.querySelectorAll('.nav-tabs .tab')[0])">🧠 Training</button>`;
    document.querySelector('.round-result').appendChild(acts);
  }
}

function nextRound(m){
  idx = 0;
  quizAnswered = false;
  fillChecked = false;
  deck = buildRoundDeck();
  resetRound();
  render();
}

/* ═══════════════════════════════════════════════
   🏆 ZUSAMMENFASSUNG (alt — Karteikarten-Modus)
   ═══════════════════════════════════════════════ */
function renderSummary(){
  const app = document.getElementById('app');
  const total = correct + incorrect;
  const pct = total ? Math.round((correct/total)*100) : 0;
  let emoji = pct>=80?'🏆':pct>=50?'💪':'📚';
  let msg = pct>=80?'Ausgezeichnet! Du kennst deine Vörter sehr gut!'
           :pct>=50?'Gut gemacht! Übe weiter und du wirst es bald perfekt beherrschen.'
           :'Kein Problem – Übung macht den Meister!';

  app.innerHTML = `
    <div class="summary-card">
      <div class="summary-emoji">${emoji}</div>
      <h2>Runde beendet!</h2>
      <p>${msg}</p>
      <div class="summary-stats">
        <div class="ss ss-ok"><div class="ss-num">${correct}</div><div class="ss-label">Richtig</div></div>
        <div class="ss ss-err"><div class="ss-num">${incorrect}</div><div class="ss-label">Falsch</div></div>
      </div>
      <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
        <button class="btn btn-primary" onclick="restartMode()">🔄 Nochmal trainieren</button>
        <button class="btn btn-outline" onclick="setMode('list',null);document.querySelectorAll('.nav-tabs .tab')[3].classList.add('active');document.querySelectorAll('.nav-tabs .tab').forEach((t,i)=>{if(i!==3)t.classList.remove('active')})">📋 Wortliste ansehen</button>
      </div>
    </div>`;
}

function restartMode(){
  correct = 0; incorrect = 0;
  updateStats();
  idx = 0; flipped = false; quizAnswered = false; fillChecked = false;
  deck = shuffle(WORDS);
  render();
}

/* ═══════════════════════════════════════════════
   🌙 THEME (Hell / Dunkel)
   ═══════════════════════════════════════════════ */
function applyTheme(mode){
  if(mode === 'dark'){ document.body.classList.add('dark'); }
  else { document.body.classList.remove('dark'); }
  const btn = document.getElementById('themeToggle');
  if(btn) btn.textContent = mode === 'dark' ? '☀️' : '🌙';
  const tc = document.querySelector('meta[name="theme-color"]');
  if(tc) tc.setAttribute('content', mode === 'dark' ? '#0B0F17' : '#ffffff');
}
function toggleTheme(){
  const now = document.body.classList.contains('dark') ? 'light' : 'dark';
  try { localStorage.setItem('etTheme', now); } catch(e) {}
  applyTheme(now);
}
(function initTheme(){
  let saved = 'dark';
  try { saved = localStorage.getItem('etTheme') || 'dark'; } catch(e) {}
  applyTheme(saved);
})();

/* ═══════════════════════════════════════════════
   Start
   ═══════════════════════════════════════════════ */
const _wcLabel = document.getElementById('wordCountLabel');
if(_wcLabel) _wcLabel.textContent = `${WORDS.length} Wörter gespeichert`;
deck = shuffle(WORDS);
trainDeck = SRS.dueQueue(WORDS);
try { render(); } catch(e){ console.error('render() failed:', e); document.getElementById('app').innerHTML = '<p style="padding:20px;color:#dc2626">Fehler beim Laden: ' + (e && e.message || e) + ' — bitte Konsole (F12) prüfen.</p>'; }
try { prefetchImages(); } catch(e){ console.warn('prefetchImages failed:', e); }
try { Sync.init(); } catch(e){ console.warn('Sync.init failed:', e); }
</script>

<script>
// Service Worker registrieren (PWA / Offline-Support)
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){
    // Bei einem Update (neuer SW übernimmt) genau einmal neu laden,
    // damit neue Wörter/Änderungen sofort erscheinen – aber NICHT beim Erstbesuch.
    if (navigator.serviceWorker.controller) {
      var __etaReloaded = false;
      navigator.serviceWorker.addEventListener('controllerchange', function(){
        if (__etaReloaded) return; __etaReloaded = true;
        window.location.reload();
      });
    }
    navigator.serviceWorker.register('./sw.js')
      .then(function(reg){
        console.log('SW registriert:', reg.scope);
        reg.update();
      })
      .catch(function(err){ console.warn('SW Fehler:', err); });
  });
}
</script>

.eta-ring-text { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.eta-ring-num { font-size: 28px; font-weight: 700; color: var(--text); letter-spacing: -0.8px; line-height: 1; }
.eta-ring-of { font-size: 10.5px; color: var(--muted); margin-top: 3px; }
.eta-today-meta { flex: 1; min-width: 0; }
.eta-today-pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: rgba(94,227,214,0.13); color: var(--primary-soft); font-size: 10.5px; font-weight: 600; letter-spacing: 0.4px; text-transform: uppercase; margin-bottom: 8px; }
.eta-today-pill::before { content: ''; width: 5px; height: 5px; border-radius: 3px; background: var(--primary-soft); }
.eta-today-headline { font-size: 17px; color: var(--text); font-weight: 700; letter-spacing: -0.3px; line-height: 1.25; margin-bottom: 10px; }
.eta-today-stats { display: flex; gap: 12px; font-size: 11.5px; color: var(--muted); align-items: center; }
.eta-today-stats strong { color: var(--text); font-weight: 700; font-size: 13px; margin-right: 2px; }
.eta-today-stats .sep { width: 1px; height: 14px; background: var(--border); }
.eta-cta-btn { display: flex; align-items: center; justify-content: space-between; background: linear-gradient(135deg, var(--primary2), var(--primary)); color: #fff; border: none; border-radius: 14px; padding: 15px 18px; width: 100%; cursor: pointer; font-family: inherit; font-weight: 600; font-size: 14.5px; box-shadow: 0 8px 22px rgba(89,101,240,0.4); transition: filter .15s, transform .1s; }
.eta-cta-btn:hover { filter: brightness(1.05); }
.eta-cta-btn:active { transform: translateY(1px); }
.eta-cta-btn .eta-cta-text { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; }
.eta-cta-btn .eta-cta-sub { font-size: 12.5px; opacity: 0.85; font-weight: 500; }
.eta-cta-btn .eta-cta-arrow { width: 36px; height: 36px; border-radius: 999px; background: rgba(255,255,255,0.18); display: flex; align-items: center; justify-content: center; }
.eta-stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.eta-stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 14px 14px 12px; }
.eta-stat-head { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; font-size: 10.5px; color: var(--muted); font-weight: 600; letter-spacing: 0.4px; text-transform: uppercase; }
.eta-stat-num { display: flex; align-items: baseline; gap: 4px; }
.eta-stat-num .v { font-size: 22px; font-weight: 700; color: var(--text); letter-spacing: -0.5px; }
.eta-stat-num .u { font-size: 12px; color: var(--muted); }
.eta-week-dots { display: flex; gap: 3px; margin-top: 8px; }
.eta-week-dots > div { flex: 1; height: 4px; border-radius: 2px; background: var(--card-hover); }
.eta-week-dots > div.done { background: var(--primary); }
.eta-week-dots > div.today { background: var(--primary-soft); }
.eta-modes { background: var(--card); border: 1px solid var(--border); border-radius: 18px; overflow: hidden; }
.eta-mode-row { display: flex; align-items: center; gap: 12px; padding: 13px 16px; cursor: pointer; border-top: 1px solid var(--border); transition: background .15s; }
.eta-mode-row:first-child { border-top: none; }
.eta-mode-row:hover { background: var(--card-hover); }
.eta-mode-ico { width: 34px; height: 34px; border-radius: 10px; background: var(--card-hover); color: var(--primary); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.eta-mode-body { flex: 1; }
.eta-mode-name { font-size: 14px; font-weight: 600; color: var(--text); letter-spacing: -0.2px; }
.eta-mode-sub { font-size: 11.5px; color: var(--muted); margin-top: 1px; }

/* Modal polish */
.modal { background: var(--card) !important; border: 1px solid var(--border) !important; }
.modal-overlay { background: rgba(0,0,0,0.65) !important; backdrop-filter: blur(6px); }
.modal .input { background: var(--bg) !important; border-color: var(--border) !important; color: var(--text) !important; }
.modal .hint { background: var(--card-hover) !important; border-left-color: var(--primary) !important; color: var(--text-soft) !important; }
.modal-actions .btn-primary { background: linear-gradient(135deg, var(--primary2), var(--primary)) !important; }
</style>

<script id="eta-v2-script">
(function(){
  // ── 1. Theme: gesteuert über initTheme/toggleTheme (etTheme) ──
  //    Dark bleibt Default; der Theme-Button schaltet jetzt wirklich Hell/Dunkel um.

  // ── 2. SVG-Icons ──────────────────────────────────────
  var ICON = {
    today:   '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
    train:   '<path d="M9.5 3a3 3 0 0 0-3 3v.5A3 3 0 0 0 4 9.5v1a3 3 0 0 0 1 5.7V18a3 3 0 0 0 5.5 1.7M14.5 3a3 3 0 0 1 3 3v.5A3 3 0 0 1 20 9.5v1a3 3 0 0 1-1 5.7V18a3 3 0 0 1-5.5 1.7M12 4v17"/>',
    flash:   '<path d="M12 3 2 8l10 5 10-5-10-5ZM2 16l10 5 10-5M2 12l10 5 10-5"/>',
    quiz:    '<path d="M12 22c5.5 0 10-4.5 10-10S17.5 2 12 2 2 6.5 2 12s4.5 10 10 10ZM9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3M12 17h.01"/>',
    fill:    '<path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7M18.5 2.5a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5Z"/>',
    list:    '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
    search:  '<circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/>',
    flame:   '<path d="M8.5 14.5A2.5 2.5 0 0 0 11 17c1.4 0 2.6-1 2.9-2.4.4-2-1.4-3.6-1.4-3.6S15 12 15 9.5c0-3-3-5.5-3-5.5s.5 4-3 6c-1.7 1-2.5 2.8-2.5 4.5Z"/>',
    moon:    '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/>',
    sun:     '<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/>',
    play:    '<path d="M5 3v18l15-9L5 3Z" fill="currentColor"/>',
    cloud:   '<path d="M18 10h-1.3A7 7 0 1 0 5 16.7"/><path d="M21 14a3 3 0 0 0-3-3h-3.5A5 5 0 1 0 8 17h10a3 3 0 0 0 3-3Z"/>',
    chevronRight: '<path d="M9 18l6-6-6-6"/>',
    layers:  '<path d="M12 3 2 8l10 5 10-5-10-5ZM2 16l10 5 10-5M2 12l10 5 10-5"/>',
    check:   '<path d="M20 6 9 17l-5-5"/>',
    x:       '<path d="M18 6 6 18M6 6l12 12"/>',
    trending:'<path d="M23 6 13.5 15.5l-5-5L1 18M17 6h6v6"/>',
    settings:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>',
    info:    '<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>',
  };
  function svg(name, size, w) {
    return '<svg width="'+(size||20)+'" height="'+(size||20)+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+(w||1.8)+'" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0">'+(ICON[name]||'')+'</svg>';
  }
  window.__etaSvg = svg;

  // ── 3. Sync-Modal rekonstruieren ─────────────────────
  function rebuildSyncModal() {
    var modal = document.getElementById('syncModal');
    if (!modal) return;
    modal.innerHTML = ''
      + '<div class="modal" role="dialog" aria-labelledby="syncModalTitle">'
      + '  <h2 id="syncModalTitle" style="display:flex;align-items:center;gap:8px">'
      +    svg('cloud', 18) + ' Geräte-Synchronisation</h2>'
      + '  <p class="modal-sub">Synchronisiere deinen Lernfortschritt zwischen Handy und Laptop über einen privaten GitHub-Gist. Einmal pro Gerät einrichten.</p>'
      + '  <div class="hint" id="syncModalHint">Erstelle einen GitHub Personal Access Token mit <code>gist</code>-Berechtigung.</div>'
      + '  <label for="syncTokenInput">GitHub Personal Access Token</label>'
      + '  <input id="syncTokenInput" class="input mono" type="password" autocomplete="off" spellcheck="false" placeholder="ghp_..." />'
      + '  <label for="syncGistInput">Gist-ID <span style="color:var(--muted);font-weight:400">(nur auf dem 2. Gerät nötig)</span></label>'
      + '  <div style="display:flex;gap:6px">'
      + '    <input id="syncGistInput" class="input mono" type="text" autocomplete="off" spellcheck="false" placeholder="z.B. 7a1b8c..." style="flex:1;margin-bottom:0" />'
      + '    <button type="button" class="btn btn-ghost" onclick="copyGistIdToClipboard()" title="Gist-ID kopieren" style="padding:8px 12px">📋</button>'
      + '  </div>'
      + '  <div id="syncModalMsg" class="modal-msg"></div>'
      + '  <div class="modal-actions">'
      + '    <button type="button" class="btn btn-ghost" onclick="closeSyncModal()">Abbrechen</button>'
      + '    <button type="button" class="btn btn-primary" onclick="saveSyncSettings()">Speichern & verbinden</button>'
      + '  </div>'
      + '</div>';
  }
  rebuildSyncModal();

  // ── 4. Sync-Row-Sichtbarkeit ─────────────────────────
  function updateSyncClass() {
    try {
      var on = typeof Sync !== 'undefined' && Sync.isConfigured && Sync.isConfigured();
      document.body.classList.toggle('eta-sync-on', !!on);
    } catch(e) {}
  }
  updateSyncClass();

  // ── 5. Tab-Icons + Heute-Tab ─────────────────────────
  var TAB_ICONS = ['today','train','flash','quiz','fill','list'];
  var TAB_MODES = ['today','train','flash','quiz','fill','list'];
  var navTabs = document.querySelector('.nav-tabs');

  if (navTabs) {
    var existing = navTabs.querySelectorAll('.tab');
    var modeOrder = ['train','flash','quiz','fill','list'];
    existing.forEach(function(btn, i){
      btn.dataset.mode = modeOrder[i] || 'train';
      var firstNode = btn.firstChild;
      while (firstNode && firstNode.nodeType === 3 && !firstNode.textContent.trim()) { firstNode = firstNode.nextSibling; }
      if (firstNode && firstNode.nodeType === 3) {
        var em = document.createElement('span'); em.className = 'eta-tab-emoji'; em.textContent = firstNode.textContent;
        btn.replaceChild(em, firstNode);
      }
      var iconWrap = document.createElement('span'); iconWrap.className = 'eta-tab-icon';
      iconWrap.innerHTML = svg(TAB_ICONS[i+1] || 'train', 22);
      btn.insertBefore(iconWrap, btn.firstChild);
    });

    // Heute-Tab einfügen
    var todayBtn = document.createElement('button');
    todayBtn.className = 'tab'; todayBtn.dataset.mode = 'today';
    todayBtn.onclick = function(){ setMode('today', todayBtn); };
    todayBtn.innerHTML = '<span class="eta-tab-icon">' + svg('today', 22) + '</span><span class="tab-label">Heute</span>';
    navTabs.insertBefore(todayBtn, navTabs.firstChild);

    // setMode überschreiben
    var origSetMode = window.setMode;
    window.setMode = function(m, btn) {
      window.mode = m;
      window.idx = 0; window.flipped = false; window.quizAnswered = false; window.fillChecked = false;
      navTabs.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('active'); });
      var match = [...navTabs.querySelectorAll('.tab')].find(function(t){ return t.dataset.mode === m; });
      if (match) match.classList.add('active');
      if (m === 'today') { try { window.scrollTo(0,0); } catch(e){} renderToday(); return; }
      if (typeof origSetMode === 'function') return origSetMode(m, btn || match);
      try { render(); } catch(e){}
    };

    // render() überschreiben — damit prefetchImages()/Sync den Heute-Screen NICHT überschreiben
    var origRender = window.render;
    window.render = function() {
      if (window.mode === 'today') { renderToday(); return; }
      if (typeof origRender === 'function') return origRender.apply(this, arguments);
    };
  }

  // ── 6. HEUTE-Screen ─────────────────────────────────
  function getStats() {
    var stats = (typeof SRS !== 'undefined' && SRS.stats && typeof WORDS !== 'undefined') ? SRS.stats(WORDS) : { due:0, fresh:0, learning:0, mastered:0 };
    var goal = (typeof Stats !== 'undefined' && Stats.state) ? (Stats.state.dailyGoal || 20) : 20;
    var doneToday = 0;
    try { var today = SRS.todayISO(); var hist = Stats.state.history || []; doneToday = hist.filter(function(s){ return s.date === today; }).reduce(function(a,s){ return a+(s.correct||0); }, 0); } catch(e) {}
    var streak = (typeof Stats !== 'undefined' && Stats.state && Stats.state.streak) || 0;
    return { due: stats.due||0, newW: stats.fresh||stats.new||0, learn: stats.learning||0, mast: stats.mastered||0, goal: goal, doneToday: doneToday, streak: streak };
  }
  function getGreeting(){ var h=new Date().getHours(); if(h<5)return'Gute Nacht'; if(h<11)return'Guten Morgen'; if(h<17)return'Hallo'; return'Guten Abend'; }
  function todayDE(){ var d=new Date(); var days=['So','Mo','Di','Mi','Do','Fr','Sa']; var months=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez']; return days[d.getDay()]+', '+d.getDate()+'. '+months[d.getMonth()]; }
  function weekActivity(){ var out=[]; try{ var hist=Stats.state.history||[]; var byDate={}; hist.forEach(function(s){ byDate[s.date]=(byDate[s.date]||0)+(s.correct||0); }); var today=new Date(); for(var i=6;i>=0;i--){ var dd=new Date(today); dd.setDate(today.getDate()-i); var iso=dd.toISOString().slice(0,10); out.push({done:(byDate[iso]||0)>0,today:i===0}); } } catch(e){ for(var j=0;j<7;j++) out.push({done:false,today:j===6}); } return out; }
  function makeRing(done, goal){ var size=110,stroke=9,r=(size-stroke)/2,c=2*Math.PI*r,pct=goal>0?Math.min(1,done/goal):0,dash=c*(1-pct); return '<div class="eta-ring-wrap"><svg width="'+size+'" height="'+size+'"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#7C8CFF"/><stop offset="100%" stop-color="#5EE3D6"/></linearGradient></defs><circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="#1B2233" stroke-width="'+stroke+'"/><circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="url(#rg)" stroke-width="'+stroke+'" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+dash+'"/></svg><div class="eta-ring-text"><div class="eta-ring-num">'+done+'</div><div class="eta-ring-of">von '+goal+' heute</div></div></div>'; }

  function renderToday() {
    var app = document.getElementById('app'); if (!app) return;
    var s = getStats();
    var week = weekActivity();
    var ctaText = s.due>0?'Training fortsetzen':s.newW>0?'Neue Wörter starten':'Freies Üben';
    var ctaSub = s.due>0?(s.due+' fällige Wiederholungen'):s.newW>0?(s.newW+' neue Wörter'):'Karteikarten-Modus';
    var ctaAction = (s.due>0||s.newW>0)?'train':'flash';
    app.innerHTML = '<div class="eta-today">'
      + '<div class="eta-today-hero">'
      + '  <div class="eta-today-greet">'+todayDE()+'</div>'
      + '  <div class="eta-today-name">'+getGreeting()+'</div>'
      + '  <div class="eta-today-row">'+makeRing(s.doneToday,s.goal)
      + '    <div class="eta-today-meta">'
      + '      <div class="eta-today-pill">'+((s.due+s.newW)>0?'Bereit zum Lernen':'Tagesziel erreicht')+'</div>'
      + '      <div class="eta-today-headline">'+((s.due+s.newW)>0?(s.due+s.newW)+' Wörter warten':'Alle Wörter gelernt 🎉')+'</div>'
      + '      <div class="eta-today-stats"><div><strong>'+s.due+'</strong> fällig</div><span class="sep"></span><div><strong>'+s.newW+'</strong> neu</div><span class="sep"></span><div><strong>'+s.mast+'</strong> gem.</div></div>'
      + '    </div>'
      + '  </div>'
      + '  <button class="eta-cta-btn" onclick="setMode(\''+ctaAction+'\')">'
      + '    <span class="eta-cta-text"><span class="eta-cta-sub">Weiter mit</span><span>'+ctaText+'</span></span>'
      + '    <span class="eta-cta-arrow">'+svg('play',14,2)+'</span>'
      + '  </button>'
      + '</div>'
      + '<div class="eta-stats-grid">'
      + '  <div class="eta-stat-card"><div class="eta-stat-head">'+svg('flame',13)+' Streak</div><div class="eta-stat-num"><span class="v">'+s.streak+'</span><span class="u">Tag'+(s.streak===1?'':'e')+'</span></div><div class="eta-week-dots">'+week.map(function(d){ return '<div class="'+(d.today?'today':'')+(d.done?' done':'')+'"></div>'; }).join('')+'</div></div>'
      + '  <div class="eta-stat-card"><div class="eta-stat-head">'+svg('list',13)+' Wortschatz</div><div class="eta-stat-num"><span class="v">'+(typeof WORDS!=='undefined'?WORDS.length:0)+'</span><span class="u">Wörter</span></div><div style="font-size:11px;color:var(--muted);margin-top:8px"><span style="color:var(--primary-soft);font-weight:600">'+s.mast+'</span> gemeistert</div></div>'
      + '</div>'
      + '<div class="eta-modes">'
      + [
          {mode:'flash',name:'Karteikarten',sub:'Freie Übung',icon:'flash'},
          {mode:'quiz', name:'Quiz',         sub:'Multiple Choice',icon:'quiz'},
          {mode:'fill', name:'Lückentext',   sub:'Selber tippen',icon:'fill'},
          {mode:'list', name:'Wortliste',    sub:(typeof WORDS!=='undefined'?WORDS.length:0)+' Wörter',icon:'list'},
        ].map(function(m){ return '<div class="eta-mode-row" onclick="setMode(\''+m.mode+'\')">'+'<div class="eta-mode-ico">'+svg(m.icon,16)+'</div><div class="eta-mode-body"><div class="eta-mode-name">'+m.name+'</div><div class="eta-mode-sub">'+m.sub+'</div></div>'+svg('chevronRight',15)+'</div>'; }).join('')
      + '</div></div>';
  }
  window.renderToday = renderToday;

  // ── 7. Wortliste-Gruppierung ─────────────────────────
  var listGrouped = false;

  function renderListGrouped() {
    var app = document.getElementById('app'); if (!app) return;
    var groups = [
      { key:'due',    label:'Fällig heute',    pill:'due',    words:[] },
      { key:'learn',  label:'In Bearbeitung',  pill:'learn',  words:[] },
      { key:'new',    label:'Neu',             pill:'new',    words:[] },
      { key:'master', label:'Gemeistert',      pill:'master', words:[] },
    ];
    var today = (typeof SRS !== 'undefined') ? SRS.todayISO() : '';
    (typeof WORDS !== 'undefined' ? WORDS : []).forEach(function(w) {
      var e = (typeof SRS !== 'undefined') ? SRS.entry(w.id) : { level:0, nextDue:'' };
      var lvl = e.level || 0;
      if (lvl >= 7) { groups[3].words.push(w); }
      else if (lvl === 0) { groups[2].words.push(w); }
      else if (e.nextDue <= today) { groups[0].words.push(w); }
      else { groups[1].words.push(w); }
    });
    var html = '<div style="padding-bottom:8px">'
      + '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">'
      + '  <div><span style="font-size:22px;font-weight:700;letter-spacing:-0.5px;color:var(--text)">Wortliste</span><span style="font-size:12px;color:var(--muted);margin-left:8px">'+(typeof WORDS!=='undefined'?WORDS.length:0)+' Wörter</span></div>'
      + '  <button class="eta-list-group-btn active" onclick="window.__etaToggleGroup()">'+svg('layers',13)+' Gruppiert</button>'
      + '</div>';
    groups.forEach(function(g) {
      if (!g.words.length) return;
      html += '<div class="eta-group-header"><span class="eta-group-pill '+g.pill+'">'+g.words.length+'</span>'+g.label+'</div>';
      html += '<div style="background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:12px">';
      g.words.forEach(function(w, i) {
        var e = (typeof SRS !== 'undefined') ? SRS.entry(w.id) : { level:0 };
        var dotsHtml = '<div style="display:flex;gap:2px">';
        for (var d=0; d<7; d++) dotsHtml += '<div style="width:5px;height:5px;border-radius:1.5px;background:'+(d<(e.level||0)?'var(--primary)':'var(--card-hover)')+'"></div>';
        dotsHtml += '</div>';
        html += '<div style="padding:12px 14px;border-top:'+(i>0?'1px solid var(--border)':'none')+';display:flex;align-items:center;gap:12px">'
          + '  <div style="flex:1;min-width:0">'
          + '    <div style="display:flex;align-items:baseline;gap:8px;margin-bottom:2px">'
          + '      <div style="font-size:15px;font-weight:600;color:var(--text)">'+w.word+'</div>'
          + '      <div style="font-size:11px;color:var(--muted);font-family:ui-monospace,monospace">'+w.pronunciation+'</div>'
          + '    </div>'
          + '    <div style="font-size:12.5px;color:var(--text-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+w.translation+'</div>'
          + '  </div>'
          + dotsHtml + '</div>';
      });
      html += '</div>';
    });
    html += '</div>';
    app.innerHTML = html;
  }
  window.renderListGrouped = renderListGrouped;

  window.__etaToggleGroup = function() {
    listGrouped = !listGrouped;
    if (listGrouped) renderListGrouped();
    else { try { renderList(); } catch(e) {} }
  };

  // Gruppier-Button in normale Wortliste injizieren (MutationObserver)
  var appEl = document.getElementById('app');
  if (appEl) {
    new MutationObserver(function() {
      if (window.mode !== 'list') return;
      if (listGrouped) return;
      var hdr = appEl.querySelector('.list-header');
      if (hdr && !hdr.querySelector('.eta-list-group-btn')) {
        var btn = document.createElement('button');
        btn.className = 'eta-list-group-btn';
        btn.innerHTML = svg('layers',13) + ' Gruppieren';
        btn.onclick = function(){ listGrouped = true; renderListGrouped(); };
        hdr.appendChild(btn);
      }
      // Such-Icon
      appEl.querySelectorAll('.search-bar').forEach(function(bar){
        if (bar.querySelector('.eta-search-icon')) return;
        var icon = document.createElement('span'); icon.className = 'eta-search-icon';
        icon.innerHTML = svg('search',15); bar.appendChild(icon);
      });
    }).observe(appEl, { childList: true, subtree: false });
  }

  // ── 8. Floating Stats-Bar aufbauen ───────────────────
  function buildFloatingBar() {
    var ex = document.getElementById('eta-floating-bar'); if (ex) ex.remove();
    var bar = document.createElement('div'); bar.id = 'eta-floating-bar';
    // Streak
    var streakEl = document.createElement('div'); streakEl.className = 'eta-streak'; streakEl.id = 'eta-streak-display';
    var ss = (typeof Stats !== 'undefined' && Stats.state && Stats.state.streak) || 0;
    streakEl.innerHTML = svg('flame',12) + ' <span>' + ss + '</span>';
    streakEl.onclick = function(){ openStreakSheet(); };
    bar.appendChild(streakEl);
    // Theme toggle
    var themeBtn = document.createElement('button'); themeBtn.className = 'eta-theme'; themeBtn.setAttribute('aria-label','Theme');
    var setThemeIcon = function(){ themeBtn.innerHTML = svg(document.body.classList.contains('dark')?'sun':'moon',15); };
    setThemeIcon();
    themeBtn.onclick = function(){ if(typeof toggleTheme==='function') toggleTheme(); else document.body.classList.toggle('dark'); setTimeout(setThemeIcon,30); };
    bar.appendChild(themeBtn);
    document.body.appendChild(bar);
  }
  buildFloatingBar();

  // Streak live updaten
  if (typeof Stats !== 'undefined' && Stats.save) {
    var oSave = Stats.save.bind(Stats);
    Stats.save = function(){ var r=oSave.apply(this,arguments); var el=document.getElementById('eta-streak-display'); if(el){ var s=(Stats.state&&Stats.state.streak)||0; el.innerHTML=svg('flame',12)+' <span>'+s+'</span>'; } updateSyncClass(); return r; };
  }

  // ── 9. Streak-Sheet ──────────────────────────────────
  function openStreakSheet() {
    var sheet = document.getElementById('eta-streak-sheet');
    if (!sheet) {
      sheet = document.createElement('div'); sheet.id = 'eta-streak-sheet';
      sheet.onclick = function(e){ if(e.target===sheet) closeStreakSheet(); };
      document.body.appendChild(sheet);
    }
    var s = getStats(); var week = weekActivity();
    var days = ['Mo','Di','Mi','Do','Fr','Sa','So'];
    sheet.innerHTML = '<div class="eta-sheet-inner">'
      + '<span class="eta-sheet-handle"></span>'
      + '<h3>Dein Fortschritt</h3>'
      + '<div class="eta-stat-grid">'
      + '  <div class="eta-stat-cell"><span class="v">'+s.streak+'</span><span class="l">Streak</span></div>'
      + '  <div class="eta-stat-cell"><span class="v" style="color:var(--ok)">'+s.mast+'</span><span class="l">Gemeistert</span></div>'
      + '  <div class="eta-stat-cell"><span class="v" style="color:var(--primary)">'+s.due+'</span><span class="l">Fällig</span></div>'
      + '</div>'
      + '<div class="eta-week-strip">'
      + week.map(function(d,i){ return '<div class="eta-day"><div class="eta-day-dot'+(d.done?' done':'')+(d.today?' today':'')+'">'+( d.done ? svg('check',14,2.5) : '')+'</div><div class="eta-day-lbl">'+days[i]+'</div></div>'; }).join('')
      + '</div>'
      + '<button class="eta-sheet-close" onclick="closeStreakSheet()">Schließen</button>'
      + '</div>';
    sheet.classList.add('open');
  }
  window.openStreakSheet = openStreakSheet;
  window.closeStreakSheet = function(){ var s=document.getElementById('eta-streak-sheet'); if(s) s.classList.remove('open'); };

  // ── 10. Heute direkt starten (kein setTimeout-Flicker) ─
  window.mode = 'today';
  if (navTabs) {
    navTabs.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('active'); });
    var todayTabEl = navTabs.querySelector('[data-mode="today"]');
    if (todayTabEl) todayTabEl.classList.add('active');
  }
  try { renderToday(); } catch(e) { console.warn('[ETA v2.4] renderToday sofort fehlgeschlagen:', e); }
  // Fallback falls SRS etc. noch nicht bereit
  setTimeout(function(){ if(window.mode==='today') { try { renderToday(); } catch(e){} } }, 200);

  console.log('[ETA v2.4] 10 UX-Verbesserungen aktiv');
})();
</script>

<script id="eta-v25-script">
(function(){
  var svg = window.__etaSvg || function(){ return ''; };

  // ═══ FEATURE: Wort-Normalisierung (Kleinschreibung außer Akronyme) ═══
  try {
    if (typeof WORDS !== 'undefined' && Array.isArray(WORDS)) {
      WORDS.forEach(function(w){
        if (!w.word) return;
        var word = w.word;
        // "to Xxx" Verben: nur das Hauptwort kleinschreiben
        if (/^to [A-Z]/.test(word)) { w.word = 'to ' + word.charAt(3).toLowerCase() + word.slice(4); return; }
        // Akronyme (TV, CEO) komplett groß lassen
        if (word === word.toUpperCase()) return;
        // Erstes Wort: ist Rest klein? Dann ist es ein normales Substantiv → kleinschreiben
        var firstWord = word.split(' ')[0];
        if (/^[A-Z][a-z]+$/.test(firstWord)) {
          w.word = word.charAt(0).toLowerCase() + word.slice(1);
        }
      });
    }
  } catch(e) { console.warn('[v2.5] Normalisierung:', e); }

  // ═══ FEATURE: Levenshtein für Tippmodus-Toleranz ═══
  function levenshtein(a, b) {
    a = a.toLowerCase().trim(); b = b.toLowerCase().trim();
    var m = a.length, n = b.length;
    if (!m) return n; if (!n) return m;
    var prev = []; for (var j=0;j<=n;j++) prev[j]=j;
    for (var i=1;i<=m;i++){ var cur=[i]; for (var k=1;k<=n;k++){ cur[k]=Math.min(prev[k]+1,cur[k-1]+1,prev[k-1]+(a[i-1]===b[k-1]?0:1)); } prev=cur; }
    return prev[n];
  }
  function normAnswer(s) { return (s||'').toLowerCase().replace(/^to\s+/,'').replace(/[.,!?]/g,'').trim(); }

  // ═══ FEATURE: Tippmodus ═══
  var typeDeck = [], typeIdx = 0, typeChecked = false, typeCorrect = 0, typeWrong = 0;

  function startType() {
    try {
      typeDeck = (typeof SRS !== 'undefined' && SRS.dueQueue) ? SRS.dueQueue(WORDS).slice(0,10) : [];
      if (!typeDeck.length && typeof WORDS !== 'undefined') typeDeck = WORDS.slice().sort(function(){return Math.random()-0.5;}).slice(0,10);
    } catch(e) { typeDeck = (typeof WORDS!=='undefined'?WORDS.slice(0,10):[]); }
    typeIdx = 0; typeChecked = false; typeCorrect = 0; typeWrong = 0;
    window.mode = 'type';
    setActiveTab(null);
    renderType();
  }

  function renderType() {
    var app = document.getElementById('app'); if (!app) return;
    if (typeIdx >= typeDeck.length) {
      app.innerHTML = '<div class="eta-type-card"><div class="eta-type-prompt">Runde beendet</div>'
        + '<div style="font-size:44px;font-weight:800;color:var(--primary);letter-spacing:-1px;margin:8px 0">'+typeCorrect+'/'+typeDeck.length+'</div>'
        + '<div style="color:var(--muted);font-size:14px;margin-bottom:18px">richtig getippt</div>'
        + '<button class="eta-set-btn primary" onclick="window.__etaStartType()">Neue Runde</button>'
        + '<button class="eta-set-btn" onclick="setMode(\'today\')">Zurück zu Heute</button></div>';
      return;
    }
    var w = typeDeck[typeIdx];
    var pct = Math.round((typeIdx/typeDeck.length)*100);
    app.innerHTML = '<div style="margin-bottom:14px"><div style="height:5px;background:var(--border);border-radius:999px;overflow:hidden"><div style="width:'+pct+'%;height:100%;background:linear-gradient(90deg,var(--primary),var(--primary-soft))"></div></div>'
      + '<div style="display:flex;justify-content:space-between;margin-top:5px;font-size:10.5px;color:var(--muted)"><span>Tippen '+(typeIdx+1)+' / '+typeDeck.length+'</span><span>✓ '+typeCorrect+' · ✗ '+typeWrong+'</span></div></div>'
      + '<div class="eta-type-card">'
      + '  <div class="eta-type-prompt">Wie heißt das auf Englisch?</div>'
      + '  <div class="eta-type-word">'+w.translation+'</div>'
      + '  <div class="eta-type-badges"><span class="badge badge-type">'+(w.wordType||'')+'</span><span class="badge '+(typeof diffColor==='function'?diffColor(w.difficulty):'')+'">'+(w.difficulty||'')+'</span></div>'
      + '  <input class="eta-type-input" id="etaTypeInput" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="englisches Wort tippen…" />'
      + '  <div id="etaTypeFeedback"></div>'
      + '  <button class="eta-set-btn primary" id="etaTypeBtn" style="margin-top:14px" onclick="window.__etaCheckType()">Prüfen</button>'
      + '</div>';
    var inp = document.getElementById('etaTypeInput');
    if (inp) { inp.focus(); inp.addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); window.__etaCheckType(); } }); }
  }

  window.__etaCheckType = function() {
    var w = typeDeck[typeIdx]; if (!w) return;
    var inp = document.getElementById('etaTypeInput');
    var btn = document.getElementById('etaTypeBtn');
    var fb = document.getElementById('etaTypeFeedback');
    if (!typeChecked) {
      var ans = normAnswer(inp.value);
      var target = normAnswer(w.word);
      var dist = levenshtein(ans, target);
      var ok = ans.length > 0 && dist <= (target.length > 6 ? 2 : 1);
      typeChecked = true;
      if (ok) {
        typeCorrect++; inp.classList.add('ok');
        fb.className = 'eta-type-feedback ok'; fb.innerHTML = svg('check',16,2.5) + ' Richtig! ' + (dist>0?'(kleiner Tippfehler verziehen)':'');
        try { if (typeof SRS!=='undefined') SRS.markCorrect(w.id); } catch(e){}
      } else {
        typeWrong++; inp.classList.add('err');
        fb.className = 'eta-type-feedback err'; fb.innerHTML = svg('x',16,2.5) + ' Lösung: <strong>'+w.word+'</strong>';
        try { if (typeof SRS!=='undefined') SRS.markWrong(w.id); } catch(e){}
      }
      inp.disabled = true;
      btn.textContent = (typeIdx+1 >= typeDeck.length) ? 'Ergebnis' : 'Weiter';
    } else {
      typeIdx++; typeChecked = false; renderType();
    }
  };
  window.__etaStartType = startType;

  // ═══ FEATURE: Schwierige Wörter ═══
  function getHardWords() {
    if (typeof WORDS === 'undefined') return [];
    return WORDS.map(function(w){
      var e = (typeof SRS!=='undefined' && SRS.entry) ? SRS.entry(w.id) : {ok:0,wrong:0};
      var total = (e.ok||0)+(e.wrong||0);
      var rate = total>0 ? (e.wrong||0)/total : 0;
      return { w:w, rate:rate, total:total, wrong:e.wrong||0 };
    }).filter(function(x){ return x.total>=2 && x.rate>0.4; }).sort(function(a,b){ return b.rate-a.rate; });
  }

  function renderHardList() {
    var app = document.getElementById('app'); if (!app) return;
    window.mode = 'hardlist'; setActiveTab(null);
    var hard = getHardWords();
    var html = '<div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">'
      + '<button class="eta-set-btn" style="width:auto;padding:8px 12px;margin:0" onclick="setMode(\'today\')">'+svg('chevronRight',14)+'</button>'
      + '<div><div style="font-size:20px;font-weight:700;letter-spacing:-0.4px">Schwierige Wörter</div><div style="font-size:12px;color:var(--muted)">'+hard.length+' Wörter mit hoher Fehlerquote</div></div></div>';
    if (!hard.length) {
      html += '<div class="eta-type-card"><div style="font-size:40px;margin-bottom:10px">🎯</div><div style="font-size:16px;font-weight:600;margin-bottom:6px">Noch keine Problemwörter</div><div style="color:var(--muted);font-size:13.5px">Übe ein paar Runden — Wörter mit Fehlerquote über 40% erscheinen hier automatisch.</div></div>';
    } else {
      html += '<button class="eta-set-btn primary" style="margin-bottom:14px" onclick="window.__etaDrillHard()">'+svg('train',16)+' Diese Wörter gezielt üben</button>';
      html += '<div style="background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden">';
      hard.forEach(function(x,i){
        html += '<div style="padding:12px 14px;border-top:'+(i>0?'1px solid var(--border)':'none')+';display:flex;align-items:center;gap:12px">'
          + '<div style="flex:1;min-width:0"><div style="font-size:15px;font-weight:600;color:var(--text)">'+x.w.word+'</div><div style="font-size:12.5px;color:var(--text-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+x.w.translation+'</div></div>'
          + '<div style="text-align:right"><div style="font-size:14px;font-weight:700;color:var(--err)">'+Math.round(x.rate*100)+'%</div><div style="font-size:10px;color:var(--muted)">'+x.wrong+'× falsch</div></div></div>';
      });
      html += '</div>';
    }
    app.innerHTML = html;
  }
  window.renderHardList = renderHardList;
  window.__etaDrillHard = function() {
    var hard = getHardWords().map(function(x){ return x.w; });
    if (!hard.length) return;
    typeDeck = hard.slice(0,10); typeIdx=0; typeChecked=false; typeCorrect=0; typeWrong=0;
    window.mode = 'type'; setActiveTab(null); renderType();
  };

  // ═══ Mode-Routing erweitern ═══
  function setActiveTab(m) {
    var nt = document.querySelector('.nav-tabs'); if (!nt) return;
    nt.querySelectorAll('.tab').forEach(function(t){ t.classList.toggle('active', m && t.dataset.mode===m); });
  }
  var prevRender = window.render;
  window.render = function() {
    if (window.mode === 'type') { renderType(); return; }
    if (window.mode === 'hardlist') { renderHardList(); return; }
    if (typeof prevRender === 'function') return prevRender.apply(this, arguments);
  };
  var prevSetMode = window.setMode;
  window.setMode = function(m, btn) {
    if (m === 'type') { startType(); return; }
    if (m === 'hardlist') { renderHardList(); return; }
    if (typeof prevSetMode === 'function') return prevSetMode.apply(this, arguments);
  };

  // ═══ Heute-Screen: Tippmodus + Schwierige Wörter als Mode-Cards ergänzen ═══
  // (per Injection in decorateApp, da v2.4-setMode die lokale renderToday aufruft)
  function injectExtraModeCards() {
    var modes = document.querySelector('.eta-modes');
    if (!modes || modes.querySelector('[data-eta-extra]')) return;
    var hardCount = getHardWords().length;
    var typeRow = document.createElement('div');
    typeRow.className = 'eta-mode-row'; typeRow.setAttribute('data-eta-extra','1');
    typeRow.setAttribute('onclick', "setMode('type')");
    typeRow.innerHTML = '<div class="eta-mode-ico">'+svg('fill',16)+'</div><div class="eta-mode-body"><div class="eta-mode-name">Tippmodus</div><div class="eta-mode-sub">Aktiv erinnern · selbst tippen</div></div>'+svg('chevronRight',15);
    modes.appendChild(typeRow);
    if (hardCount > 0) {
      var hardRow = document.createElement('div');
      hardRow.className = 'eta-mode-row'; hardRow.setAttribute('data-eta-extra','1');
      hardRow.setAttribute('onclick', "setMode('hardlist')");
      hardRow.innerHTML = '<div class="eta-mode-ico" style="color:var(--err)">'+svg('trending',16)+'</div><div class="eta-mode-body"><div class="eta-mode-name">Schwierige Wörter</div><div class="eta-mode-sub">'+hardCount+' Wörter mit hoher Fehlerquote</div></div>'+svg('chevronRight',15);
      modes.appendChild(hardRow);
    }
  }

  // ═══ FEATURE: Einstellungs-Sheet (Zahnrad) ═══
  function buildSettingsButton() {
    var bar = document.getElementById('eta-floating-bar'); if (!bar) return;
    if (document.getElementById('eta-settings-btn')) return;
    var btn = document.createElement('button');
    btn.id = 'eta-settings-btn'; btn.className = 'eta-theme';
    btn.setAttribute('aria-label','Einstellungen');
    btn.innerHTML = svg('settings',15);
    btn.onclick = openSettings;
    bar.appendChild(btn);
  }
  function openSettings() {
    var sheet = document.getElementById('eta-settings-sheet');
    if (!sheet) { sheet = document.createElement('div'); sheet.id='eta-settings-sheet'; sheet.onclick=function(e){ if(e.target===sheet) closeSettings(); }; document.body.appendChild(sheet); }
    var goal = (typeof Stats!=='undefined' && Stats.state) ? (Stats.state.dailyGoal||20) : 20;
    var goals = [10,20,30,50];
    sheet.innerHTML = '<div class="eta-sheet-inner"><span class="eta-sheet-handle"></span><h3>Einstellungen</h3>'
      + '<div class="eta-set-section"><div class="eta-set-label">Tagesziel (Wörter pro Tag)</div><div class="eta-goal-opts">'
      + goals.map(function(g){ return '<button class="eta-goal-opt'+(g===goal?' active':'')+'" onclick="window.__etaSetGoal('+g+')">'+g+'</button>'; }).join('')
      + '</div></div>'
      + '<div class="eta-set-section"><div class="eta-set-label">Synchronisation</div><button class="eta-set-btn" onclick="closeSettings();if(typeof openSyncModal===\'function\')openSyncModal()">'+svg('cloud',16)+' Geräte-Sync einrichten</button></div>'
      + '<div class="eta-set-section"><div class="eta-set-label">Fortschritt</div><button class="eta-set-btn danger" onclick="window.__etaReset()">'+svg('x',16)+' Lernfortschritt zurücksetzen</button></div>'
      + '<button class="eta-set-btn" onclick="closeSettings()">Schließen</button></div>';
    sheet.classList.add('open');
  }
  window.closeSettings = function(){ var s=document.getElementById('eta-settings-sheet'); if(s) s.classList.remove('open'); };
  window.__etaSetGoal = function(g){ try { if(typeof Stats!=='undefined'){ Stats.state.dailyGoal=g; Stats.save(); } } catch(e){} openSettings(); if(window.mode==='today') renderToday(); };
  window.__etaReset = function(){ if(confirm('Wirklich den gesamten Lernfortschritt zurücksetzen? Das kann nicht rückgängig gemacht werden.')){ try { if(typeof SRS!=='undefined' && SRS.reset) SRS.reset(); else { localStorage.removeItem('srs_state'); } } catch(e){} location.reload(); } };

  // ═══ FEATURE: Zielwort in Beispielen hervorheben + Flaggen→Text + Sessions kürzen ═══
  function decorateApp() {
    var app = document.getElementById('app'); if (!app) return;
    // Zielwort hervorheben
    var w = null;
    try { if (window.mode==='train' && typeof trainDeck!=='undefined') w = trainDeck[typeof trainIdx!=='undefined'?trainIdx:0]; } catch(e){}
    app.querySelectorAll('.back-ex, .fc-front-example, .quiz-example').forEach(function(el){
      if (el.dataset.etaHl) return; el.dataset.etaHl = '1';
      var word = w && w.word ? w.word.replace(/^to\s+/,'') : null;
      if (!word) return;
      var stem = word.length>4 ? word.slice(0, word.length-2) : word;
      try {
        var re = new RegExp('\\b('+stem.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\w*)\\b','gi');
        el.querySelectorAll('*').length===0 && (el.innerHTML = el.innerHTML.replace(re, '<span class="eta-hl">$1</span>'));
      } catch(e){}
    });
    // Flaggen → Text
    app.querySelectorAll('.qdt-btn').forEach(function(btn){
      if (btn.dataset.etaDir) return;
      var txt = btn.textContent || '';
      if (txt.indexOf('🇬🇧')>-1 || /GB|🇬🇧/.test(txt)) {
        var enFirst = txt.indexOf('🇬🇧') < txt.indexOf('🇩🇪') || /^[^D]*EN/.test(txt);
        // Heuristik: Reihenfolge aus Originaltext
      }
    });
    // Sessions kürzen
    var hist = app.querySelector('.history-box');
    if (hist && !hist.dataset.etaCollapsed) {
      hist.dataset.etaCollapsed = '1';
      var rows = hist.querySelectorAll('.history-row');
      if (rows.length > 2) {
        hist.classList.add('eta-collapsed');
        var toggle = document.createElement('button');
        toggle.className = 'eta-history-toggle';
        toggle.textContent = 'Alle ' + rows.length + ' Sessions anzeigen';
        toggle.onclick = function(){ hist.classList.toggle('eta-collapsed'); toggle.textContent = hist.classList.contains('eta-collapsed') ? ('Alle '+rows.length+' Sessions anzeigen') : 'Weniger anzeigen'; };
        hist.appendChild(toggle);
      }
    }
  }
  // Flaggen-Umschalter robust zu Text machen (separater, sicherer Durchlauf)
  function fixDirButtons() {
    document.querySelectorAll('.qdt-btn').forEach(function(btn){
      if (btn.dataset.etaFixed) return; btn.dataset.etaFixed='1';
      var raw = btn.textContent.trim();
      // Originaltext enthält Flaggen + Pfeil. Wir leiten Richtung aus Position ab.
      var gb = raw.indexOf('🇬🇧'), de = raw.indexOf('🇩🇪');
      if (gb===-1 && de===-1) return;
      var enToDe = (gb>-1 && de>-1) ? gb < de : /en.?de/i.test(btn.getAttribute('onclick')||'');
      btn.innerHTML = '<span class="eta-dir-label">'+(enToDe ? 'EN → DE' : 'DE → EN')+'</span>';
    });
  }

  var appEl2 = document.getElementById('app');
  if (appEl2) {
    new MutationObserver(function(){ try { decorateApp(); fixDirButtons(); injectExtraModeCards(); } catch(e){} }).observe(appEl2, { childList:true, subtree:true });
  }

  // ═══ FEATURE: Level-up Mikro-Animation ═══
  if (typeof SRS !== 'undefined' && SRS.markCorrect) {
    var origMC = SRS.markCorrect.bind(SRS);
    SRS.markCorrect = function(id) {
      var before = 0; try { before = (SRS.entry(id).level)||0; } catch(e){}
      var r = origMC(id);
      try {
        var after = (SRS.entry(id).level)||0;
        if (after > before) {
          var el = document.createElement('div'); el.className='eta-levelup';
          el.innerHTML = svg('trending',16) + '<span class="lvl-from">Stufe '+before+'</span>'+svg('chevronRight',12)+'<span class="lvl-to">'+after+'</span>';
          document.body.appendChild(el);
          setTimeout(function(){ el.remove(); }, 1400);
        }
      } catch(e){}
      return r;
    };
  }

  // ═══ FEATURE: Onboarding (Erststart) ═══
  function maybeOnboard() {
    try { if (localStorage.getItem('eta_onboarded')==='1') return; } catch(e){ return; }
    var slides = [
      { icon:'today', title:'Willkommen bei ETA', text:'Dein persönlicher Englisch-Vokabeltrainer. Lerne effizient mit wissenschaftlich fundierter Wiederholung.' },
      { icon:'train', title:'Spaced Repetition', text:'Jedes Wort durchläuft 7 Stufen. Was du kannst, kommt seltener — was schwerfällt, öfter. So lernst du nachhaltig.' },
      { icon:'flame', title:'Bleib dran', text:'Erreiche dein Tagesziel und baue eine Streak auf. Tippmodus und Quiz fordern dein aktives Erinnern.' },
    ];
    var idx = 0;
    var ob = document.createElement('div'); ob.id='eta-onboard';
    document.body.appendChild(ob);
    function paint() {
      var s = slides[idx];
      ob.innerHTML = '<div class="eta-ob-inner"><div class="eta-ob-icon">'+svg(s.icon,28)+'</div>'
        + '<div class="eta-ob-title">'+s.title+'</div><div class="eta-ob-text">'+s.text+'</div>'
        + '<div class="eta-ob-dots">'+slides.map(function(_,i){ return '<div class="eta-ob-dot'+(i===idx?' active':'')+'"></div>'; }).join('')+'</div>'
        + '<button class="eta-ob-btn" onclick="window.__etaObNext()">'+(idx<slides.length-1?'Weiter':'Los geht\'s')+'</button>'
        + (idx<slides.length-1?'<button class="eta-ob-skip" onclick="window.__etaObDone()">Überspringen</button>':'')
        + '</div>';
    }
    window.__etaObNext = function(){ if(idx<slides.length-1){ idx++; paint(); } else { window.__etaObDone(); } };
    window.__etaObDone = function(){ try { localStorage.setItem('eta_onboarded','1'); } catch(e){} ob.classList.remove('open'); setTimeout(function(){ ob.remove(); }, 200); };
    paint(); ob.classList.add('open');
  }

  // ═══ FEATURE: Wortliste gruppiert als Default ═══
  try {
    var savedGroup = localStorage.getItem('eta_list_grouped');
    if (savedGroup === null) { localStorage.setItem('eta_list_grouped','1'); }
  } catch(e){}

  // Init
  setTimeout(function(){ try { buildSettingsButton(); } catch(e){} }, 100);
  setTimeout(function(){ try { maybeOnboard(); } catch(e){} }, 600);

  console.log('[ETA v2.5] Lernwirkung + UX Pack aktiv');
})();
</script>
<!-- ETA-PATCH-END -->

        onclick="openAddWord()">+</button>

<div class="modal-overlay" id="addWordModal" onclick="if(event.target===this) closeAddWord()">
  <div class="modal" role="dialog" aria-labelledby="awTitle">
    <h3 id="awTitle">Neues Wort hinzufügen</h3>
    <label for="awWord">Englisches Wort</label>
    <input id="awWord" type="text" placeholder="z. B. napkin" autocomplete="off" autocapitalize="off" spellcheck="false">
    <label for="awCat">Kategorie</label>
    <select id="awCat">
      <option value="Allgemein">Allgemein</option>
      <option value="TV">TV</option>
      <option value="Books">Books</option>
      <option value="Kitchen">Kitchen</option>
    </select>
    <div class="aw-status" id="awStatus"></div>
    <div class="modal-actions">
      <button type="button" class="btn btn-ghost" onclick="closeAddWord()">Abbrechen</button>
      <button type="button" class="btn btn-primary" id="awSubmit" onclick="submitAddWord()">Karte erstellen</button>
    </div>
  </div>
</div>

<script>
(function(){
  const REPO = 'timlbclaude/Englishtrainer';   // Ziel-Repo für die ETA-Issues

  window.openAddWord = function(){
    if(!Sync || !Sync.isConfigured()){
      alert('Bitte zuerst den Sync-Token einrichten (Wolken-Badge oben rechts). Der gleiche Token wird auch fürs Anlegen der ETA-Issues verwendet — er braucht zusätzlich Issues-Schreibrechte auf dem Repo Englishtrainer.');
      if(typeof openSyncModal === 'function') openSyncModal();
      return;
    }
    document.getElementById('awWord').value = '';
    document.getElementById('awStatus').textContent = '';
    document.getElementById('awStatus').className = 'aw-status';
    document.getElementById('addWordModal').classList.add('open');
    setTimeout(()=>document.getElementById('awWord').focus(), 60);
  };

  window.closeAddWord = function(){
    document.getElementById('addWordModal').classList.remove('open');
  };

  window.submitAddWord = async function(){
    const word = (document.getElementById('awWord').value || '').trim();
    const cat  = document.getElementById('awCat').value || 'Allgemein';
    const status = document.getElementById('awStatus');
    const btn = document.getElementById('awSubmit');
    if(!word){ status.textContent = 'Bitte ein Wort eingeben.'; status.className = 'aw-status err'; return; }

    btn.disabled = true;
    status.textContent = 'Issue wird erstellt…'; status.className = 'aw-status';
    try{
      const title = 'ETA: ' + word + ' #' + cat;
      const res = await Sync.api('POST', '/repos/' + REPO + '/issues', {
        title: title,
        body:  'Automatisch erstellt aus der App (FAB).'
      });
      status.innerHTML = '✓ Issue #' + res.number + ' angelegt. Bot verarbeitet in ~30 s.';
      status.className = 'aw-status ok';
      document.getElementById('awWord').value = '';
      setTimeout(closeAddWord, 1800);
    } catch(e){
      status.textContent = 'Fehler: ' + (e.message || e);
      status.className = 'aw-status err';
    } finally {
      btn.disabled = false;
    }
  };

  // Enter im Wortfeld = Absenden
  document.getElementById('awWord').addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ e.preventDefault(); submitAddWord(); }
  });
})();
</script>
