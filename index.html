<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4f46e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="English Trainer">
<link rel="apple-touch-icon" href="icon-192.png">
<title>English Trainer 🇬🇧</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- ═══════════════════════════════════════════════════════════════
     English Trainer — Struktur:
       index.html  Markup (diese Datei, bewusst klein)
       styles.css  Design (Tokens: siehe DESIGN.md)
       words.js    Daten (WORDS / WIKI_TITLES / IMG_URLS — vom Bot gepflegt)
       app.js      Logik
     ═══════════════════════════════════════════════════════════════ -->

<!-- Kopfzeile: Titel, Streak, Theme, Einstellungen -->
<div id="eta-topbar">
  <div class="v3-title"><div class="t1" id="v3T1"></div><div class="t2" id="v3T2"></div></div>
  <div class="v3-actions">
    <button class="v3-chipbtn" id="v3Streak" onclick="openProgressSheet()" aria-label="Fortschritt anzeigen"></button>
    <button class="v3-iconbtn" id="v3Theme" onclick="toggleTheme()" aria-label="Theme wechseln"></button>
    <button class="v3-iconbtn" id="v3Set" onclick="openSettings()" aria-label="Einstellungen"></button>
  </div>
</div>

<!-- Tab-Leiste (auf dem Handy unten) -->
<nav>
  <div class="nav-tabs">
    <button class="tab active" data-mode="today" onclick="setMode('today')"><span class="tab-icon"></span><span class="tab-label">Heute</span></button>
    <button class="tab" data-mode="train" onclick="setMode('train')"><span class="tab-icon"></span><span class="tab-label">Training</span></button>
    <button class="tab" data-mode="flash" onclick="setMode('flash')"><span class="tab-icon"></span><span class="tab-label">Karteikarten</span></button>
    <button class="tab" data-mode="quiz" onclick="setMode('quiz')"><span class="tab-icon"></span><span class="tab-label">Quiz</span></button>
    <button class="tab" data-mode="fill" onclick="setMode('fill')"><span class="tab-icon"></span><span class="tab-label">Lückentext</span></button>
    <button class="tab" data-mode="list" onclick="setMode('list')"><span class="tab-icon"></span><span class="tab-label">Wortliste</span></button>
  </div>
</nav>

<main id="app"></main>

<div id="mobileNextBar">
  <button class="mnb-btn" id="mobileNextBtn" onclick="mobileNextAction()">Weiter →</button>
</div>

<!-- Wort hinzufügen (FAB + Modal → erstellt ein ETA-Issue auf GitHub) -->
<button id="fabAdd" type="button"
        aria-label="Neues Wort hinzufügen"
        title="Neues Wort → erstellt automatisch eine Karteikarte"
        onclick="openAddWord()">+</button>

<div class="modal-overlay" id="addWordModal" onclick="if(event.target===this) closeAddWord()">
  <div class="modal" role="dialog" aria-labelledby="awTitle">
    <h3 id="awTitle">Neues Wort hinzufügen</h3>
    <label for="awWord">Englisches Wort</label>
    <input id="awWord" type="text" placeholder="z. B. napkin" autocomplete="off" autocapitalize="off" spellcheck="false">
    <label for="awCat">Kategorie</label>
    <select id="awCat">
      <option value="Allgemein">Allgemein</option>
      <option value="TV">TV</option>
      <option value="Books">Books</option>
      <option value="Kitchen">Kitchen</option>
      <option value="Reisen">Reisen</option>
    </select>
    <div class="aw-status" id="awStatus"></div>
    <div class="modal-actions">
      <button type="button" class="btn btn-ghost" onclick="closeAddWord()">Abbrechen</button>
      <button type="button" class="btn btn-primary" id="awSubmit" onclick="submitAddWord()">Karte erstellen</button>
    </div>
  </div>
</div>

<!-- Sync-Einrichtungs-Modal (Gist-basierte Geräte-Synchronisation) -->
<div class="modal-overlay" id="syncModal" onclick="if(event.target===this) closeSyncModal()">
  <div class="modal" role="dialog" aria-labelledby="syncModalTitle">
    <h2 id="syncModalTitle">☁️ Geräte-Synchronisation</h2>
    <p class="modal-sub">Synchronisiere deinen Lernfortschritt zwischen Handy und Laptop über einen privaten GitHub-Gist. Einmal pro Gerät einrichten.</p>
    <div class="hint" id="syncModalHint">Erstelle einen GitHub Personal Access Token mit <code>gist</code>-Berechtigung.</div>
    <label for="syncTokenInput">GitHub Personal Access Token</label>
    <input id="syncTokenInput" class="input mono" type="password" autocomplete="off" spellcheck="false" placeholder="ghp_...">
    <label for="syncGistInput">Gist-ID <span style="color:var(--muted);font-weight:400">(nur auf dem 2. Gerät nötig)</span></label>
    <div style="display:flex;gap:6px">
      <input id="syncGistInput" class="input mono" type="text" autocomplete="off" spellcheck="false" placeholder="z.B. 7a1b8c..." style="flex:1;margin-bottom:0">
      <button type="button" class="btn btn-ghost" onclick="copyGistIdToClipboard()" title="Gist-ID kopieren" style="padding:8px 12px">📋</button>
    </div>
    <div id="syncModalMsg" class="modal-msg"></div>
    <div class="modal-actions">
      <button type="button" class="btn btn-ghost" onclick="closeSyncModal()">Abbrechen</button>
      <button type="button" class="btn btn-primary" onclick="saveSyncSettings()">Speichern &amp; verbinden</button>
    </div>
  </div>
</div>

<script src="words.js"></script>
<script src="app.js"></script>
</body>
</html>
